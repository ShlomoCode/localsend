name: Issue 2453 historical iOS admission

on:
  workflow_dispatch:
    inputs:
      renderer:
        description: Diagnostic renderer, unchanged source and historical Flutter
        type: choice
        options: [impeller, skia]
        default: impeller
  push:
    branches: [codex/issue2453-investigation]
    paths: [.github/workflows/issue2453-ios.yml]

permissions:
  contents: read

concurrency:
  group: issue2453-ios
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out unchanged LocalSend 1.17 source
        uses: actions/checkout@v4
        with:
          ref: 7f21d1f9082a43803e05c37f021912e012145aa5
          path: source
          persist-credentials: false

      - name: Record source and SDK provenance
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$out/locks-before"
          git rev-parse HEAD > "$out/source-commit.txt"
          git status --porcelain > "$out/source-status-before.txt"
          printf '%s\n' '${{ inputs.renderer }}' > "$out/renderer.txt"
          cp .fvmrc app/pubspec.lock app/ios/Podfile.lock "$out/locks-before/"
          shasum -a 256 "$out/locks-before/"* > "$out/locks-before.sha256"
          sw_vers > "$out/runner.txt"
          uname -m >> "$out/runner.txt"
          ls -d /Applications/Xcode*.app > "$out/available-xcode.txt"
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version > "$out/xcode.txt"
          xcodebuild -showsdks >> "$out/xcode.txt"

      - name: Install historical pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: false
          pub-cache: false

      - name: Resolve original locked dependencies
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install 3.24.5
          fvm flutter --version > "$GITHUB_WORKSPACE/evidence/flutter.txt"
          pod --version > "$GITHUB_WORKSPACE/evidence/cocoapods.txt"
          fvm flutter precache --ios
          fvm flutter pub get --enforce-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/evidence/resolve.log"

      - name: Build uninstrumented unsigned device app
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.pub-cache/bin:$PATH"
          args=()
          if [[ '${{ inputs.renderer }}' == skia ]]; then args+=(--no-enable-impeller); fi
          fvm flutter build ios --release --no-codesign "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/build.log"

      - name: Package the normal device artifact
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence"
          app=app/build/ios/iphoneos/Runner.app
          test -d "$app"
          test "$(lipo -archs "$app/Runner")" = arm64
          mkdir -p "$out/package/Payload"
          ditto "$app" "$out/package/Payload/Runner.app"
          (cd "$out/package" && ditto -c -k --keepParent Payload ../localsend-1.17.0-unsigned-device.ipa)
          rm -rf "$out/package"
          shasum -a 256 "$out/localsend-1.17.0-unsigned-device.ipa" > "$out/ipa.sha256"
          plutil -p "$app/Info.plist" > "$out/runner-plist.txt"
          find "$app" -type f -exec shasum -a 256 {} \; > "$out/device-bundle.sha256"
          printf '%s\n' 'Rebuilt unchanged 1.17 source with pinned Flutter3.24.5. Unsigned arm64, not the historical App Store binary. BrowserStack normal signing/admission remains to be verified.' > "$out/artifact-scope.txt"

      - name: Preserve source state on success or failure
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$out/locks-after"
          cp .fvmrc app/pubspec.lock app/ios/Podfile.lock "$out/locks-after/"
          shasum -a 256 "$out/locks-after/"* > "$out/locks-after.sha256"
          git status --porcelain > "$out/source-status-after.txt"
          git diff > "$out/generated-source-diff.patch"

      - name: Retain build and admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2453-ios-1.17-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
