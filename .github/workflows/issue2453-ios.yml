name: Issue 2453 historical iOS admission

on:
  workflow_dispatch:
    inputs:
      flutter_sdk:
        description: Diagnostic Flutter SDK for historical app source
        type: choice
        options: ['3.24.5', '3.32.8']
        default: '3.24.5'
      renderer:
        description: Diagnostic renderer, unchanged source and historical Flutter
        type: choice
        options: [impeller, skia, flutter-metal-layer]
        default: impeller
  push:
    branches: [codex/issue2453-investigation]
    paths: [.github/workflows/issue2453-ios.yml]

permissions:
  contents: read

concurrency:
  group: issue2453-ios
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out unchanged LocalSend 1.17 source
        uses: actions/checkout@v4
        with:
          ref: 7f21d1f9082a43803e05c37f021912e012145aa5
          path: source
          persist-credentials: false

      - name: Record source and SDK provenance
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$out/locks-before"
          git rev-parse HEAD > "$out/source-commit.txt"
          git status --porcelain > "$out/source-status-before.txt"
          printf '%s\n' '${{ inputs.renderer }}' > "$out/renderer.txt"
          printf '%s\n' '${{ inputs.flutter_sdk }}' > "$out/selected-sdk.txt"
          cp .fvmrc app/pubspec.lock app/ios/Podfile.lock "$out/locks-before/"
          shasum -a 256 "$out/locks-before/"* > "$out/locks-before.sha256"
          sw_vers > "$out/runner.txt"
          uname -m >> "$out/runner.txt"
          ls -d /Applications/Xcode*.app > "$out/available-xcode.txt"
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version > "$out/xcode.txt"
          xcodebuild -showsdks >> "$out/xcode.txt"

      - name: Install historical pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '${{ inputs.flutter_sdk }}'
          cache: false
          pub-cache: false

      - name: Resolve original locked dependencies
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          if [[ '${{ inputs.flutter_sdk }}' != 3.24.5 ]]; then
            sed -i '' 's/3.24.5/${{ inputs.flutter_sdk }}/' ../.fvmrc
            # Flutter3.32 SDK pins intl0.20 and path1.9.1; retain other declared app dependencies.
            sed -i '' 's/intl: \^0.19.0/intl: ^0.20.2/' pubspec.yaml
            sed -i '' 's/path: 1.9.0/path: 1.9.1/' pubspec.yaml
            git diff -- ../.fvmrc pubspec.yaml > "$GITHUB_WORKSPACE/evidence/sdk-input.patch"
          fi
          fvm install '${{ inputs.flutter_sdk }}'
          fvm flutter --version > "$GITHUB_WORKSPACE/evidence/flutter.txt"
          pod --version > "$GITHUB_WORKSPACE/evidence/cocoapods.txt"
          fvm flutter precache --ios
          if [[ '${{ inputs.flutter_sdk }}' == 3.24.5 ]]; then
            fvm flutter pub get --enforce-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/evidence/resolve.log"
          else
            fvm flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/evidence/resolve.log"
          fi

      - name: Repair excluded-platform dependency metadata for newer SDK
        if: inputs.flutter_sdk != '3.24.5'
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.pub-cache/bin:$PATH"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const {fileURLToPath} = require('url');
          const config = JSON.parse(fs.readFileSync('.dart_tool/package_config.json'));
          const pkg = config.packages.find(p => p.name === 'open_filex');
          const root = fileURLToPath(new URL(pkg.rootUri, new URL('file://' + path.resolve('.dart_tool/package_config.json'))));
          const file = path.join(root, 'pubspec.yaml');
          function hashes(dir = root) {
            return fs.readdirSync(dir, {withFileTypes:true}).flatMap(entry => {
              const absolute = path.join(dir, entry.name);
              return entry.isDirectory() ? hashes(absolute) : [[path.relative(root, absolute), crypto.createHash('sha256').update(fs.readFileSync(absolute)).digest('hex')]];
            }).sort((a,b) => a[0].localeCompare(b[0]));
          }
          const before = hashes();
          const original = fs.readFileSync(file, 'utf8');
          if (!original.includes('version: 4.5.0') || !original.includes('default_package: dartPluginClass')) throw Error('Unexpected pinned plugin metadata');
          const repaired = original.replace(/      windows:[\s\S]*$/, '');
          if (!repaired.includes('      ios:') || !repaired.includes('pluginClass: OpenFilePlugin') || repaired.includes('default_package:')) throw Error('Unexpected repair result');
          const out = process.env.GITHUB_WORKSPACE + '/evidence';
          fs.writeFileSync(out + '/open-filex-original-pubspec.yaml', original);
          fs.writeFileSync(out + '/open-filex-repaired-pubspec.yaml', repaired);
          fs.writeFileSync(file, repaired);
          const after = hashes();
          const withoutMetadata = list => list.filter(([name]) => name !== 'pubspec.yaml');
          if (JSON.stringify(withoutMetadata(before)) !== JSON.stringify(withoutMetadata(after))) throw Error('Dependency code changed');
          fs.writeFileSync(out + '/open-filex-tree-before.json', JSON.stringify(before,null,2));
          fs.writeFileSync(out + '/open-filex-tree-after.json', JSON.stringify(after,null,2));
          fs.writeFileSync(out + '/open-filex-code-comparison.json', JSON.stringify({version:'4.5.0',allFilesExceptPubspecEqual:true,iosPluginDeclarationUnchanged:true},null,2));
          NODE
          diff -u "$GITHUB_WORKSPACE/evidence/open-filex-original-pubspec.yaml" "$GITHUB_WORKSPACE/evidence/open-filex-repaired-pubspec.yaml" > "$GITHUB_WORKSPACE/evidence/open-filex-metadata.patch" || test "$?" = 1
          shasum -a 256 "$GITHUB_WORKSPACE/evidence/"open-filex-*-pubspec.yaml > "$GITHUB_WORKSPACE/evidence/open-filex-metadata.sha256"
          fvm flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/evidence/resolve-after-metadata-repair.log"

      - name: Configure supported diagnostic renderer input
        if: inputs.renderer != 'impeller'
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.renderer }}' == skia ]]; then
            /usr/libexec/PlistBuddy -c 'Add :FLTEnableImpeller bool false' ios/Runner/Info.plist
            test "$(plutil -extract FLTEnableImpeller raw ios/Runner/Info.plist)" = false
          elif [[ '${{ inputs.renderer }}' == flutter-metal-layer ]]; then
            /usr/libexec/PlistBuddy -c 'Add :FLTUseFlutterMetalLayer bool true' ios/Runner/Info.plist
            test "$(plutil -extract FLTUseFlutterMetalLayer raw ios/Runner/Info.plist)" = true
          else
            exit 64
          fi
          cp ios/Runner/Info.plist "$GITHUB_WORKSPACE/evidence/diagnostic-runner-input.plist"
          git diff -- ios/Runner/Info.plist > "$GITHUB_WORKSPACE/evidence/diagnostic-input.patch"

      - name: Build uninstrumented unsigned device app
        working-directory: source/app
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm flutter build ios --release --no-codesign 2>&1 | tee "$GITHUB_WORKSPACE/evidence/build.log"

      - name: Package the normal device artifact
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence"
          app=app/build/ios/iphoneos/Runner.app
          test -d "$app"
          test "$(lipo -archs "$app/Runner")" = arm64
          mkdir -p "$out/package/Payload"
          ditto "$app" "$out/package/Payload/Runner.app"
          (cd "$out/package" && ditto -c -k --keepParent Payload ../localsend-1.17.0-unsigned-device.ipa)
          rm -rf "$out/package"
          shasum -a 256 "$out/localsend-1.17.0-unsigned-device.ipa" > "$out/ipa.sha256"
          plutil -p "$app/Info.plist" > "$out/runner-plist.txt"
          find "$app" -type f -exec shasum -a 256 {} \; > "$out/device-bundle.sha256"
          printf '%s\n' 'Rebuilt historical1.17 source; requested Flutter SDK and renderer recorded separately. Diagnostic SDK input and solver drift retained. Unsigned arm64, not the historical App Store binary. BrowserStack normal signing/admission remains to be verified.' > "$out/artifact-scope.txt"

      - name: Preserve source state on success or failure
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/evidence"
          mkdir -p "$out/locks-after"
          cp .fvmrc app/pubspec.lock app/ios/Podfile.lock "$out/locks-after/"
          shasum -a 256 "$out/locks-after/"* > "$out/locks-after.sha256"
          git status --porcelain > "$out/source-status-after.txt"
          git diff > "$out/generated-source-diff.patch"

      - name: Retain build and admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2453-ios-1.17-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error
