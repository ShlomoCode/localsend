name: Diagnose 2861 SDK font attribution
on:
  workflow_dispatch:
jobs:
  probe-build:
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      max-parallel: 1
      matrix:
        sdk: ['3.24.5', '3.38.10', '3.41.9']
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.sdk }}
          cache: true
      - name: Build identical diagnostic component
        shell: pwsh
        run: |
          $folder="$env:RUNNER_TEMP/font_probe"
          flutter create --platforms windows --project-name font_probe $folder
          Copy-Item support/diagnostics/font-probe/main.dart "$folder/lib/main.dart"
          Set-Location $folder
          flutter build windows --release
          flutter --version | Out-File build/windows/x64/runner/Release/sdk.txt
      - uses: actions/upload-artifact@v6
        with:
          name: font-probe-${{ matrix.sdk }}
          path: ${{ runner.temp }}/font_probe/build/windows/x64/runner/Release
  observe:
    needs: probe-build
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: font-probe-*
          path: ${{ runner.temp }}/probes
      - name: Observe same components on same Windows font installation
        shell: powershell
        run: ./support/diagnostics/font-probe/observe.ps1 -ReleaseRoot $env:RUNNER_TEMP/probes -EvidenceDirectory $env:RUNNER_TEMP/font-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: font-evidence
          path: ${{ runner.temp }}/font-evidence
