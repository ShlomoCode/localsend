name: Diagnose 2381 favorite aliases
on:
  push:
    branches: [codex/diagnose-2381-favorite-alias]
  workflow_dispatch:
    inputs:
      current_baseline:
        description: Use the untouched current baseline artifact
        type: boolean
        default: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download reported release
        if: ${{ !inputs.current_baseline }}
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/localsend/localsend/releases/download/v1.17.0/LocalSend-1.17.0-windows-x86-64.zip -OutFile $env:RUNNER_TEMP/app.zip
          Expand-Archive $env:RUNNER_TEMP/app.zip $env:RUNNER_TEMP/release
      - name: Download untouched current baseline
        if: ${{ inputs.current_baseline }}
        uses: actions/download-artifact@v6
        with:
          name: baseline2381-current
          run-id: 38102878653
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release
      - name: Install screenshot OCR
        run: choco install tesseract --no-progress -y
      - name: Run actual Windows apps
        shell: powershell
        run: |
          $exe = (Get-ChildItem $env:RUNNER_TEMP/release -Recurse -Filter localsend_app.exe | Select-Object -First 1).FullName
          & ./support/test/windows/diagnose2381.ps1 -Executable $exe -EvidenceDirectory $env:RUNNER_TEMP/evidence2381
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence2381
          path: |
            ${{ runner.temp }}/evidence2381
            !${{ runner.temp }}/evidence2381/*-app/**
