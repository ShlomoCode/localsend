name: Diagnose 2861 translated Settings labels
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download legitimate releases (historical x64 under emulation)
        shell: pwsh
        run: |
          foreach ($version in @('1.17.0','1.18.2')) {
            Invoke-WebRequest "https://github.com/localsend/localsend/releases/download/v$version/LocalSend-$version-windows-x86-64.zip" -OutFile "$env:RUNNER_TEMP/$version.zip"
            Expand-Archive "$env:RUNNER_TEMP/$version.zip" "$env:RUNNER_TEMP/releases/$version"
          }
      - name: Download exact untouched current baseline
        uses: actions/download-artifact@v6
        with:
          name: baseline2890-c1ce
          run-id: 38132668217
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/releases/current
      - name: Render actual Settings in controlled windows
        shell: powershell
        run: ./support/diagnostics/windows2861.ps1 -ReleaseRoot $env:RUNNER_TEMP/releases -EvidenceDirectory $env:RUNNER_TEMP/evidence2861
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence2861
          path: |
            ${{ runner.temp }}/evidence2861
            !${{ runner.temp }}/evidence2861/*-app/**
