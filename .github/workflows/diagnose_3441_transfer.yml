name: Issue 3441 admitted original app transfer
on:
  workflow_dispatch:
    inputs:
      admitted:
        description: Coordinator admitted one 45-minute job and one Samsung S23 Android 13 session
        type: boolean
        default: false
        required: true
  push:
    branches:
      - codex/diagnose-3441-transfer
permissions:
  contents: read
concurrency:
  group: issue3441-owned-diagnostics
  cancel-in-progress: false
jobs:
  original-transfer:
    if: >-
      github.repository == 'ShlomoCode/localsend' &&
      ((github.event_name == 'workflow_dispatch' && inputs.admitted == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[issue3441-transfer-admitted]')))
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ISSUE3441_ADMITTED: '1'
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      TRANSFER_EVIDENCE_DIRECTORY: evidence/issue3441/android
    steps:
      - name: Record hard deadline before all preparation
        run: |
          started=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          deadline=$(date -u -v+45M '+%Y-%m-%dT%H:%M:%SZ')
          printf 'ISSUE3441_JOB_STARTED_UTC=%s\nISSUE3441_JOB_DEADLINE_UTC=%s\n' "$started" "$deadline" >> "$GITHUB_ENV"
          printf 'BS_LOCAL_ID=issue3441-%s-attempt-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64
      - name: Record budget and create masked private transport token
        run: |
          mkdir -p evidence/issue3441
          node --input-type=module <<'JS'
          import {randomBytes} from 'node:crypto';
          import {appendFileSync,writeFileSync} from 'node:fs';
          const token=randomBytes(32).toString('hex');
          console.log('::add-mask::'+token);
          appendFileSync(process.env.GITHUB_ENV,'RELAY_TOKEN='+token+'\n');
          appendFileSync(process.env.GITHUB_ENV,'FIXTURE_DIRECTORY='+process.cwd()+'/evidence/issue3441/fixtures\n');
          writeFileSync('evidence/issue3441/budget.json',JSON.stringify({startUtc:process.env.ISSUE3441_JOB_STARTED_UTC,hardDeadlineUtc:process.env.ISSUE3441_JOB_DEADLINE_UTC,cleanupReserveMinutes:10,jobLimitMinutes:45,maxOwnedAndroidSessions:1,commit:process.env.GITHUB_SHA},null,2));
          JS
      - name: Install cloud recording and fixture tools
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          ffmpeg -version > evidence/issue3441/ffmpeg-version.txt
      - name: Provision documented tools and verify original APK before private upload
        timeout-minutes: 5
        run: bash support/diagnostics/3441/provision-transfer.sh
      - name: Install complete unchanged official receiver with fresh native preferences
        timeout-minutes: 4
        run: bash support/diagnostics/3441/setup.sh
      - name: Generate and decode media fixtures
        timeout-minutes: 4
        run: node support/diagnostics/3441/fixtures.mjs
      - name: Build and privately upload owned fixture and transport helpers
        timeout-minutes: 5
        run: bash support/diagnostics/3441-android/build-helpers.sh
      - name: Native readiness and original Android control then 207 media then same 73 retry
        timeout-minutes: 40
        run: node support/diagnostics/3441/run-transfer.mjs
      - name: Recover cleanup of only the owned Android session and tunnel
        if: always()
        timeout-minutes: 2
        run: node support/diagnostics/3441-android/cleanup.mjs
      - name: Verify receiver signature and stop owned capture and receiver
        if: always()
        timeout-minutes: 1
        run: |
          mkdir -p evidence/issue3441
          signature_status=0
          codesign --verify --deep --strict --verbose=2 /Applications/LocalSend.app 2> evidence/issue3441/codesign-after.txt || signature_status=$?
          test ! -e /Applications/LocalSend.app/Contents/MacOS/settings.json || signature_status=1
          cleanup_status=0
          node support/diagnostics/3441/cleanup.mjs || cleanup_status=$?
          pkill -f '^/Applications/LocalSend.app/Contents/MacOS/' || true
          rm -rf "$RUNNER_TEMP/issue3441"
          test "$signature_status" = 0 || exit "$signature_status"
          exit "$cleanup_status"
      - uses: actions/upload-artifact@v6
        if: always()
        timeout-minutes: 5
        with:
          name: issue3441-original-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/issue3441/
          compression-level: 0
          if-no-files-found: warn
