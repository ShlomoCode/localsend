name: LocalSend Flatpak reproduction in Linux Mint VM

on:
  workflow_dispatch:
  push:
    branches:
      - codex/repro-flatpak-fontcache-3553

permissions:
  contents: read

jobs:
  mint-vm:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install VM host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 expect p7zip-full curl acl e2fsprogs socat
      - name: Run the reproduction in the official Mint live desktop
        env:
          OUT: ${{ github.workspace }}/evidence-mint-vm
        run: bash support/diagnostics/mint-vm.sh
      - name: Upload VM and guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localsend-flatpak-mint-vm-evidence
          path: evidence-mint-vm/
          if-no-files-found: warn
          retention-days: 14
