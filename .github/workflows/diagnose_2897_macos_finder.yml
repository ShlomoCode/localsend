name: Diagnose 2897 macOS Finder handover
on:
  workflow_dispatch:
  push:
    branches: [codex/bug-2897-finder-diagnostic]
    paths:
      - .github/workflows/diagnose_2897_macos_finder.yml
permissions:
  contents: read
concurrency:
  group: issue-2897-macos-finder
  cancel-in-progress: false
jobs:
  finder:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Qualify native GUI and observe official 1.18.2
        shell: bash
        run: bash support/diagnostics/2897/run.sh
      - name: Preserve observations even when qualification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2897-macos-finder-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/issue2897
          if-no-files-found: error
          retention-days: 14
