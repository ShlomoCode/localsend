name: Sprint 301 iOS text editor qualification
on:
  push:
    branches: ['codex/**']
    paths:
      - .github/workflows/sprint-301-ios-text-editor.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprint-301-ios-text-editor
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BS_SPRINT_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BS_SPRINT_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      EVIDENCE_DIR: evidence301
      COORDINATOR_ADMISSION_JSON: ${{ vars.ISSUE301_ADMISSION }}
    steps:
      - name: Set actual job deadline before preparation
        shell: bash
        run: |
          printf 'ISSUE301_JOB_DEADLINE_UTC=%s\n' "$(date -u -d '+20 minutes' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install normal packaged recording tools within 150 seconds
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p evidence301
          setup_started_ns=$(date +%s%N)
          setup_status=0
          sudo timeout --signal=TERM --kill-after=5s 140s bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends ffmpeg
            ffmpeg -version
            ffprobe -version
          ' > evidence301/recording-tools-install.log 2>&1 || setup_status=$?
          setup_elapsed_ms=$(( ($(date +%s%N) - setup_started_ns) / 1000000 ))
          printf '{"elapsedMs":%s,"exitStatus":%s,"maximumMs":150000,"commandDeadlineSeconds":140,"terminationGraceSeconds":5,"receiptReserveSeconds":5}\n' "$setup_elapsed_ms" "$setup_status" > evidence301/recording-tools-setup.json
          test "$setup_elapsed_ms" -le 150000
          exit "$setup_status"
      - name: Freeze diagnostic source
        shell: bash
        run: |
          mkdir -p evidence301
          command -v ffprobe > evidence301/ffprobe-path.txt
          command -v ffmpeg > evidence301/ffmpeg-path.txt
          git rev-parse HEAD > evidence301/harness-source-head.txt
          sha256sum support/diagnostics/issue301/ios-text-editor.mjs .github/workflows/sprint-301-ios-text-editor.yml > evidence301/harness-source-sha256.txt
      - name: One bounded device attempt
        shell: bash
        run: timeout --signal=TERM --kill-after=10s 720s node support/diagnostics/issue301/ios-text-editor.mjs
      - name: Reconcile only the owned session and retain original provider video
        if: always()
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 60s node support/diagnostics/issue301/ios-text-editor.mjs --cleanup
      - name: Retain diagnostic evidence (private signed URLs must not be printed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue301-ios-text-editor-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence301/
          retention-days: 30
          if-no-files-found: error
