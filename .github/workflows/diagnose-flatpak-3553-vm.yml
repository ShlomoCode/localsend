name: Diagnose favorite edit confirmation
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional accepted candidate commit for the matched UI replay
        required: false
        default: ''
concurrency:
  group: issue1840-favorite-confirm
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: inputs.candidate_sha != ''
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate-source
      - uses: actions/checkout@v4
        if: inputs.candidate_sha != ''
        with:
          ref: c1ce322fb3acf08e44f329b8b7208b8b0d91e244
          path: baseline-test-source
      - uses: actions/download-artifact@v4
        with:
          name: issue2754-c1ce-flutter3419-linux-x64
          run-id: 38132747719
          github-token: ${{ github.token }}
          path: /tmp/current1840
      - name: Prepare ordinary X11 desktop and historical release
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool scrot tesseract-ocr dbus-x11 libgtk-3-0 libayatana-appindicator3-1 ffmpeg libegl1 libgl1-mesa-dri libgles2 at-spi2-core python3-pil
          mkdir -p /tmp/evidence1840 /tmp/release1840 /tmp/current1840/app
          curl -fL https://github.com/localsend/localsend/releases/download/v1.17.0/LocalSend-1.17.0-linux-x86-64.tar.gz -o /tmp/release1840/release.tar.gz
          tar -xzf /tmp/release1840/release.tar.gz -C /tmp/release1840
          echo '98f6e749c0eb470b7d2bb4a365f704328ae7dc4bbc6d78ddf2d574dfb63cc20b  /tmp/current1840/source-bundle.tar.gz' | sha256sum -c -
          tar -xzf /tmp/current1840/source-bundle.tar.gz -C /tmp/current1840/app
          cp -r /tmp/current1840/provenance /tmp/evidence1840/current-provenance
          sha256sum /tmp/release1840/release.tar.gz /tmp/current1840/source-bundle.tar.gz > /tmp/evidence1840/artifact-hashes.txt
          uname -a > /tmp/evidence1840/environment.txt
          cat /etc/os-release >> /tmp/evidence1840/environment.txt
          dpkg-query -W > /tmp/evidence1840/packages.tsv
          echo "$ImageOS $ImageVersion $GITHUB_SHA $GITHUB_RUN_ID" >> /tmp/evidence1840/environment.txt
      - name: Install candidate build dependencies
        if: inputs.candidate_sha != ''
        run: sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev pkg-config binutils jq
      - uses: subosito/flutter-action@v2
        if: inputs.candidate_sha != ''
        with:
          flutter-version: '3.41.9'
          channel: stable
      - name: Install exact Rust toolchain
        if: inputs.candidate_sha != ''
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build accepted immutable candidate and run focused checks
        if: inputs.candidate_sha != ''
        env:
          PROBE_SOURCE_DIR: ${{ github.workspace }}/candidate-source
          PROBE_SOURCE_SHA: ${{ inputs.candidate_sha }}
          PROBE_BUILD_DIR: /tmp/candidate1840
        run: |
          export PROBE_FLUTTER="$(command -v flutter)"
          bash support/diagnostics/1840-build.sh
          cd candidate-source/app
          dart format --output=none --set-exit-if-changed lib/widget/dialogs/favorite_edit_dialog.dart test/widget/favorite_edit_confirmation_test.dart
          flutter test test/unit/provider/favorites_provider_test.dart test/widget/favorite_edit_confirmation_test.dart
          flutter analyze lib/widget/dialogs/favorite_edit_dialog.dart test/widget/favorite_edit_confirmation_test.dart
          cd ../..
          mkdir -p /tmp/candidate1840/app
          tar -xzf /tmp/candidate1840/source-bundle.tar.gz -C /tmp/candidate1840/app
          cp -r /tmp/candidate1840/provenance /tmp/evidence1840/candidate-provenance
      - name: Prove committed regression test detects the untouched baseline
        if: inputs.candidate_sha != ''
        run: |
          mkdir -p baseline-test-source/app/test/widget
          cp candidate-source/app/test/widget/favorite_edit_confirmation_test.dart baseline-test-source/app/test/widget/
          cd baseline-test-source/app
          flutter pub get --enforce-lockfile
          set +e
          flutter test test/widget/favorite_edit_confirmation_test.dart > /tmp/evidence1840/baseline-regression-test.log 2>&1
          outcome=$?
          set -e
          test "$outcome" -ne 0
          grep -q 'Expected: no matching candidates' /tmp/evidence1840/baseline-regression-test.log
      - uses: actions/upload-artifact@v4
        if: inputs.candidate_sha != '' && always()
        with:
          name: candidate1840-linux-x64
          path: /tmp/candidate1840
      - name: Replay through actual application UI
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' bash -c 'openbox >/tmp/evidence1840/openbox.log 2>&1 & python3 support/diagnostics/1840-ui.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence1840
          path: /tmp/evidence1840
          if-no-files-found: error
