      - name: Collect session diagnostics and identities
        if: always()
        run: |
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          if [ -f /tmp/localsend-vm/video.pid ]; then kill -INT "$(cat /tmp/localsend-vm/video.pid)" || true; sleep 3; fi
          timeout 30 ssh "${ssh_opts[@]}" probe@127.0.0.1 'journalctl --user -b --no-pager; sudo journalctl -b -p warning --no-pager' > evidence/vm/session-journal.txt 2>&1 || true
          # Keep normal package outputs/provenance, excluding build cache and
          # live runtime mounts; recursive SCP stalled there in the failed run.
          if timeout 600 ssh "${ssh_opts[@]}" probe@127.0.0.1 \
            "tar -C /home/probe/evidence --exclude='./source-flatpak/flathub/.flatpak-builder' --exclude='./source-flatpak/*/build/var' -czf - ." \
            > evidence/vm/guest-evidence.tar.gz 2> evidence/vm/guest-collection.log; then
            mkdir -p evidence/vm/guest-files
            tar -xzf evidence/vm/guest-evidence.tar.gz -C evidence/vm/guest-files
            sha256sum evidence/vm/guest-evidence.tar.gz > evidence/vm/guest-evidence-SHA256SUMS
            printf 'COLLECTION_STATUS=complete\n' >> evidence/vm/guest-collection.log
          else
            printf 'COLLECTION_STATUS=incomplete EXIT=%s\n' "$?" >> evidence/vm/guest-collection.log
          fi
          /tmp/localsend-vm/capture "$GITHUB_WORKSPACE/evidence/vm/final.png" || true
          printf 'quit\n' | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
          sudo chown -R "$(id -u):$(id -g)" evidence/vm
          chmod -R a+rX evidence/vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-source-3161-evidence
          path: evidence/vm/
