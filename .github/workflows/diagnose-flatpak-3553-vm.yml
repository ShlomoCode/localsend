name: Diagnose original GNOME Zoom 3161 finite
concurrency:
  group: issue3161-gnome-diagnostic
  cancel-in-progress: false
on:
  workflow_dispatch:
jobs:
  gnome-zoom:
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    steps:
      - name: Fix absolute whole-job budget before checkout
        run: |
          cut -d' ' -f1 /proc/uptime > /tmp/3161-job-start
          date -u +%FT%T.%N > /tmp/3161-job-start-utc
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Check immutable finite sources on cloud and stage oracle
        run: |
          set -euo pipefail
          for source in .diagnostics/3161/finite-original/*.sh; do bash -n "$source"; done
          python3 -m py_compile .diagnostics/3161/finite-original/display-session.py
          mkdir -p /tmp/localsend-source-input
          cp -r .diagnostics/3161/geometry-oracle /tmp/localsend-source-input/
          mkdir -p evidence/vm
          cp /tmp/3161-job-start /tmp/3161-job-start-utc evidence/vm/
          sha256sum .diagnostics/3161/finite-original/*.sh .diagnostics/3161/finite-original/*.py > evidence/vm/finite-source-SHA256SUMS
      - name: Install VM tools and prepare Debian 13 guest
        env:
          START_VERSION: trixie
          GRAPHICS: virgl
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-gui qemu-utils cloud-image-utils socat imagemagick openssh-client xvfb mesa-utils xdotool x11-apps ffmpeg tesseract-ocr
          mkdir -p evidence/vm /tmp/localsend-vm /home/runner/localsend-vm
          df -Th /home/runner /tmp | tee evidence/vm/host-filesystems.txt
          disk_type=$(findmnt -no FSTYPE -T /home/runner)
          disk_free_kb=$(df -Pk /home/runner | awk 'NR == 2 {print $4}')
          test "$disk_type" != tmpfs
          test "$disk_free_kb" -ge 10485760
          curl --fail --location --retry 3 \
            --output /home/runner/localsend-vm/debian.img \
            "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2"
          sha256sum /home/runner/localsend-vm/debian.img > evidence/vm/debian-image-sha256.txt
          qemu-img resize /home/runner/localsend-vm/debian.img 36G
          ssh-keygen -q -t ed25519 -N '' -f /tmp/localsend-vm/id_ed25519
          probe_key=$(cat /tmp/localsend-vm/id_ed25519.pub)
          cat > /tmp/localsend-vm/user-data <<EOF
          #cloud-config
          users:
            - default
            - name: probe
              groups: [adm, sudo, audio, video, render]
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $probe_key
          package_update: true
          packages:
            - task-gnome-desktop
            - flatpak
            - gdb
            - binutils
            - curl
            - openssh-server
            - libayatana-appindicator3-1
            - python3-pyatspi
            - flatpak-builder
            - ruby
            - jq
            - git
            - ostree
            - orca
            - dbus-x11
            - x11-utils
            - gnome-shell-extensions
            - gnome-text-editor
          runcmd:
            - [sh, -c, "mkdir -p /etc/gdm3 && printf '[daemon]\\nAutomaticLoginEnable=True\\nAutomaticLogin=probe\\n' > /etc/gdm3/daemon.conf"]
            - [systemctl, set-default, graphical.target]
            - [systemctl, enable, gdm3]
          power_state:
            mode: reboot
            timeout: 30
            condition: true
          EOF
          printf 'instance-id: localsend-3161\nlocal-hostname: localsend-3161\n' > /tmp/localsend-vm/meta-data
          cloud-localds /home/runner/localsend-vm/seed.iso /tmp/localsend-vm/user-data /tmp/localsend-vm/meta-data
          gpu_args=(-device virtio-vga -display none -vnc 127.0.0.1:1)
          if [ "$GRAPHICS" = virgl ]; then
            touch /tmp/localsend-vm/virgl
            Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX > evidence/vm/host-xvfb.log 2>&1 &
            export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11
            for i in $(seq 1 20); do if xdpyinfo >/dev/null 2>&1; then break; fi; sleep 1; done
            glxinfo -B > evidence/vm/host-glx.txt
            gpu_args=(-device virtio-vga-gl -display sdl,gl=on)
          fi
          cat > /tmp/localsend-vm/capture <<'CAPTURE'
          #!/bin/bash
          set -euo pipefail
          target=$1
          if [ -f /tmp/localsend-vm/virgl ]; then
            DISPLAY=:99 xwd -root -silent | convert xwd:- "$target"
          else
            ppm="${target%.png}.ppm"
            printf 'screendump %s\n' "$ppm" | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor
            sudo chown "$(id -u):$(id -g)" "$ppm"
            convert "$ppm" "$target"
          fi
          CAPTURE
          chmod +x /tmp/localsend-vm/capture
          sudo --preserve-env=DISPLAY,LIBGL_ALWAYS_SOFTWARE,SDL_VIDEODRIVER qemu-system-x86_64 \
            -machine accel=kvm:tcg -cpu Skylake-Client,vendor=GenuineIntel,-vmx,-hle,-rtm -smp 2 -m 6144 \
            -drive file=/home/runner/localsend-vm/debian.img,if=virtio,format=qcow2 \
            -drive file=/home/runner/localsend-vm/seed.iso,media=cdrom,readonly=on \
            -audiodev wav,id=audio3161,path=$GITHUB_WORKSPACE/evidence/vm/guest-audio.wav,out.frequency=16000,out.channels=1 \
            -device ich9-intel-hda -device hda-duplex,audiodev=audio3161 \
            "${gpu_args[@]}" -usb -device usb-tablet \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -monitor unix:/tmp/localsend-vm/monitor,server,nowait \
            -serial file:evidence/vm/serial.log \
            -daemonize 2> evidence/vm/qemu-start.log
          printf 'Image: Debian 13 %s generic cloud image + task-gnome-desktop\nCPU: QEMU Skylake-Client,vendor=GenuineIntel,-vmx,-hle,-rtm on KVM host\nGraphics: %s\n' "$START_VERSION" "$GRAPHICS" > evidence/vm/host-setup.txt
          uname -a >> evidence/vm/host-setup.txt
          lscpu > evidence/vm/host-cpu.txt
          free -m >> evidence/vm/host-setup.txt
          df -Th /home/runner /tmp >> evidence/vm/host-setup.txt

      - name: Wait for a complete GDM login session
        run: |
          set -u
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          ready=0
          for i in $(seq 1 90); do
            if timeout 12 ssh "${ssh_opts[@]}" probe@127.0.0.1 'cloud-init status --wait >/dev/null 2>&1 && systemctl is-active --quiet gdm3 && loginctl list-sessions --no-legend | grep -q probe && find /run/user/$(id -u) -maxdepth 1 -type s -name "wayland-*" | grep -q .' >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [ $((i % 5)) = 0 ]; then
              timeout 15 ssh "${ssh_opts[@]}" probe@127.0.0.1 'cloud-init status; ps -eo pid,stat,pcpu,comm | grep -E "apt|dpkg|gnome|gdm"; df -h /' >> evidence/vm/provision-progress.txt 2>&1 || true
              /tmp/localsend-vm/capture "$GITHUB_WORKSPACE/evidence/vm/provision-$i.png" || true
            fi
            sleep 20
          done
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'uname -a; cloud-init status; systemctl status gdm3 --no-pager; loginctl list-sessions; ls -la /run/user/$(id -u)/wayland-* 2>&1' > evidence/vm/guest-session.txt 2>&1 || true
          printf 'GDM_SESSION_READY=%s\n' "$ready" | tee -a evidence/vm/guest-session.txt
          if [ "$ready" != 1 ]; then
            printf 'screendump %s\n' "$GITHUB_WORKSPACE/evidence/vm/setup.ppm" | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
            exit 1
          fi
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'lscpu' > evidence/vm/guest-cpu.txt
          grep -q 'GenuineIntel' evidence/vm/guest-cpu.txt
          grep -q 'Skylake' evidence/vm/guest-cpu.txt

      - name: Install legitimate 1.17 Flatpak and record identities
        run: |
          set -euo pipefail
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          timeout 1200 ssh "${ssh_opts[@]}" probe@127.0.0.1 'bash -s' > evidence/vm/install.log 2>&1 <<'GUEST'
          set -euo pipefail
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.localsend.localsend_app
          flatpak remote-info --log flathub org.localsend.localsend_app > /tmp/flatpak-history.txt
          cat /tmp/flatpak-history.txt
          old_commit=df68d5e6649a894643f4bff68711e52ad86c2f26c93470139f2ff1e2b38e4418
          sudo flatpak update -y --commit="$old_commit" org.localsend.localsend_app
          # Deploy the runtime declared by the historical app, without altering its contents.
          runtime=$(flatpak info --show-runtime org.localsend.localsend_app)
          sudo flatpak install -y flathub "$runtime"
          sudo flatpak update -y --commit=d27f7a6a974e40b061070bec1be9e1b52a7a6872b271e6a45c2c34a48bf6fedf "$runtime"
          test "$(flatpak info --show-commit org.localsend.localsend_app)" = "$old_commit"
          test "$(flatpak info --show-commit "$runtime")" = d27f7a6a974e40b061070bec1be9e1b52a7a6872b271e6a45c2c34a48bf6fedf
          flatpak info org.localsend.localsend_app
          flatpak info org.localsend.localsend_app | grep -Eq "Version: +1.17.0"
          flatpak info --show-metadata org.localsend.localsend_app
          flatpak info --show-commit org.localsend.localsend_app
          for ref in $(flatpak list --runtime --columns=ref); do flatpak info "$ref"; done
          sha256sum "$(flatpak info -l org.localsend.localsend_app)/files/localsend_app"
          cat /etc/os-release
          gnome-shell --version
          flatpak --version
          lspci -nn
          loginctl list-sessions
          GUEST

      - name: Stage the checked-out supported compositor oracle
        run: |
          timeout --kill-after=1s 20s scp -i /tmp/localsend-vm/id_ed25519 -P 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -r /tmp/localsend-source-input probe@127.0.0.1:/home/probe/source-input
      - name: Install supported compositor oracle before a fresh GNOME session
        run: |
          set -euo pipefail
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          timeout 30 ssh "${ssh_opts[@]}" probe@127.0.0.1 'export XDG_RUNTIME_DIR=/run/user/$(id -u); export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus; sh /home/probe/source-input/geometry-oracle/install-guest.sh; sudo systemctl restart gdm3' > evidence/vm/geometry-oracle-install.log 2>&1
          ready=0
          for attempt in $(seq 1 30); do
            if timeout 12 ssh "${ssh_opts[@]}" probe@127.0.0.1 'export XDG_RUNTIME_DIR=/run/user/$(id -u); export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus; /usr/bin/python3 /home/probe/source-input/geometry-oracle/snapshot-guest.py' > evidence/vm/oracle-ready.json 2> evidence/vm/oracle-ready-error.txt; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'export XDG_RUNTIME_DIR=/run/user/$(id -u); export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus; dpkg-query -W gnome-shell libmutter-16-0 python3-pyatspi; gnome-extensions info localsend-geometry-oracle@diagnostics.invalid' > evidence/vm/oracle-packages.txt 2>&1

      - name: Prepare live VM controls
        run: |
          set -euo pipefail
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'bash -s' <<'GUEST'
          cat > /home/probe/session-env <<'ENV'
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          export WAYLAND_DISPLAY=$(basename "$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name 'wayland-*' | head -1)")
          export XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=GNOME
          user_environment=$(systemctl --user show-environment)
          export DISPLAY=$(printf '%s\n' "$user_environment" | sed -n 's/^DISPLAY=//p' | head -1)
          export XAUTHORITY=$(printf '%s\n' "$user_environment" | sed -n 's/^XAUTHORITY=//p' | head -1)
          ENV
          mkdir -p /home/probe/evidence
          . /home/probe/session-env
          gsettings get org.gnome.desktop.interface toolkit-accessibility
          gsettings get org.gnome.desktop.a11y.applications screen-magnifier-enabled
          GUEST
          DISPLAY=:99 ffmpeg -y -progress evidence/vm/video-progress.txt -f x11grab -video_size 1280x800 -framerate 10 -i :99 -c:v libx264 -preset ultrafast -pix_fmt yuv420p evidence/vm/live-ui.mp4 > evidence/vm/video.log 2>&1 &
          echo $! > /tmp/localsend-vm/video.pid
          /tmp/localsend-vm/capture "$GITHUB_WORKSPACE/evidence/vm/ready.png"
      - name: One immutable finite original episode including immediate cleanup
        run: bash .diagnostics/3161/finite-original/run-finite.sh .diagnostics/3161/finite-original
      - name: Collect session diagnostics and identities
        if: always()
        run: |
          set -euo pipefail
          # Refuse collection if cancellation skipped controller/fallback joins.
          test -e evidence/vm/finite-original/scenario-joined
          test -e evidence/vm/finite-original/cleanup-joined
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          if [ -f /tmp/localsend-vm/video.pid ]; then kill -INT "$(cat /tmp/localsend-vm/video.pid)" || true; sleep 3; fi
          timeout 30 ssh "${ssh_opts[@]}" probe@127.0.0.1 'journalctl --user -b --no-pager; sudo journalctl -b -p warning --no-pager' > evidence/vm/session-journal.txt 2>&1 || true
          # Sample live application stdout separately; exclude active log writers
          # from the frozen guest tar. Samples are not complete final app logs.
          timeout --kill-after=1s 10s ssh "${ssh_opts[@]}" probe@127.0.0.1 'date -u +%FT%T.%N; cat /home/probe/evidence/localsend.log /home/probe/evidence/gtk-editor.log; date -u +%FT%T.%N' > evidence/vm/application-log-sample.txt 2>&1 || true
          if timeout 600 ssh "${ssh_opts[@]}" probe@127.0.0.1 \
            "tar -C /home/probe/evidence --exclude='./localsend.log' --exclude='./gtk-editor.log' -czf - ." \
            > evidence/vm/guest-evidence.tar.gz 2> evidence/vm/guest-collection.log; then
            mkdir -p evidence/vm/guest-files
            tar -xzf evidence/vm/guest-evidence.tar.gz -C evidence/vm/guest-files
            sha256sum evidence/vm/guest-evidence.tar.gz > evidence/vm/guest-evidence-SHA256SUMS
            printf 'COLLECTION_STATUS=complete\n' >> evidence/vm/guest-collection.log
          else
            printf 'COLLECTION_STATUS=incomplete EXIT=%s\n' "$?" >> evidence/vm/guest-collection.log
          fi
          /tmp/localsend-vm/capture "$GITHUB_WORKSPACE/evidence/vm/final.png" || true
          printf 'quit\n' | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
          sudo chown -R "$(id -u):$(id -g)" evidence/vm
          chmod -R a+rX evidence/vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gnome-source-3161-evidence
          path: evidence/vm/
