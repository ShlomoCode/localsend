name: Diagnose Flatpak startup 3553 in GNOME VM

on:
  push:
    branches:
      - codex/diagnose-flatpak-3553
    paths:
      - .github/workflows/diagnose-flatpak-3553-vm.yml
  workflow_dispatch:

jobs:
  full-session:
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    steps:
      - name: Install VM tools and prepare an Ubuntu 26.04 guest
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils socat imagemagick openssh-client
          mkdir -p evidence/vm /tmp/localsend-vm
          curl --fail --location --retry 3 \
            --output /tmp/localsend-vm/ubuntu.img \
            https://cloud-images.ubuntu.com/releases/26.04/release/ubuntu-26.04-server-cloudimg-amd64.img
          qemu-img resize /tmp/localsend-vm/ubuntu.img 24G
          ssh-keygen -q -t ed25519 -N '' -f /tmp/localsend-vm/id_ed25519
          probe_key=$(cat /tmp/localsend-vm/id_ed25519.pub)
          cat > /tmp/localsend-vm/user-data <<EOF
          #cloud-config
          users:
            - default
            - name: probe
              groups: [adm, sudo, audio, video, render]
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $probe_key
          package_update: true
          packages:
            - ubuntu-desktop-minimal
            - flatpak
            - gdb
            - curl
            - openssh-server
            - libayatana-appindicator3-1
          runcmd:
            - [sh, -c, "mkdir -p /etc/gdm3 && printf '[daemon]\\nAutomaticLoginEnable=True\\nAutomaticLogin=probe\\n' > /etc/gdm3/custom.conf"]
            - [systemctl, set-default, graphical.target]
            - [systemctl, enable, gdm3]
          power_state:
            mode: reboot
            timeout: 30
            condition: true
          EOF
          printf 'instance-id: localsend-3553\nlocal-hostname: localsend-3553\n' > /tmp/localsend-vm/meta-data
          cloud-localds /tmp/localsend-vm/seed.iso /tmp/localsend-vm/user-data /tmp/localsend-vm/meta-data
          sudo qemu-system-x86_64 \
            -machine accel=kvm:tcg -cpu host -smp 2 -m 6144 \
            -drive file=/tmp/localsend-vm/ubuntu.img,if=virtio,format=qcow2 \
            -drive file=/tmp/localsend-vm/seed.iso,media=cdrom,readonly=on \
            -device virtio-vga -usb -device usb-tablet \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -vnc 127.0.0.1:1 \
            -monitor unix:/tmp/localsend-vm/monitor,server,nowait \
            -serial file:evidence/vm/serial.log \
            -daemonize
          printf 'Image: Ubuntu 26.04 server cloud image + ubuntu-desktop-minimal\nCPU: KVM host model\nGraphics: virtio-vga\n' > evidence/vm/host-setup.txt
          uname -a >> evidence/vm/host-setup.txt
          free -m >> evidence/vm/host-setup.txt
          df -h /tmp >> evidence/vm/host-setup.txt

      - name: Wait for a complete GDM login session
        run: |
          set -u
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          ready=0
          for i in $(seq 1 90); do
            if timeout 12 ssh "${ssh_opts[@]}" probe@127.0.0.1 'cloud-init status --wait >/dev/null 2>&1 && systemctl is-active --quiet gdm3 && loginctl list-sessions --no-legend | grep -q probe && find /run/user/$(id -u) -maxdepth 1 -type s -name "wayland-*" | grep -q .' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 20
          done
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'uname -a; cloud-init status; systemctl status gdm3 --no-pager; loginctl list-sessions; ls -la /run/user/$(id -u)/wayland-* 2>&1' > evidence/vm/guest-session.txt 2>&1 || true
          printf 'GDM_SESSION_READY=%s\n' "$ready" | tee -a evidence/vm/guest-session.txt
          if [ "$ready" != 1 ]; then
            printf 'screendump %s\n' "$GITHUB_WORKSPACE/evidence/vm/setup.ppm" | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
            exit 1
          fi

      - name: Install and compare official deb and released Flatpak in the GDM session
        run: |
          set -euo pipefail
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          timeout 900 ssh "${ssh_opts[@]}" probe@127.0.0.1 'bash -s' > evidence/vm/install.log 2>&1 <<'GUEST' &
          set -e
          curl --fail --location --retry 3 -o /tmp/localsend.deb https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.deb
          sudo apt-get install -y /tmp/localsend.deb
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.localsend.localsend_app
          flatpak info org.localsend.localsend_app
          sha256sum /tmp/localsend.deb
          GUEST
          install_pid=$!
          for i in $(seq 1 30); do
            sleep 30
            if ! kill -0 "$install_pid" 2>/dev/null; then break; fi
            {
              date -u
              free -m
              df -h /tmp
              du -h /tmp/localsend-vm/ubuntu.img
              ps -eo pid,ppid,stat,pcpu,pmem,rss,wchan:32,comm,args | grep '[q]emu-system' || true
              cat /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io
              sudo journalctl -k --since '-2 minutes' --no-pager | tail -20
            } >> evidence/vm/host-monitor.log 2>&1
            if [ "$i" = 2 ] || [ "$i" = 10 ]; then
              printf 'screendump %s\n' "$GITHUB_WORKSPACE/evidence/vm/install-$i.ppm" | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
            fi
            timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'bash -s' >> evidence/vm/install-monitor.log 2>&1 <<'GUEST' || true
          date -u
          df -h /
          free -m
          ps -eo pid,ppid,stat,pcpu,rss,wchan:32,comm,args | grep -E 'flatpak|ostree|bwrap|apt-get|dpkg' | grep -v grep || true
          timeout 5 flatpak list --columns=application,branch,installation || true
          sudo journalctl -k --since '-1 minute' --no-pager | tail -30
          GUEST
          done
          set +e
          wait "$install_pid"
          install_status=$?
          set -e
          if [ "$install_status" -ne 0 ]; then
            echo "INSTALL_STATUS=$install_status"
            tail -60 evidence/vm/install.log
            tail -80 evidence/vm/install-monitor.log || true
            exit "$install_status"
          fi
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'bash -s' > evidence/vm/guest-environment.txt 2>&1 <<'GUEST'
          uname -a
          gnome-shell --version
          flatpak --version
          flatpak info --show-commit org.localsend.localsend_app
          flatpak info --show-commit org.freedesktop.Platform//26.08
          loginctl list-sessions
          for session in $(loginctl list-sessions --no-legend | awk '$3 == "probe" {print $1}'); do loginctl show-session "$session" -p Type -p State -p Desktop -p Display -p Seat; done
          ls -la /run/user/$(id -u)/wayland-* /run/user/$(id -u)/bus
          deb_binary=$(find /opt /usr -name localsend_app -type f -print -quit)
          sha256sum "$deb_binary" "$(flatpak info -l org.localsend.localsend_app)/files/localsend_app"
          GUEST
          for kind in deb flatpak; do
            timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 "bash -s -- $kind" <<'GUEST'
          set -u
          kind=$1
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          export WAYLAND_DISPLAY=$(basename "$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name 'wayland-*' | head -n 1)")
          export XDG_SESSION_TYPE=wayland
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          if [ "$kind" = deb ]; then
            deb_binary=$(find /opt /usr -name localsend_app -type f -print -quit)
            nohup "$deb_binary" > "/tmp/localsend-$kind.log" 2>&1 < /dev/null &
          else
            nohup flatpak run org.localsend.localsend_app > "/tmp/localsend-$kind.log" 2>&1 < /dev/null &
          fi
          echo "launcher=$!"
          GUEST
            sleep 25
            printf 'screendump %s\n' "$GITHUB_WORKSPACE/evidence/vm/$kind.ppm" | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
            test -s "evidence/vm/$kind.ppm"
            sudo chown "$(id -u):$(id -g)" "evidence/vm/$kind.ppm"
            convert "evidence/vm/$kind.ppm" "evidence/vm/$kind.png"
            timeout 25 ssh "${ssh_opts[@]}" probe@127.0.0.1 "bash -s -- $kind" > "evidence/vm/$kind-state.txt" 2>&1 <<'GUEST'
          set -u
          kind=$1
          echo "kind=$kind"
          ps -eo pid,ppid,stat,pcpu,comm,args | grep -E 'localsend|flatpak' | grep -v grep || true
          ss -lntup | grep 53317 || true
          echo "log_bytes=$(wc -c < "/tmp/localsend-$kind.log")"
          cat "/tmp/localsend-$kind.log"
          app_pid=$(pgrep -n -x localsend_app || pgrep -n -x localsend || true)
          if [ -n "$app_pid" ]; then ps -T -p "$app_pid" -o pid,tid,stat,pcpu,wchan:32,comm; fi
          if [ -n "$app_pid" ] && ! ss -lntup | grep -q 53317; then
            timeout 12 sudo gdb -q -batch -p "$app_pid" -ex 'thread apply all bt 12' || true
          fi
          pkill -x localsend_app || true
          pkill -x localsend || true
          GUEST
            if [ "$kind" = deb ] && ! grep -q 'tcp.*LISTEN.*53317' evidence/vm/deb-state.txt; then
              echo 'DEB_CONTROL=failed' | tee -a evidence/vm/deb-state.txt
              exit 1
            fi
            sleep 3
          done

      - name: Compare the reported generic kernel when available
        run: |
          set -euo pipefail
          ssh_opts=(-i /tmp/localsend-vm/id_ed25519 -p 2222 -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/tmp/localsend-vm/known_hosts -o ConnectTimeout=5)
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'uname -r; apt-cache policy linux-image-7.0.0-38-generic linux-modules-7.0.0-38-generic' > evidence/vm/kernel-policy.txt
          if ! grep -q 'Candidate: 7.0.0-38' evidence/vm/kernel-policy.txt; then
            echo 'KERNEL_38=unavailable' | tee -a evidence/vm/kernel-policy.txt
            exit 0
          fi
          timeout 600 ssh "${ssh_opts[@]}" probe@127.0.0.1 \
            'sudo DEBIAN_FRONTEND=noninteractive apt-get -t resolute-security -o Acquire::http::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends linux-image-7.0.0-38-generic' \
            > evidence/vm/kernel-install.log 2>&1 &
          kernel_install_pid=$!
          for i in $(seq 1 20); do
            sleep 30
            if ! kill -0 "$kernel_install_pid" 2>/dev/null; then break; fi
            {
              date -u
              free -m
              df -h /tmp
              du -h /tmp/localsend-vm/ubuntu.img
              ps -eo pid,ppid,stat,pcpu,pmem,rss,wchan:32,comm,args | grep '[q]emu-system' || true
              cat /proc/pressure/cpu /proc/pressure/memory /proc/pressure/io
              sudo journalctl -k --since '-2 minutes' --no-pager | tail -20
            } >> evidence/vm/kernel-host-monitor.log 2>&1
            timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'date -u; free -m; df -h /; ps -eo pid,ppid,stat,pcpu,rss,wchan:32,comm,args | grep -E "apt-get|http|dpkg" | grep -v grep || true' \
              >> evidence/vm/kernel-guest-monitor.log 2>&1 || true
          done
          set +e
          wait "$kernel_install_pid"
          kernel_install_status=$?
          set -e
          if [ "$kernel_install_status" -ne 0 ]; then
            echo "KERNEL_INSTALL_STATUS=$kernel_install_status"
            tail -80 evidence/vm/kernel-install.log
            exit "$kernel_install_status"
          fi
          timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 'sudo systemctl reboot' >/dev/null 2>&1 || true
          ready=0
          for i in $(seq 1 60); do
            sleep 10
            if timeout 8 ssh "${ssh_opts[@]}" probe@127.0.0.1 \
              'test "$(uname -r)" = 7.0.0-38-generic && systemctl is-active --quiet gdm3 && test -S /run/user/$(id -u)/wayland-0' \
              >/dev/null 2>&1; then ready=1; break; fi
          done
          echo "KERNEL_38_READY=$ready" | tee evidence/vm/kernel38-environment.txt
          timeout 15 ssh "${ssh_opts[@]}" probe@127.0.0.1 \
            'uname -a; loginctl list-sessions; flatpak info --show-commit org.localsend.localsend_app; flatpak info --show-commit org.freedesktop.Platform//26.08' \
            >> evidence/vm/kernel38-environment.txt 2>&1 || true
          test "$ready" = 1
          for kind in deb flatpak; do
            label="${kind}38"
            timeout 20 ssh "${ssh_opts[@]}" probe@127.0.0.1 "bash -s -- $kind $label" <<'GUEST'
          set -u
          kind=$1
          label=$2
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          export WAYLAND_DISPLAY=wayland-0
          export XDG_SESSION_TYPE=wayland
          export XDG_CURRENT_DESKTOP=ubuntu:GNOME
          if [ "$kind" = deb ]; then
            deb_binary=$(find /opt /usr -name localsend_app -type f -print -quit)
            nohup "$deb_binary" > "/tmp/localsend-$label.log" 2>&1 < /dev/null &
          else
            nohup flatpak run org.localsend.localsend_app > "/tmp/localsend-$label.log" 2>&1 < /dev/null &
          fi
          echo "launcher=$!"
          GUEST
            sleep 25
            printf 'screendump %s\n' "$GITHUB_WORKSPACE/evidence/vm/$label.ppm" | timeout 8 sudo socat - UNIX-CONNECT:/tmp/localsend-vm/monitor || true
            test -s "evidence/vm/$label.ppm"
            sudo chown "$(id -u):$(id -g)" "evidence/vm/$label.ppm"
            convert "evidence/vm/$label.ppm" "evidence/vm/$label.png"
            timeout 25 ssh "${ssh_opts[@]}" probe@127.0.0.1 "bash -s -- $label" > "evidence/vm/$label-state.txt" 2>&1 <<'GUEST'
          label=$1
          ps -eo pid,ppid,stat,pcpu,comm,args | grep -E 'localsend|flatpak' | grep -v grep || true
          ss -lntup | grep 53317 || true
          echo "log_bytes=$(wc -c < "/tmp/localsend-$label.log")"
          cat "/tmp/localsend-$label.log"
          app_pid=$(pgrep -n -x localsend_app || pgrep -n -x localsend || true)
          if [ -n "$app_pid" ]; then ps -T -p "$app_pid" -o pid,tid,stat,pcpu,wchan:32,comm; fi
          if [ -n "$app_pid" ] && ! ss -lntup | grep -q 53317; then
            timeout 12 sudo gdb -q -batch -p "$app_pid" -ex 'thread apply all bt 12' || true
          fi
          pkill -x localsend_app || true
          pkill -x localsend || true
          GUEST
            if [ "$kind" = deb ] && ! grep -q 'tcp.*LISTEN.*53317' "evidence/vm/$label-state.txt"; then
              echo 'DEB38_CONTROL=failed' | tee -a "evidence/vm/$label-state.txt"
              exit 1
            fi
            sleep 3
          done

      - name: Make VM evidence readable for artifact upload
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence/vm && chmod -R a+rX evidence/vm

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-3553-vm-evidence
          path: evidence/vm/
