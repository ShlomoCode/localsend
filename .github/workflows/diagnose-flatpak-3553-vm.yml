name: Diagnose 2754 Cinnamon Text focus
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Run native source gates before any new VM experiment'
        type: choice
        default: vm
        options: [vm, native, engine, engine-app, packaged-comparison]
      environment:
        type: choice
        default: mint
        options: [mint, ubuntu-cinnamon]
      app_source:
        type: choice
        default: official-deb
        options: [official-deb, c1ce]
      engine_variant:
        description: 'Official engine or exact source-built c1ce control/B bundle'
        type: choice
        default: official
        options: [official, control, B]
      bundle_run_id:
        description: 'Completed bundle run; required for source-built engine control/B'
        type: string
        required: false
        default: ''
      capture_interactions:
        description: 'Separate real speech/edit/action/lifecycle phase after timing and geometry'
        type: boolean
        default: false
      capture_root_name_evidence:
        description: 'Single AB diagnostic: observe an unresolved public root name call after an initial quiet wait'
        type: boolean
        default: false
      engine_run_id:
        description: 'Completed engine source build supplying immutable control/B artifacts for app-only retry'
        type: string
        required: false
        default: ''
      bridge_variant:
        description: 'Mint c1ce bridge: system, rebuilt stock control, or candidate A'
        type: choice
        default: system
        options: [system, stock, A]
      bridge_run_id:
        description: 'Completed native-gates run with passing A gates supplying the rebuilt bridges'
        type: string
        required: false
        default: ''
# Serialize the build and VM as one owned diagnostic run, including across dispatches.
concurrency:
  group: issue2754-cinnamon-diagnostic
  cancel-in-progress: false
jobs:
  packaged-comparison:
    if: inputs.stage == 'packaged-comparison'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicit completed app bundle run
        env:
          GH_TOKEN: ${{ github.token }}
          APP_RUN_ID: ${{ inputs.bundle_run_id }}
        run: |
          [[ "$APP_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p evidence/package
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$APP_RUN_ID" > evidence/package/app-run.json
          jq -e '.status == "completed" and .conclusion == "success"' evidence/package/app-run.json
      - name: Download verified control application bundle
        uses: actions/download-artifact@v4
        with:
          name: issue2754-c1ce-engine-control-linux-x64
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/issue2754-control-app
      - name: Download verified B application bundle
        uses: actions/download-artifact@v4
        with:
          name: issue2754-c1ce-engine-B-linux-x64
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/issue2754-B-app
      - name: Install official AT-SPI source package prerequisites
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee evidence/package/apt-update.log
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper-compat devscripts quilt curl ca-certificates binutils jq \
            dbus libdbus-1-dev dbus-broker libsystemd-dev libglib2.0-dev libxml2-dev libx11-dev libxtst-dev \
            meson pkgconf gtk-doc-tools gi-docgen python3-sphinx gir1.2-dbus-1.0-dev gir1.2-glib-2.0-dev \
            gir1.2-gobject-2.0-dev gobject-introspection xauth xvfb at-spi2-core docbook-xml libglib2.0-doc libglib2.0-dev-bin \
            2>&1 | tee evidence/package/apt-install.log
      - name: Build A through the normal Debian source package rules
        run: bash support/diagnostics/2754-atspi-package/build-package.sh evidence/package/build
      - name: Run control system then B system then A plus B package in Mint
        env:
          APP_RUN_ID: ${{ inputs.bundle_run_id }}
          PROBE_CAPTURE_INTERACTIONS: ${{ inputs.capture_interactions && '1' || '0' }}
          PROBE_CAPTURE_ROOT_NAME_EVIDENCE: ${{ inputs.capture_root_name_evidence && '1' || '0' }}
        run: |
          bash support/diagnostics/2754-engine-build/run-packaged-comparison.sh \
            "$RUNNER_TEMP/issue2754-control-app" "$RUNNER_TEMP/issue2754-B-app" \
            "$GITHUB_WORKSPACE/evidence/package/build/candidate" "$APP_RUN_ID"
      - name: Preserve readable evidence on every outcome
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" evidence
          mkdir -p /tmp/issue2754-packaged-compact
          rsync -a --exclude='*.mp4' --exclude='*.ppm' --exclude='*.deb' --exclude='*.udeb' \
            --exclude='*.tar.*' --exclude='*.so' --exclude='*.so.*' --exclude='*.debug' --exclude='work/' --exclude='target-root/' \
            evidence/ /tmp/issue2754-packaged-compact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-packaged-comparison-evidence-compact
          path: /tmp/issue2754-packaged-compact/
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-packaged-comparison-evidence-full
          path: evidence/
          compression-level: 0
  engine-app-retry:
    if: inputs.stage == 'engine-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require the reviewed immutable engine source run
        env:
          ENGINE_RUN_ID: ${{ inputs.engine_run_id }}
        run: |
          test "$ENGINE_RUN_ID" = 38153341418
          mkdir -p evidence/engine-app-retry
          git rev-parse HEAD > evidence/engine-app-retry/diagnostic-head.txt
      - name: Download complete immutable control engine
        uses: actions/download-artifact@v4
        with:
          name: issue2754-engine-control-linux-x64
          run-id: ${{ inputs.engine_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/issue2754-control-engine-artifact
      - name: Download complete immutable B engine
        uses: actions/download-artifact@v4
        with:
          name: issue2754-engine-B-linux-x64
          run-id: ${{ inputs.engine_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/issue2754-B-engine-artifact
      - name: Install native app build dependencies
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee evidence/engine-app-retry/apt-update.log
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev jq binutils file \
            2>&1 | tee evidence/engine-app-retry/apt-install.log
          command -v rustup
      - name: Build control then B from immutable source-built engines
        run: |
          set -euo pipefail
          for variant in control B; do
            artifact="$RUNNER_TEMP/issue2754-$variant-engine-artifact"
            # Each downloaded artifact keeps its original provenance descriptor.
            jq -e --arg variant "$variant" '.run_id == "38153341418" and .variant == $variant' "$artifact/provenance/manifest.json"
            PROBE_VARIANT="$variant" bash support/diagnostics/2754-engine-build/build-app.sh \
              "$artifact" "evidence/engine-app-$variant/bundle"
          done
      - name: Preserve app-only failure and success provenance
        if: always()
        run: |
          mkdir -p /tmp/issue2754-engine-app-retry-compact
          rsync -a --include='*/' --include='*.log' --include='*.json' --include='*.txt' \
            --include='*.xml' --include='*.tsv' --include='*.sha256' --include='*SHA256SUMS' \
            --include='*.patch' --include='*.cmake' --exclude='*' \
            evidence/ /tmp/issue2754-engine-app-retry-compact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-engine-app-retry-evidence-compact
          path: /tmp/issue2754-engine-app-retry-compact/
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-engine-app-retry-evidence-full
          path: evidence/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: issue2754-c1ce-engine-control-linux-x64
          path: evidence/engine-app-control/bundle/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: issue2754-c1ce-engine-B-linux-x64
          path: evidence/engine-app-B/bundle/
          if-no-files-found: error
          compression-level: 0
  native-gates:
    if: inputs.stage == 'native'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize native evidence
        run: mkdir -p evidence/native
      - name: Install native fixture dependencies
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee evidence/native/apt-update.log
          sudo apt-get install -y build-essential meson ninja-build pkg-config libgtk-3-dev libgtest-dev \
            libglib2.0-dev libdbus-1-dev libxml2-dev libx11-dev libxtst-dev libsystemd-dev \
            dbus dbus-x11 strace xvfb xauth curl git binutils patch \
            2>&1 | tee evidence/native/apt-install.log
      - name: A stock negative control and patched native lifecycle suite
        run: bash support/diagnostics/2754-atspi-native.sh evidence/native/A
      - name: B stock negative controls and patched native GTK suite
        run: bash support/diagnostics/2754-flutter-native/run-native-gate.sh evidence/native/B
      - name: Retain native provenance on every outcome
        if: always()
        run: |
          mkdir -p evidence/native
          git rev-parse HEAD > evidence/native/diagnostic-head.txt
          git diff > evidence/native/diagnostic-working-diff.patch
          dpkg-query -W > evidence/native/packages.tsv
          uname -a > evidence/native/uname.txt
          cp /etc/os-release evidence/native/os-release.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-native-gates
          path: evidence/native/
          if-no-files-found: error
  build-c1ce:
    if: (inputs.stage || 'vm') == 'vm' && inputs.app_source == 'c1ce' && (inputs.engine_variant || 'official') == 'official' && inputs.bundle_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostic
      - name: Initialize build evidence
        run: mkdir -p /tmp/issue2754-build/provenance
      - name: Checkout immutable application source
        uses: actions/checkout@v4
        with:
          ref: c1ce322fb3acf08e44f329b8b7208b8b0d91e244
          path: source-c1ce
      - name: Install existing Linux build dependencies
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee /tmp/issue2754-build/provenance/apt-update.log
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev pkg-config binutils jq 2>&1 | tee /tmp/issue2754-build/provenance/apt-install.log
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build unmodified c1ce release bundle with enforced locks
        env:
          PROBE_SOURCE_DIR: ${{ github.workspace }}/source-c1ce
          PROBE_BUILD_DIR: /tmp/issue2754-build
        run: |
          export PROBE_FLUTTER="$(command -v flutter)"
          bash diagnostic/support/diagnostics/2754-build-c1ce.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-c1ce-flutter3419-linux-x64
          path: /tmp/issue2754-build/
          if-no-files-found: warn
  cinnamon-vm:
    needs: build-c1ce
    if: ${{ !cancelled() && (inputs.stage || 'vm') == 'vm' && ((inputs.app_source || 'official-deb') == 'official-deb' || (inputs.engine_variant || 'official') != 'official' || inputs.bundle_run_id != '' || needs.build-c1ce.result == 'success') }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select explicit app engine artifact
        id: engine_selection
        env:
          ENGINE_VARIANT: ${{ inputs.engine_variant || 'official' }}
          APP_SOURCE: ${{ inputs.app_source || 'official-deb' }}
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
          BRIDGE_VARIANT: ${{ inputs.bridge_variant || 'system' }}
          PROBE_ENVIRONMENT: ${{ inputs.environment || 'mint' }}
        run: |
          set -euo pipefail
          mkdir -p evidence/cloud/build
          case "$ENGINE_VARIANT" in
            official) artifact_name=issue2754-c1ce-flutter3419-linux-x64 ;;
            control|B)
              test "$APP_SOURCE" = c1ce
              test "$PROBE_ENVIRONMENT" = mint
              [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$BRIDGE_VARIANT" = system || "$BRIDGE_VARIANT" = A ]]
              artifact_name="issue2754-c1ce-engine-$ENGINE_VARIANT-linux-x64"
              ;;
            *) echo "Unsupported engine variant: $ENGINE_VARIANT" >&2; exit 2 ;;
          esac
          printf 'engine_variant=%s\nartifact_name=%s\nbundle_run_id=%s\n' "$ENGINE_VARIANT" "$artifact_name" "$BUNDLE_RUN_ID" > evidence/cloud/build/engine-selection.txt
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Validate bridge experiment inputs and completed native run
        if: (inputs.bridge_variant || 'system') != 'system'
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_VARIANT: ${{ inputs.bridge_variant }}
          BRIDGE_RUN_ID: ${{ inputs.bridge_run_id }}
          APP_SOURCE: ${{ inputs.app_source }}
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
          PROBE_ENVIRONMENT: ${{ inputs.environment }}
          ENGINE_VARIANT: ${{ inputs.engine_variant || 'official' }}
        run: |
          test "$APP_SOURCE" = c1ce
          test "$PROBE_ENVIRONMENT" = mint
          if [ "$ENGINE_VARIANT" = official ]; then
            test "$BUNDLE_RUN_ID" = 38132747719
          else
            # The exact source-built bundle manifest is validated before any VM starts.
            [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]
            test "$BRIDGE_VARIANT" = A
          fi
          [[ "$BRIDGE_VARIANT" = stock || "$BRIDGE_VARIANT" = A ]]
          [[ "$BRIDGE_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p evidence/cloud/bridge
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BRIDGE_RUN_ID" > evidence/cloud/bridge/native-run.json
          jq -e '.status == "completed" and .path == ".github/workflows/diagnose-flatpak-3553-vm.yml"' evidence/cloud/bridge/native-run.json
      - name: Download accepted native bridge artifacts
        if: (inputs.bridge_variant || 'system') != 'system'
        uses: actions/download-artifact@v4
        with:
          name: issue2754-native-gates
          path: /tmp/issue2754-native-gates
          run-id: ${{ inputs.bridge_run_id }}
          github-token: ${{ github.token }}
      - name: Verify native gates and immutable bridge provenance
        if: (inputs.bridge_variant || 'system') != 'system'
        env:
          BRIDGE_VARIANT: ${{ inputs.bridge_variant }}
        run: |
          set -euo pipefail
          native=/tmp/issue2754-native-gates
          grep -qx 'exit_status=0' "$native/A/result.txt"
          grep -qx 'stock_self_wait_detected=true' "$native/A/gates.txt"
          grep -qx 'candidate_native_suite_passed=true' "$native/A/gates.txt"
          test "$(cat "$native/diagnostic-head.txt")" = "$(jq -r .head_sha evidence/cloud/bridge/native-run.json)"
          cmp support/diagnostics/2754-atspi-native/A-local-dispatch.patch "$native/A/A-local-dispatch.patch"
          grep -qx '0ac3fc8320c8d01fa147c272ba7fa03806389c6b03d3c406d0823e30e35ff5ab  at-spi2-core_2.52.0.orig.tar.xz' "$native/A/source.sha256"
          grep -qx '20bda0a6815fb1e7c6ca286a02b4b70aaa706f304664aad30bd88a4ee163b91c  at-spi2-core_2.52.0-1build1.debian.tar.xz' "$native/A/source.sha256"
          (cd "$native/A" && sha256sum -c source.sha256)
          grep -q '^d6dcb95fe109220d49382fd505ebbd10c1fbbd674be93790dd48676f3ac640fa ' "$native/A/tested-source.sha256"
          grep -q '^8b763df2b23c3d4e0f65084b3d96d4156831689c85fec76e6554b4b4a716b48c ' "$native/A/tested-source.sha256"
          expected=$(awk 'NR==1 {print $1}' "$native/A/bridge-$BRIDGE_VARIANT.sha256")
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$native/A/libatk-bridge-$BRIDGE_VARIANT.so.0" | sha256sum -c -
          printf 'bridge_variant=%s\nbridge_native_sha=%s\nbridge_sha256=%s\n' "$BRIDGE_VARIANT" "$(cat "$native/diagnostic-head.txt")" "$expected" > evidence/cloud/bridge/selection.txt
          cp "$native/A/gates.txt" "$native/A/result.txt" "$native/A/source.sha256" "$native/A/tested-source.sha256" "$native/A/diagnostic-assets.sha256" "$native/A/A-local-dispatch.patch" evidence/cloud/bridge/
          cp "$native/A/bridge-$BRIDGE_VARIANT.sha256" "$native/A/bridge-build-id-$BRIDGE_VARIANT.txt" evidence/cloud/bridge/
          # B gates are independent: stock/A bridge experiments require only A.
          if test -f "$native/B/exit-code.txt"; then
            cp "$native/B/exit-code.txt" evidence/cloud/bridge/B-native-exit-code.txt
          fi
      - name: Validate explicitly selected completed build run
        if: inputs.app_source == 'c1ce' && inputs.bundle_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
        run: |
          [[ "$BUNDLE_RUN_ID" =~ ^[0-9]+$ ]]
          mkdir -p evidence/cloud/build
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUNDLE_RUN_ID" > evidence/cloud/build/reused-run.json
          jq -e '.status == "completed" and .path == ".github/workflows/diagnose-flatpak-3553-vm.yml"' evidence/cloud/build/reused-run.json
      - name: Download exact source bundle and build provenance
        if: inputs.app_source == 'c1ce'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.engine_selection.outputs.artifact_name }}
          path: /tmp/issue2754-build
          run-id: ${{ inputs.bundle_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Run ordinary Cinnamon graphical VM
        env:
          PROBE_ENVIRONMENT: ${{ inputs.environment || 'mint' }}
          PROBE_APP_SOURCE: ${{ inputs.app_source || 'official-deb' }}
          PROBE_BUNDLE_TAR: /tmp/issue2754-build/source-bundle.tar.gz
          PROBE_BRIDGE_VARIANT: ${{ inputs.bridge_variant || 'system' }}
          PROBE_BRIDGE_ARTIFACT: /tmp/issue2754-native-gates/A
          PROBE_ENGINE_VARIANT: ${{ inputs.engine_variant || 'official' }}
          PROBE_BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
          PROBE_CAPTURE_GEOMETRY: ${{ ((inputs.bridge_variant != '' && inputs.bridge_variant != 'system') || (inputs.engine_variant != '' && inputs.engine_variant != 'official')) && '1' || '0' }}
        run: |
          if [ "$PROBE_APP_SOURCE" = c1ce ]; then
            test "$PROBE_ENVIRONMENT" = mint
            (cd /tmp/issue2754-build && sha256sum -c source-bundle.tar.gz.sha256)
            mkdir -p evidence/cloud/build
            cp -a /tmp/issue2754-build/provenance evidence/cloud/build/
            cp /tmp/issue2754-build/source-bundle.tar.gz.sha256 evidence/cloud/build/
            test "$(cat /tmp/issue2754-build/provenance/source-sha.txt)" = c1ce322fb3acf08e44f329b8b7208b8b0d91e244
            jq -e '.frameworkVersion == "3.41.9" and .frameworkRevision == "00b0c91f06209d9e4a41f71b7a512d6eb3b9c694"' /tmp/issue2754-build/provenance/flutter-version.json
            grep -qx 'exit_status=0' /tmp/issue2754-build/provenance/build-result.txt
            cmp /tmp/issue2754-build/provenance/lock-hashes-before.txt /tmp/issue2754-build/provenance/lock-hashes-after.txt
            test ! -s /tmp/issue2754-build/provenance/source-diff-after.patch
            if [ "$PROBE_ENGINE_VARIANT" != official ]; then
              provenance=/tmp/issue2754-build/provenance
              jq -e --arg variant "$PROBE_ENGINE_VARIANT" --arg run_id "$PROBE_BUNDLE_RUN_ID" \
                --arg patch_hash "$(sha256sum support/diagnostics/2754-engine-build/B-with-tests.patch | awk '{print $1}')" \
                '.variant == $variant and .app_build_run_id == $run_id and
                 (.run_id == $run_id or .run_id == "38153341418") and
                 .engine_sha == "42d3d75a56efe1a2e9902f52dc8006099c45d937" and
                 .framework_sha == "00b0c91f06209d9e4a41f71b7a512d6eb3b9c694" and
                 .localsend_sha == "c1ce322fb3acf08e44f329b8b7208b8b0d91e244" and
                 .depot_tools_sha == "a03dfbf7f2d1cefa2795d81d59ca4f16c8616a8f" and
                 .deps_sha256 == "0d0b2b9c4b103613bb242635328497bc8a47d64f31309f2dfa93e66abb20d4f3" and
                 .experiment_patch_sha256 == $patch_hash and .runtime_mode == "release" and
                 (.engine_so_sha256 | test("^[0-9a-f]{64}$")) and
                 (.libapp_sha256 | test("^[0-9a-f]{64}$"))' "$provenance/manifest.json"
              test "$(sha256sum /tmp/issue2754-build/source-bundle.tar.gz | awk '{print $1}')" = "$(jq -er .bundle_sha256 "$provenance/manifest.json")"
              test "$(sha256sum "$provenance/engine/bootstrap/records-SHA256SUMS" | awk '{print $1}')" = "$(jq -er .bootstrap_records_sha256 "$provenance/manifest.json")"
              (cd "$provenance/engine/bootstrap" && sha256sum -c records-SHA256SUMS)
              cmp "$provenance/lock-hashes-before.txt" "$provenance/lock-hashes-after.txt"
              jq -e '.engineRevision == "42d3d75a56efe1a2e9902f52dc8006099c45d937"' "$provenance/flutter-version.json"
              grep -q '^release: 1.97.1$' "$provenance/rustc-version.txt"
              printf 'source_built_manifest_verified=true\n' > evidence/cloud/build/engine-manifest-check.txt
            fi
          fi
          if [ "$PROBE_ENVIRONMENT" = mint ]; then
            bash support/diagnostics/2754-mint-vm.sh
          else
            bash support/diagnostics/2754-vm.sh
          fi
      - name: Preserve readable evidence on every outcome
        if: always()
        run: |
          mkdir -p evidence/cloud
          sudo chown -R "$(id -u):$(id -g)" evidence/cloud
          chmod -R a+rX evidence/cloud
      - name: Collect compact scenario evidence without videos
        if: always()
        run: |
          mkdir -p /tmp/issue2754-compact
          rsync -a --exclude='*.mp4' --exclude='*.mkv' --exclude='*.webm' --exclude='*.avi' --exclude='*.ppm' \
            --exclude='*.tar' --exclude='*.tar.gz' --exclude='*.tgz' --exclude='*.zip' --exclude='*.deb' \
            --exclude='*.so' --exclude='*.so.*' --exclude='localsend_app' evidence/cloud/ /tmp/issue2754-compact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-cinnamon-evidence-compact
          path: /tmp/issue2754-compact/
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-cinnamon-evidence
          path: evidence/cloud/

  engine-source-build:
    if: inputs.stage == 'engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      # Explicitly authorized disposable SDK paths only; the script enforces fork/runner guards.
      PROBE_RECLAIM_RUNNER_SDKS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Initialize engine evidence
        run: |
          mkdir -p evidence/engine/build evidence/engine/bootstrap
          git rev-parse HEAD > evidence/engine/diagnostic-head.txt || true
      - name: Measure resources and bootstrap the exact engine on this runner
        id: bootstrap
        run: |
          set +e
          bash support/diagnostics/2754-engine-build/bootstrap.sh evidence/engine/bootstrap
          status=$?
          printf '%s\n' "$status" > evidence/engine/bootstrap-exit-code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = 3 ]; then
            echo '::error::Engine resource gate failed (exit 3); engine compilation did not run. See bootstrap/resource-gate.txt and resources.txt.'
          fi
          exit "$status"
      - name: Build control and B with the official native B gate sequentially
        id: engine
        # This step shares the physical runner and exact source checkout with bootstrap.
        # The script bounds all compilation to 180 minutes and Ninja to -j2/-l2.
        run: bash support/diagnostics/2754-engine-build/build-engines.sh evidence/engine/build
      - name: Preserve engine stage evidence on every outcome
        if: always()
        run: |
          mkdir -p evidence/engine
          git rev-parse HEAD > evidence/engine/diagnostic-head.txt || true
          dpkg-query -W > evidence/engine/packages.tsv
          uname -a > evidence/engine/uname.txt
          cp /etc/os-release evidence/engine/os-release.txt
          free -m > evidence/engine/final-memory.txt
          df -Pk "$RUNNER_TEMP" "$GITHUB_WORKSPACE" > evidence/engine/final-disk.txt
      - name: Collect compact engine logs and provenance
        if: always()
        run: |
          mkdir -p /tmp/issue2754-engine-compact
          rsync -a --include='*/' --include='*.log' --include='*.json' --include='*.txt' \
            --include='*.xml' --include='*.tsv' --include='*.sha256' --include='*SHA256SUMS' \
            --include='*.patch' --include='*.gclient' --include='args.gn' --exclude='*' \
            evidence/engine/ /tmp/issue2754-engine-compact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-engine-build-evidence-compact
          path: /tmp/issue2754-engine-compact/
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Whole stage directory, including partial variant artifacts, retained after failure.
          name: issue2754-engine-build-evidence-full
          path: evidence/engine/
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Transport the whole directory: TAR, SHA256, and bootstrap-linked provenance.
          name: issue2754-engine-control-linux-x64
          path: evidence/engine/build/control/
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-engine-B-linux-x64
          path: evidence/engine/build/B/
          if-no-files-found: warn
          compression-level: 0

  engine-app-control:
    if: inputs.stage == 'engine'
    needs: engine-source-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PROBE_VARIANT: control
    steps:
      - uses: actions/checkout@v4
      - name: Initialize control app evidence
        run: mkdir -p evidence/engine-app-control
      - name: Download the complete control engine artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: issue2754-engine-control-linux-x64
          path: ${{ runner.temp }}/issue2754-control-engine-artifact
      - name: Install native app build dependencies
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee evidence/engine-app-control/apt-update.log
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev jq binutils file \
            2>&1 | tee evidence/engine-app-control/apt-install.log
          command -v rustup
      - name: Build exact c1ce with the source-built control engine
        run: |
          bash support/diagnostics/2754-engine-build/build-app.sh \
            "$RUNNER_TEMP/issue2754-control-engine-artifact" evidence/engine-app-control/bundle
      - name: Collect compact control app evidence
        if: always()
        run: |
          mkdir -p evidence/engine-app-control /tmp/issue2754-engine-app-control-compact
          git rev-parse HEAD > evidence/engine-app-control/diagnostic-head.txt || true
          rsync -a --include='*/' --include='*.log' --include='*.json' --include='*.txt' \
            --include='*.xml' --include='*.tsv' --include='*.sha256' --include='*SHA256SUMS' \
            --include='*.patch' --include='*.gclient' --include='*.cmake' --include='args.gn' --exclude='*' \
            evidence/engine-app-control/ /tmp/issue2754-engine-app-control-compact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-c1ce-engine-control-evidence-compact
          path: /tmp/issue2754-engine-app-control-compact/
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-c1ce-engine-control-evidence-full
          path: evidence/engine-app-control/
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-c1ce-engine-control-linux-x64
          path: evidence/engine-app-control/bundle/
          if-no-files-found: warn
          compression-level: 0

  engine-app-B:
    if: inputs.stage == 'engine'
    # B can start only after both the engine job and control app job succeed.
    needs: [engine-source-build, engine-app-control]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PROBE_VARIANT: B
    steps:
      - uses: actions/checkout@v4
      - name: Initialize B app evidence
        run: mkdir -p evidence/engine-app-B
      - name: Download the complete B engine artifact from this run
        uses: actions/download-artifact@v4
        with:
          name: issue2754-engine-B-linux-x64
          path: ${{ runner.temp }}/issue2754-B-engine-artifact
      - name: Install native app build dependencies
        run: |
          set -o pipefail
          sudo apt-get update 2>&1 | tee evidence/engine-app-B/apt-update.log
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev jq binutils file \
            2>&1 | tee evidence/engine-app-B/apt-install.log
          command -v rustup
      - name: Build exact c1ce with the source-built B engine
        run: |
          bash support/diagnostics/2754-engine-build/build-app.sh \
            "$RUNNER_TEMP/issue2754-B-engine-artifact" evidence/engine-app-B/bundle
      - name: Collect compact B app evidence
        if: always()
        run: |
          mkdir -p evidence/engine-app-B /tmp/issue2754-engine-app-B-compact
          git rev-parse HEAD > evidence/engine-app-B/diagnostic-head.txt || true
          rsync -a --include='*/' --include='*.log' --include='*.json' --include='*.txt' \
            --include='*.xml' --include='*.tsv' --include='*.sha256' --include='*SHA256SUMS' \
            --include='*.patch' --include='*.gclient' --include='*.cmake' --include='args.gn' --exclude='*' \
            evidence/engine-app-B/ /tmp/issue2754-engine-app-B-compact/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-c1ce-engine-B-evidence-compact
          path: /tmp/issue2754-engine-app-B-compact/
          compression-level: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2754-c1ce-engine-B-evidence-full
          path: evidence/engine-app-B/
          if-no-files-found: warn
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
