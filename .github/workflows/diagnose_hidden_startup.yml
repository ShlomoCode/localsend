name: Diagnose hidden startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build and desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libgl1-mesa-dri libegl1 libgles2 xvfb openbox cinnamon muffin dbus-x11 xdotool x11-utils iproute2 curl openssl python3 scrot
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Record exact source and tooling
        run: |
          mkdir -p /tmp/ls-evidence
          git rev-parse HEAD > /tmp/ls-evidence/diagnostic-commit.txt
          printf 'e768240d1ad95f0f162b852b5ff37bec71cde1ef\n' > /tmp/ls-evidence/baseline-commit.txt
          uname -a > /tmp/ls-evidence/kernel.txt
          flutter --version > /tmp/ls-evidence/flutter-version.txt
          rustup toolchain install --profile minimal
          rustc --version > /tmp/ls-evidence/rust-version.txt
      - name: Probe the reported release on x86_64
        continue-on-error: true
        run: |
          mkdir -p /tmp/ls-reported-1.17
          curl -fL --retry 3 https://github.com/localsend/localsend/releases/download/v1.17.0/LocalSend-1.17.0-linux-x86-64.tar.gz -o /tmp/localsend-1.17.tar.gz
          sha256sum /tmp/localsend-1.17.tar.gz > /tmp/ls-evidence/reported-release-sha256.txt
          tar -xzf /tmp/localsend-1.17.tar.gz -C /tmp/ls-reported-1.17
          LS_BUNDLE_OVERRIDE=/tmp/ls-reported-1.17 bash .github/diagnostics/hidden-startup/runtime-probe.sh reported-1.17
      - name: Preserve release probe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reported-release-evidence
          path: /tmp/ls-evidence
          retention-days: 7
      - name: Instrument exact baseline
        run: python3 .github/diagnostics/hidden-startup/instrument.py
      - name: Build baseline
        working-directory: app
        run: |
          flutter pub get
          flutter build linux --release --no-pub
          cp -a build/linux/x64/release/bundle /tmp/ls-baseline
      - name: Preserve diagnostic baseline binary
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-baseline-bundle
          path: /tmp/ls-baseline
          retention-days: 7
      - name: Run instrumented baseline
        continue-on-error: true
        run: bash .github/diagnostics/hidden-startup/runtime-probe.sh baseline
      - name: Preserve baseline probe
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: baseline-evidence
          path: /tmp/ls-evidence
          retention-days: 7
      - name: Apply minimal PR fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/lib/config/init.dart')
          text = p.read_text()
          target = "  print('[LS-REPRO] ${DateTime.now().toIso8601String()} PRE_INIT_DONE');"
          assert text.count(target) == 1
          fix = '''  if (checkPlatformIsDesktop()) {
              // Hidden desktop windows may not build HomePage, so postInit may not run.
              try {
                await container.notifier(serverProvider).startServerFromSettings();
              } catch (e, st) {
                _logger.warning('Starting receive server during initialization failed', e, st);
              }
            }

          '''
          p.write_text(text.replace(target, fix + target))
          PY
          git diff -- app/lib/config/init.dart app/lib/main.dart app/lib/pages/home_page.dart app/linux/my_application.cc > /tmp/ls-evidence/instrumentation-and-fix.diff
      - name: Build fixed app
        working-directory: app
        run: |
          flutter build linux --release --no-pub
          cp -a build/linux/x64/release/bundle /tmp/ls-fixed
      - name: Preserve diagnostic fixed binary
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-fixed-bundle
          path: /tmp/ls-fixed
          retention-days: 7
      - name: Run instrumented fix
        continue-on-error: true
        run: bash .github/diagnostics/hidden-startup/runtime-probe.sh fixed
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hidden-startup-evidence
          path: /tmp/ls-evidence
          retention-days: 7
