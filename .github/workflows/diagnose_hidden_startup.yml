name: Diagnose hidden startup SDK and native boundaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.32.8', '3.35.6']
        native_port: [false, true]
    name: Flutter ${{ matrix.flutter }} / native port ${{ matrix.native_port }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: diagnostics
      - uses: actions/checkout@v6
        with:
          repository: localsend/localsend
          ref: v1.17.0
          path: historical
          persist-credentials: false
      - name: Install Linux build and X11 probe dependencies
        run: |
          if test -f /etc/apt/apt-mirrors.txt; then
            printf '%s\n' 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev libgl1-mesa-dri libegl1 libgles2 xvfb openbox dbus-x11 xdotool x11-utils iproute2 curl openssl python3 scrot gcc
          gcc -shared -fPIC diagnostics/.github/diagnostics/hidden-startup/show-window.c -o /tmp/ls-show-window.so $(pkg-config --cflags --libs gtk+-3.0)
          gcc -shared -fPIC diagnostics/.github/diagnostics/hidden-startup/revert-view-realize.c -o /tmp/ls-revert-view-realize.so $(pkg-config --cflags --libs gtk+-3.0) -ldl
          mkdir -p /tmp/ls-evidence
          cp diagnostics/.github/diagnostics/hidden-startup/revert-view-realize.c /tmp/ls-evidence/revert-view-realize.c
          sha256sum diagnostics/.github/diagnostics/hidden-startup/revert-view-realize.c /tmp/ls-revert-view-realize.so > /tmp/ls-evidence/revert-view-realize.sha256
      - name: Apply common compatibility and selected native patch
        env:
          NATIVE_PORT: ${{ matrix.native_port }}
        run: |
          mkdir -p /tmp/ls-evidence
          git -C historical rev-parse HEAD > /tmp/ls-evidence/source-commit.txt
          git -C historical describe --tags --exact-match > /tmp/ls-evidence/source-tag.txt
          test "$(cat /tmp/ls-evidence/source-tag.txt)" = v1.17.0
          printf '%s\n' "$NATIVE_PORT" > /tmp/ls-evidence/native-port.txt
          cp historical/app/pubspec.lock /tmp/ls-evidence/source-pubspec.lock
          cd historical
          python3 ../diagnostics/.github/diagnostics/hidden-startup/legacy-sdk-compat.py
          git diff -- app/pubspec.yaml common/pubspec.yaml > /tmp/ls-evidence/compiler-compat.patch
          python3 ../diagnostics/.github/diagnostics/hidden-startup/legacy-instrument.py
          if test "$NATIVE_PORT" = true; then
            python3 ../diagnostics/.github/diagnostics/hidden-startup/native-2929.py
          fi
          git diff -- app/lib common/lib app/linux/my_application.cc app/pubspec.yaml common/pubspec.yaml > /tmp/ls-evidence/source-patch.patch
          git diff --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Build historical source
        working-directory: historical/app
        env:
          EXPECTED_FLUTTER: ${{ matrix.flutter }}
          PUB_CACHE: /tmp/ls-pristine-pub-cache
        run: |
          set -o pipefail
          test ! -e "$PUB_CACHE"
          mkdir -p "$PUB_CACHE"
          flutter --version | tee /tmp/ls-evidence/flutter-version.txt
          flutter --version --machine > /tmp/ls-evidence/flutter-version.json
          test "$(python3 -c 'import json; print(json.load(open("/tmp/ls-evidence/flutter-version.json"))["frameworkVersion"])')" = "$EXPECTED_FLUTTER"
          if ! flutter pub get > /tmp/ls-evidence/pub-get.log 2>&1; then
            cat /tmp/ls-evidence/pub-get.log
            if grep -Eqi 'analyzer|macro|_macros' /tmp/ls-evidence/pub-get.log; then
              (cd .. && python3 ../diagnostics/.github/diagnostics/hidden-startup/legacy-sdk-compat.py --drop-dev)
              git -C .. diff -- app/pubspec.yaml common/pubspec.yaml > /tmp/ls-evidence/compiler-compat-with-dev-fallback.patch
              flutter pub get 2>&1 | tee /tmp/ls-evidence/pub-get-retry.log
            else
              exit 1
            fi
          fi
          cp pubspec.lock /tmp/ls-evidence/resolved-pubspec.lock
          git diff -- pubspec.lock > /tmp/ls-evidence/lock-diff.patch
          (cd .. && python3 ../diagnostics/.github/diagnostics/hidden-startup/theme-sdk-compat.py --phase old --evidence-dir /tmp/ls-evidence)
          git -C .. diff -- app/lib common/lib app/linux/my_application.cc app/pubspec.yaml common/pubspec.yaml > /tmp/ls-evidence/source-patch.patch
          git -C .. diff --check
          flutter build linux --release --no-pub 2>&1 | tee /tmp/ls-evidence/build.log
          sha256sum build/linux/x64/release/bundle/localsend_app > /tmp/ls-evidence/binary.sha256
          cp -a build/linux/x64/release/bundle /tmp/ls-historical-bundle
          tar -C /tmp -czf /tmp/ls-historical-bundle.tar.gz ls-historical-bundle
          sha256sum /tmp/ls-historical-bundle.tar.gz > /tmp/ls-evidence/bundle-archive.sha256
      - name: Probe normal, warm hidden and fresh hidden startup
        continue-on-error: true
        env:
          LS_DESKTOPS: openbox
          LS_BUNDLE_OVERRIDE: /tmp/ls-historical-bundle
          LS_SHOW_SHIM: /tmp/ls-show-window.so
          VARIANT: sdk${{ matrix.flutter }}-native${{ matrix.native_port }}
        run: bash diagnostics/.github/diagnostics/hidden-startup/runtime-probe.sh "$VARIANT"
      - name: Reverse Flutter FlView realization in the same bundle
        if: ${{ matrix.flutter == '3.35.6' && matrix.native_port == true }}
        continue-on-error: true
        env:
          LS_DESKTOPS: openbox
          LS_BUNDLE_OVERRIDE: /tmp/ls-historical-bundle
          LS_SHOW_SHIM: /tmp/ls-revert-view-realize.so /tmp/ls-show-window.so
          LS_REVERT_VIEW_REALIZE: '1'
        run: bash diagnostics/.github/diagnostics/hidden-startup/runtime-probe.sh reverted-flview-realize-sdk35
      - name: Preserve reusable bundle
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: hidden-startup-bundle-sdk${{ matrix.flutter }}-native${{ matrix.native_port }}
          path: /tmp/ls-historical-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve this matrix cell's evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hidden-startup-sdk${{ matrix.flutter }}-native${{ matrix.native_port }}
          path: /tmp/ls-evidence
          retention-days: 7
