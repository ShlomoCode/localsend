name: Diagnose 2884 nested KVM execution
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-2884-kvm-capability]
    paths: [.github/workflows/diagnose-2884-nested-kvm.yml]
permissions:
  contents: read
concurrency:
  group: diagnose-2884
  cancel-in-progress: false
jobs:
  nested-execution:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Boot official Linux guest and observe inner KVM_RUN
        shell: bash
        run: bash support/diagnostics/2884-nested-host.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2884-nested-kvm-${{ github.run_id }}
          path: evidence/2884-nested-kvm
          if-no-files-found: error
