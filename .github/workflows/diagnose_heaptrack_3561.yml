name: Diagnose normal Heaptrack launch 3561
on:
  push:
    branches: [codex/diagnose-rust-loader-3561]
    paths: [.github/workflows/diagnose_heaptrack_3561.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiling:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install actual package and ordinary profiling tool
        run: |
          pacman -Syu --noconfirm gtk3 libayatana-appindicator mesa libglvnd xorg-server-xvfb openbox imagemagick curl iproute2 binutils git dbus procps-ng heaptrack
          curl -fL https://repo.archlinuxcn.org/x86_64/localsend-1.18.2-2-x86_64.pkg.tar.zst -o /tmp/localsend.pkg.tar.zst
          pacman -U --noconfirm /tmp/localsend.pkg.tar.zst
          useradd -m -u 1000 tester
      - uses: actions/checkout@v6
      - name: Record original artifact and profiling environment
        run: |
          mkdir evidence
          chmod 777 evidence
          pacman -Q localsend heaptrack glibc > evidence/versions.txt
          pacman -Qkk localsend > evidence/package-integrity.txt
          sha256sum /tmp/localsend.pkg.tar.zst > evidence/package-sha256.txt
          readelf -d /usr/lib/localsend/lib/libflutter_linux_gtk.so > evidence/engine-elf.txt
      - name: Compare standard launch with documented Heaptrack launch
        shell: bash
        run: |
          Xvfb :99 -screen 0 1280x900x24 -ac > evidence/xvfb.log 2>&1 &
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1
          sleep 2
          cat > /tmp/run-localsend-profile.sh <<'SH'
          #!/bin/bash
          set -eu
          case_name="$1"
          out="$2"
          export XDG_CONFIG_HOME="/home/tester/profile-$case_name"
          export XDG_RUNTIME_DIR="/tmp/runtime-tester-$case_name"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          cd /home/tester
          openbox > "$out/openbox.log" 2>&1 &
          sleep 2
          if [ "$case_name" = standard ]; then
            LD_DEBUG=libs /usr/bin/localsend > "$out/app.log" 2>&1 &
          else
            LD_DEBUG=libs heaptrack /usr/bin/localsend > "$out/app.log" 2>&1 &
          fi
          sleep 15
          import -window root "$out/screen.png"
          ss -ltnp > "$out/listeners.txt"
          pgrep -u tester -x 'localsend(_app)?' > "$out/pids.txt" || true
          while read -r app_pid; do
            cat "/proc/$app_pid/maps" >> "$out/process-maps.txt"
          done < "$out/pids.txt"
          if grep -q ':53317 ' "$out/listeners.txt"; then result=started; else result=no-server; fi
          echo "$case_name: $result" | tee "$out/result.txt"
          pkill -u tester -x 'localsend(_app)?' || true
          for attempt in {1..10}; do
            if ! pgrep -u tester -x 'localsend(_app)?' >/dev/null; then break; fi
            sleep 1
          done
          ! pgrep -u tester -x 'localsend(_app)?' >/dev/null
          pkill -u tester -x openbox || true
          if [ "$case_name" = standard ]; then test "$result" = started; fi
          SH
          chmod 755 /tmp/run-localsend-profile.sh
          for case_name in standard heaptrack; do
            mkdir "evidence/$case_name"
            chmod 777 "evidence/$case_name"
            runuser -u tester -- dbus-run-session -- /tmp/run-localsend-profile.sh "$case_name" "$PWD/evidence/$case_name"
          done
          pacman -Qkk localsend > evidence/package-integrity-after.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: normal-heaptrack-evidence
          path: evidence/
