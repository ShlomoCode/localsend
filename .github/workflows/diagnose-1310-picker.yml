name: Issue 1310 supported XFCE investigation
on:
  workflow_dispatch:
    inputs:
      desktop:
        type: choice
        options: [ubuntu, mx]
        default: ubuntu
      package_format:
        type: choice
        options: [tar, appimage, deb]
        default: tar
permissions:
  contents: read
jobs:
  xfce:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Normal XFCE release controls
        env:
          PACKAGE_FORMAT: ${{ inputs.package_format || 'tar' }}
        run: |
          if [ '${{ inputs.desktop }}' = mx ]; then
            bash support/diagnostics/1310/mx.sh
          else
            bash support/diagnostics/1310/vm.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1310-xfce-${{ github.run_id }}
          path: evidence
          retention-days: 30
