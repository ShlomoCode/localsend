name: Issue 1310 supported XFCE investigation
on:
  workflow_dispatch:
    inputs:
      desktop:
        type: choice
        options: [ubuntu, mx]
        default: ubuntu
      package_format:
        type: choice
        options: [tar, appimage, deb]
        default: tar
permissions:
  contents: read
jobs:
  xfce:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        if: inputs.desktop == 'mx'
        with:
          path: /home/runner/issue1310-mx/mx.iso
          key: issue1310-mx-968f9d6b01bb966cac025b6971cdcdb9dad39bb74a2600162f9f4bd7e6ab9eae
      - name: Normal XFCE release controls
        env:
          PACKAGE_FORMAT: ${{ inputs.package_format || 'tar' }}
        run: |
          if [ '${{ inputs.desktop }}' = mx ]; then
            bash support/diagnostics/1310/mx.sh
          else
            bash support/diagnostics/1310/vm.sh
          fi
      - uses: actions/cache/save@v4
        if: always() && inputs.desktop == 'mx'
        with:
          path: /home/runner/issue1310-mx/mx.iso
          key: issue1310-mx-968f9d6b01bb966cac025b6971cdcdb9dad39bb74a2600162f9f4bd7e6ab9eae
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1310-xfce-${{ github.run_id }}
          path: evidence
          retention-days: 30
