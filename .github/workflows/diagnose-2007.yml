name: Diagnose Android deleted filename 2007
on:
  workflow_dispatch:
  push:
    branches: [codex/bug-2007-diagnostics]
    paths:
      - .github/workflows/diagnose-2007.yml
jobs:
  actual-app-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare released applications and desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool scrot python3-pyatspi at-spi2-core tesseract-ocr network-manager libayatana-appindicator3-1 libsecret-1-0 libgtk-3-0 libegl1 libgles2 libgl1-mesa-dri libopengl0 libglx-mesa0 mesa-utils
          sudo systemctl start NetworkManager
          mkdir -p evidence released
          curl -fL https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.tar.gz -o released/linux.tar.gz
          curl -fL https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-android-x64.apk -o released/android.apk
          sha256sum released/* | tee evidence/artifact-sha256.txt
          tar xf released/linux.tar.gz -C released
          sudo chmod 666 /dev/kvm
      - name: Start real apps and inspect supported UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: dbus-run-session -- xvfb-run -a -s '-screen 0 1200x800x24' bash support/diagnostics/2007-inspect.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-2007-baseline-inspection-${{ github.run_id }}
          path: evidence/
