name: macOS startup regression

on:
  push:
    branches:
      - codex/test-macos-startup-main
      - codex/test-macos-startup-fixed
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/macos_startup_regression.yml
      - app/integration_test/**
      - app/lib/main.dart
      - app/lib/config/init.dart
      - app/lib/util/native/macos_channel.dart
      - app/macos/Runner/**
      - app/macos/Runner.xcodeproj/**
      - app/macos/Podfile
      - support/test/**

permissions:
  contents: read

jobs:
  startup:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode with the required macOS SDK
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install FVM
        run: brew install leoafarias/fvm/fvm
      - uses: actions/cache@v5
        with:
          path: ~/fvm
          key: flutter-macos-arm64-${{ hashFiles('.fvmrc') }}
      - name: Install pinned Flutter
        run: fvm install
      - name: Install pinned Rust
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/localsend_isolates/rust -> target
          shared-key: macos-startup
      - name: Run real macOS startup regression
        run: fvm dart run support/test/macos_harness.dart
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-startup-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
