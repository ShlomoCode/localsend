name: Diagnose Windows filename 3536
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-3536-OFFICIAL-PAIR to run the selected bounded diagnostic
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: diagnostic-3536-official-pair
  cancel-in-progress: false
jobs:
  official-pair:
    if: github.repository == 'ShlomoCode/localsend' && github.ref == 'refs/heads/codex/diagnose-3536-round1' && inputs.confirmation == 'RUN-3536-OFFICIAL-PAIR'
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Start absolute task clock
        timeout-minutes: 1
        shell: powershell
        run: |
          "DIAG_STARTED_UTC=$([DateTime]::UtcNow.ToString("o"))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIAG_EVIDENCE=$env:RUNNER_TEMP\issue3536-evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Run untouched official applications through native UI
        timeout-minutes: 19
        shell: powershell
        run: |
          & support/diagnostics/3536/supervise.ps1 -Evidence $env:DIAG_EVIDENCE -StartedUtc ([DateTime]$env:DIAG_STARTED_UTC)
          exit $LASTEXITCODE
      - name: Retain original evidence and verify media
        timeout-minutes: 2
        if: always()
        shell: powershell
        run: |
          & support/diagnostics/3536/retain.ps1 -Evidence $env:DIAG_EVIDENCE
      - name: Upload original evidence
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3536-official-pair-${{ github.run_id }}
          path: ${{ env.DIAG_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
