name: Observe Require PIN 3318
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN-3318-REQUIRE-PIN for this official-release observation
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: diagnostic-3318-require-pin
  cancel-in-progress: false
jobs:
  official-pin:
    if: github.repository == 'ShlomoCode/localsend' && github.ref == 'refs/heads/codex/diagnose-require-pin-3318' && inputs.confirmation == 'RUN-3318-REQUIRE-PIN'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Start absolute clock
        timeout-minutes: 1
        shell: powershell
        run: |
          "DIAG_STARTED_UTC=$([DateTime]::UtcNow.ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DIAG_EVIDENCE=$env:RUNNER_TEMP\issue3318-evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: Observe ordinary Receive control and actual PIN dialog
        timeout-minutes: 10
        shell: powershell
        run: |
          & support/diagnostics/3318/supervise.ps1 -Evidence $env:DIAG_EVIDENCE -StartedUtc ([DateTime]$env:DIAG_STARTED_UTC)
          exit $LASTEXITCODE
      - name: Retain raw originals and check media
        timeout-minutes: 2
        if: always()
        shell: powershell
        run: |
          & support/diagnostics/3318/retain.ps1 -Evidence $env:DIAG_EVIDENCE
      - name: Upload original evidence
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3318-require-pin-${{ github.run_id }}
          path: ${{ env.DIAG_EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
