name: Diagnose issue 508 autostart

on:
  workflow_dispatch:
  push:
    branches:
      - codex/diagnose-issue508-autostart
    paths:
      - .github/workflows/diagnose-issue508.yml
      - support/diagnostics/issue508/**

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10.0", "1.14.0", "1.18.2"]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      XDG_SESSION_TYPE: x11
      XDG_CURRENT_DESKTOP: OPENBOX
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v6
      - name: Install desktop and diagnostic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgtk-3-0 libayatana-appindicator3-1 xvfb openbox dbus-x11 xdotool scrot tesseract-ocr python3
          mkdir -p "$RUNNER_TEMP/issue508-${{ matrix.version }}" "$RUNNER_TEMP/issue508-runtime"
          chmod 700 "$RUNNER_TEMP/issue508-runtime"
          test -e /dev/fuse
      - name: Exercise published release
        id: diagnostic
        continue-on-error: true
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/issue508-runtime
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' \
            dbus-run-session -- \
            python3 support/diagnostics/issue508/run.py \
              --version '${{ matrix.version }}' \
              --output "$RUNNER_TEMP/issue508-${{ matrix.version }}"
      - name: Show outcome
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/issue508-${{ matrix.version }}/result.json"; then
            cat "$RUNNER_TEMP/issue508-${{ matrix.version }}/result.json"
          else
            echo 'No result.json was produced; see the diagnostic step log.'
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue508-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/issue508-${{ matrix.version }}/**/*.png
            ${{ runner.temp }}/issue508-${{ matrix.version }}/**/*.json
            ${{ runner.temp }}/issue508-${{ matrix.version }}/**/*.log
            ${{ runner.temp }}/issue508-${{ matrix.version }}/**/*.desktop
            ${{ runner.temp }}/issue508-${{ matrix.version }}/mounts.txt
          if-no-files-found: warn
