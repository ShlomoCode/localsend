name: Diagnose 2051 Android Open
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Destination experiment
        type: choice
        default: saf
        options: [saf, direct-history]
      apk_run_id:
        description: Optional immutable historical control build run
        type: string
        default: ''
  push:
    branches: [codex/diagnose-2051-open]
    paths: [.github/workflows/diagnose-2051.yml, support/diagnostics/2051/**]
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    env:
      ISSUE2051_SCENARIO: ${{ inputs.scenario || 'saf' }}
      ISSUE2051_APK_RUN: ${{ inputs.apk_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check diagnostic syntax
        run: python3 -m py_compile support/diagnostics/2051/scenario.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare UI automation
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
      - name: Prepare release and emulators
        run: |
          export ANDROID_USER_HOME="$RUNNER_TEMP/issue2051-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p evidence "$ANDROID_AVD_HOME"
          trap 'adb devices > evidence/adb-devices.txt; tail -n 100 evidence/*-emulator.log || true' EXIT
          if [[ -n "$ISSUE2051_APK_RUN" ]]; then
            [[ "$ISSUE2051_APK_RUN" =~ ^[0-9]+$ ]]
            gh run download "$ISSUE2051_APK_RUN" --repo ShlomoCode/localsend --pattern "issue-2051-historical-control-$ISSUE2051_APK_RUN-*" --dir /tmp/issue2051-build
            mapfile -t apk_paths < <(find /tmp/issue2051-build -name app-release.apk -type f)
            [[ "${#apk_paths[@]}" == 1 ]]
            cp "${apk_paths[0]}" /tmp/localsend.apk
            printf '%s\n' "$ISSUE2051_APK_RUN" > evidence/apk-build-run.txt
            cp -r /tmp/issue2051-build evidence/apk-build-artifact
          else
            curl -fL https://github.com/localsend/localsend/releases/download/v1.16.1/LocalSend-1.16.1-android-x64.apk -o /tmp/localsend.apk
            printf '%s\n' official-release-v1.16.1 > evidence/apk-build-run.txt
          fi
          curl -fL https://github.com/gsantner/markor/releases/download/v2.16.1/net.gsantner.markor-v163-2.16.1-flavorDefault-release.apk -o /tmp/markor.apk
          sha256sum /tmp/localsend.apk /tmp/markor.apk > evidence/artifact-sha256.txt
          sudo chmod 666 /dev/kvm
          sdkmanager "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64"
          echo no | avdmanager create avd -n receiver -k "system-images;android-30;google_apis;x86_64" --force
          echo no | avdmanager create avd -n sender -k "system-images;android-30;google_apis;x86_64" --force
          avdmanager list avd > evidence/avds.txt
          find "$ANDROID_USER_HOME" -maxdepth 3 -type f > evidence/avd-files.txt
          "$ANDROID_HOME/emulator/emulator" -avd receiver -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -no-snapshot > evidence/receiver-emulator.log 2>&1 &
          "$ANDROID_HOME/emulator/emulator" -avd sender -port 5556 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -no-snapshot > evidence/sender-emulator.log 2>&1 &
          for serial in emulator-5554 emulator-5556; do
            timeout 180 adb -s "$serial" wait-for-device
            timeout 180 bash -c "until adb -s $serial shell getprop sys.boot_completed | tr -d \"\\r\" | grep -q 1; do sleep 2; done"
            adb -s "$serial" shell input keyevent 82
            adb -s "$serial" install /tmp/localsend.apk
            adb -s "$serial" shell settings put system show_touches 1
            adb -s "$serial" shell pm grant org.localsend.localsend_app android.permission.READ_EXTERNAL_STORAGE || true
            adb -s "$serial" shell pm grant org.localsend.localsend_app android.permission.WRITE_EXTERNAL_STORAGE || true
            adb -s "$serial" shell monkey -p org.localsend.localsend_app 1
          done
          adb -s emulator-5554 install /tmp/markor.apk
          adb -s emulator-5554 shell pm grant net.gsantner.markor android.permission.READ_EXTERNAL_STORAGE || true
          adb -s emulator-5554 shell pm grant net.gsantner.markor android.permission.WRITE_EXTERNAL_STORAGE || true
          adb -s emulator-5554 shell appops set net.gsantner.markor MANAGE_EXTERNAL_STORAGE allow
          adb -s emulator-5554 shell dumpsys package net.gsantner.markor > evidence/markor-permissions.txt
          adb -s emulator-5554 shell appops get net.gsantner.markor > evidence/markor-appops.txt
          appium --port 4723 > evidence/appium.log 2>&1 &
          sleep 5
          python3 support/diagnostics/2051/scenario.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-2051-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
