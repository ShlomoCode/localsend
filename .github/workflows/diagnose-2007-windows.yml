name: Diagnose issue 2007 Windows 11 sender
on:
  workflow_dispatch:
jobs:
  windows-vivo-control:
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue2007-windows-${{ github.run_id }}
      BASELINE_APP: bs://59b2370a166b5e36a4c948c50f22b70255046822
      ISSUE_2007_RELEASE: '1.17.0'
      ISSUE_2007_VARIANT: unchanged
      ISSUE_2007_DELETE_TIMING: acknowledged
      BS_DEVICE: Vivo Y21
      BS_OS: '11.0'
      SCENARIO_MODULE: ${{ github.workspace }}/support/diagnostics/2007-physical-control.mjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated relay capability
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/tmp/helper,evidence | Out-Null
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");'
      - name: Build separate transport helper
        shell: pwsh
        run: ./support/cloud_transport/build-helper.ps1
      - name: Connect Local and run original applications in one process scope
        shell: pwsh
        run: |
          Invoke-WebRequest https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip -OutFile C:/tmp/bs-local.zip
          Expand-Archive C:/tmp/bs-local.zip C:/tmp/bs-local-bin -Force
          Get-FileHash C:/tmp/bs-local-bin/BrowserStackLocal.exe | ConvertTo-Json | Set-Content evidence/local-binary-hash.json
          Start-Process node -ArgumentList support/cloud_transport/local.mjs -RedirectStandardOutput "$PWD/evidence/local.stdout.txt" -RedirectStandardError "$PWD/evidence/local.stderr.txt"
          $deadline=(Get-Date).AddSeconds(240)
          while(-not (Test-Path C:/tmp/helper/local-ready) -and (Get-Date) -lt $deadline){Start-Sleep 2}
          if(-not (Test-Path C:/tmp/helper/local-ready)){throw 'BrowserStack Local not ready'}
          Start-Sleep -Seconds 15
          curl.exe --fail --silent --show-error -u "$($env:BROWSERSTACK_USERNAME):$($env:BROWSERSTACK_ACCESS_KEY)" https://api-cloud.browserstack.com/app-automate/upload -F file=@C:/tmp/helper/cloud-transport-helper.apk -o C:/tmp/helper/upload.json
          if($LASTEXITCODE -ne 0){throw 'Helper upload failed'}
          $env:HELPER_APP=(Get-Content C:/tmp/helper/upload.json | ConvertFrom-Json).app_url
          if(-not $env:HELPER_APP){throw 'No helper app URL'}
          node support/cloud_transport/mobile-control.mjs
          if($LASTEXITCODE -ne 0){throw 'Original application control failed'}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue-2007-original-app-control-${{ github.run_id }}
          path: |
            evidence/
            !evidence/release/**
            !evidence/*.zip
            mobile-control-results.json
            mobile-control-final-status.json
            mobile-control-error.txt
            helper-failure-source.xml
            helper-failure.png
            localsend-source.xml
