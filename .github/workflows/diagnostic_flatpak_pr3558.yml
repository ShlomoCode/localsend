name: Diagnostic PR3558 Flatpak installed launch smoke
on:
  push:
    branches: [codex/pr3558-diagnostic-flatpak]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalSend-PR3558-linux-x86_64-diagnostic
          run-id: 37862192014
          github-token: ${{ github.token }}
          path: diagnostic-output
      - name: Install exact diagnostic bundle
        run: |
          cd diagnostic-output
          sha256sum -c SHA256SUMS
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb dbus-x11 x11-utils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y *.flatpak
          flatpak info org.localsend.localsend_app >flatpak-info.txt
      - name: Actual installed app launch and window proof
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a dbus-run-session -- bash -c '
            flatpak run org.localsend.localsend_app >diagnostic-output/smoke-launch.log 2>&1 &
            app_pid=$!
            sleep 20
            kill -0 "$app_pid"
            xwininfo -root -tree | tee diagnostic-output/smoke-window-tree.txt
            ss -lntp | tee diagnostic-output/smoke-listening-sockets.txt
            rg -i "localsend" diagnostic-output/smoke-window-tree.txt
            kill "$app_pid"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LocalSend-PR3558-linux-x86_64-smoke-evidence
          path: diagnostic-output/
          retention-days: 30
