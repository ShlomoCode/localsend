name: Diagnose 2830 clipboard UI readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipboard-readiness:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact short text in original Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture | ConvertTo-Json | Set-Content evidence/os.json
          ./support/diagnostics/windows2830-startup.ps1 -OutputDirectory evidence -ReleaseVersion 1.17.0 -AssetArchitecture x86-64 -RunnerLabel windows-11-arm -StartupOnly
          pwsh -NoProfile -STA -File support/diagnostics/windows2830-clipboard.ps1 -Case short
          if($LASTEXITCODE -ne 0){throw "Clipboard fixture failed"}
          pwsh -NoProfile -File support/diagnostics/windows2830-ui.ps1 -Action click -X 380 -Y 85 -Label short-windows-clipboard
          if($LASTEXITCODE -ne 0){throw "Clipboard UI action failed"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2830-clipboard-readiness
          path: evidence
          retention-days: 14
