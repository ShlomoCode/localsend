name: Issue 1549 historical upgrade diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-upgrade:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install WinGet if unavailable
        shell: pwsh
        run: |
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
            Repair-WinGetPackageManager -AllUsers -Force -Latest
          }
      - name: Measure original release upgrade
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File support/diagnostics/issue1549.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue1549-historical-upgrade-${{ github.run_id }}
          path: evidence/cloud
          if-no-files-found: error
