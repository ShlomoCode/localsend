name: Build windows exe (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_filename_validation:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Source identity and host
        shell: bash
        run: |
          git rev-parse HEAD
          shasum -a 256 support/native_filename_validation/src/filename.rs
          rustc --version
          uname -a
      - name: Source unit tests
        shell: bash
        run: cargo test --manifest-path support/native_filename_validation/Cargo.toml --locked -- --nocapture
      - name: Native filesystem writes
        shell: bash
        run: cargo run --manifest-path support/native_filename_validation/Cargo.toml --locked --release | tee native-filename-results.txt
      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-filename-${{ matrix.os }}
          path: native-filename-results.txt
          if-no-files-found: warn
