name: Diagnose 3393 Windows Android networking
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [software-emulator, windows11-sender-ui, physical-control, prepare-media-fixtures, sender-favorites-qualification]
        default: software-emulator
      bs_device:
        type: choice
        options: [Google Pixel 9, OnePlus 13R, Samsung Galaxy S25, Google Pixel 4, Samsung Galaxy S20]
        default: Google Pixel 9
      bs_os:
        type: choice
        options: ['15.0', '10.0']
        default: '15.0'
      picker_dwell_ms:
        type: choice
        options: ['10000', '20000', '30000']
        default: '10000'
      physical_runner:
        type: choice
        options: [windows-11-arm, windows-2022]
        default: windows-11-arm
      source_run_id:
        type: string
        default: ''
      source_apk_kind:
        type: choice
        options: [original-release, control, tagged, baseline, candidate]
        default: original-release
      source_family:
        type: choice
        options: [historical, current, candidate]
        default: historical
      validation_suite:
        type: choice
        options: [png, extended, precision-source-control, remaining-media]
        default: png
      media_fixture_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  sender-favorites-qualification:
    if: inputs.scenario == 'sender-favorites-qualification'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      ISSUE2311_SENDER_FAVORITES_QUALIFICATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Qualify untouched positive and negative Favorites references
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          ./support/diagnostics/issue2311-favorites-gate.ps1 -Mode Preflight -OutputPath evidence/favorites-gate-preflight.json
      - name: Require the original shared fixture artifact
        shell: pwsh
        env:
          FIXTURE_RUN_ID: ${{ inputs.media_fixture_run_id }}
        run: |
          if ($env:FIXTURE_RUN_ID -ne '38183553686') { throw 'Sender qualification requires the original immutable fixture run' }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.media_fixture_run_id }}
          pattern: issue2311-media-fixtures-${{ inputs.media_fixture_run_id }}
          merge-multiple: true
          path: media-fixtures
          repository: ShlomoCode/localsend
      - name: Observe one physical Favorites gesture without allocating a receiver
        shell: pwsh
        run: ./support/diagnostics/issue2311-sender-favorites.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2311-sender-favorites-${{ github.run_id }}
          path: |
            evidence
            !evidence/release/**
            !evidence/**/*.zip
          retention-days: 14
  media-fixtures:
    if: inputs.scenario == 'prepare-media-fixtures'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate one immutable image and video fixture artifact
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Pinned FFmpeg provisioning failed' }
            $env:PATH = "$env:ChocolateyInstall/bin;$env:PATH"
          }
          ./support/diagnostics/windows2311-fixtures.ps1 -OutputDirectory media-fixtures
      - name: Retain supported device inventory before choosing Android 29 receiver
        shell: pwsh
        run: |
          curl.exe --fail --silent --show-error -u "$($env:BROWSERSTACK_USERNAME):$($env:BROWSERSTACK_ACCESS_KEY)" https://api-cloud.browserstack.com/app-automate/devices.json -o media-fixtures/supported-devices.json
          if ($LASTEXITCODE -ne 0) { throw 'Supported BrowserStack inventory retrieval failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2311-media-fixtures-${{ github.run_id }}
          path: media-fixtures/
          if-no-files-found: error
          retention-days: 30
  windows-android:
    if: inputs.scenario == 'software-emulator'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Inspect virtualization and SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture | ConvertTo-Json | Set-Content evidence/os.json
          Get-CimInstance Win32_Processor | Select-Object Name,VirtualizationFirmwareEnabled,SecondLevelAddressTranslationExtensions | ConvertTo-Json | Set-Content evidence/cpu.json
          Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform | Out-String | Set-Content evidence/whpx.txt
          "ANDROID_HOME=$env:ANDROID_HOME ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" | Set-Content evidence/sdk.txt
          Get-ChildItem "$env:ANDROID_HOME" | Out-String | Add-Content evidence/sdk.txt
          & "$env:ANDROID_HOME/emulator/emulator.exe" -accel-check 2>&1 | Tee-Object evidence/accel.txt
          exit 0
      - name: Prepare Android15 software emulator and released applications
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          1..100 | ForEach-Object { 'y' } | & $sdkmanager 'system-images;android-35;google_apis;x86_64' 'platform-tools' 'emulator' 2>&1 | Tee-Object evidence/sdk-install.txt
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
          'no' | & "$env:ANDROID_HOME/cmdline-tools/latest/bin/avdmanager.bat" create avd -n issue2311 -k 'system-images;android-35;google_apis;x86_64' --force
          Invoke-WebRequest https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-android-x64.apk -OutFile evidence/android.apk
          Invoke-WebRequest https://github.com/localsend/localsend/releases/download/v1.17.0/LocalSend-1.17.0-windows-x86-64.zip -OutFile evidence/windows.zip
          Get-FileHash evidence/android.apk,evidence/windows.zip | ConvertTo-Json | Set-Content evidence/artifact-hashes.json
          Expand-Archive evidence/windows.zip sender
          Start-Process "$env:ANDROID_HOME/emulator/emulator.exe" -ArgumentList '-avd issue2311 -accel off -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2' -RedirectStandardOutput evidence/emulator.stdout.txt -RedirectStandardError evidence/emulator.stderr.txt
          $adb = "$env:ANDROID_HOME/platform-tools/adb.exe"
          $deadline = (Get-Date).AddMinutes(22)
          do {
            Start-Sleep 15
            $boot = & $adb shell getprop sys.boot_completed 2>&1
            "$(Get-Date -Format o) $boot" | Add-Content evidence/boot.txt
          } until ($boot -match '^1' -or (Get-Date) -gt $deadline)
          if ($boot -notmatch '^1') { throw 'Android15 did not boot before deadline' }
          & $adb shell getprop | Set-Content evidence/android-properties.txt
          & $adb install evidence/android.apk | Set-Content evidence/install.txt
          & $adb forward tcp:53317 tcp:53317
          & $adb shell monkey -p org.localsend.localsend_app 1 | Set-Content evidence/android-launch.txt
          Start-Sleep 15
          & $adb shell uiautomator dump /sdcard/window.xml
          & $adb pull /sdcard/window.xml evidence/android-window.xml
          & $adb shell screencap -p /sdcard/startup.png
          & $adb pull /sdcard/startup.png evidence/android-startup.png
          & $adb logcat -d | Set-Content evidence/android-logcat.txt
          $exe = Get-ChildItem sender -Recurse -Filter localsend_app.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList (Join-Path $PWD 'evidence/artifact-hashes.json')
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $image.Save((Join-Path $PWD 'evidence/windows-startup.png'))
          Get-Process localsend_app | Select-Object Id,MainWindowTitle,MainWindowHandle | ConvertTo-Json | Set-Content evidence/windows-process.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2311-network-feasibility
          path: evidence
          retention-days: 14
  physical-control:
    if: inputs.scenario == 'physical-control'
    runs-on: ${{ inputs.physical_runner || 'windows-11-arm' }}
    timeout-minutes: 25
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue2311-${{ github.run_id }}
      DIAGNOSTIC_RUNNER_LABEL: ${{ inputs.physical_runner || 'windows-11-arm' }}
      BASELINE_APP: bs://59b2370a166b5e36a4c948c50f22b70255046822
      BS_DEVICE: ${{ inputs.bs_device || 'Google Pixel 9' }}
      PICKER_LONG_DWELL_MS: ${{ inputs.picker_dwell_ms || '10000' }}
      BS_OS: ${{ inputs.bs_os || '15.0' }}
      VALIDATION_SUITE: ${{ inputs.validation_suite || 'png' }}
      MEDIA_FIXTURE_DIRECTORY: ${{ github.workspace }}/media-fixtures
      SCENARIO_MODULE: ${{ github.workspace }}/support/cloud_transport/scenario2311.mjs
      SOURCE_APK_KIND: ${{ inputs.source_apk_kind || 'original-release' }}
      SOURCE_APP_FAMILY: ${{ inputs.source_family || 'historical' }}
      EXPECTED_CANDIDATE_SOURCE: bd8140f493240c3f76701af998a8b9e94f2f99d7
      EXPECTED_GAL_SOURCE: 55dabd7b43927e5b0ad87cf0ab3dab06950ebe2f
    steps:
      - uses: actions/checkout@v4
      - name: Qualify retained positive and negative Favorites frames before allocating a device
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          ./support/diagnostics/issue2311-favorites-gate.ps1 -Mode Preflight -OutputPath evidence/favorites-gate-preflight.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - name: Prepare isolated relay capability and helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/tmp/helper,evidence | Out-Null
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");'
      - name: Retrieve exact source-build APK lineage
        if: inputs.source_apk_kind != 'original-release'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: ${{ inputs.source_family == 'candidate' && format('issue2311-candidate-build-pair-{0}-1', inputs.source_run_id) || inputs.source_family == 'current' && 'issue2311-current-boundary-*' || 'issue2311-source-boundary-*' }}
          merge-multiple: true
          path: source-artifact
      - name: Upload selected source-build APK for real receiver workflow
        if: inputs.source_apk_kind != 'original-release'
        shell: pwsh
        run: |
          $version=if($env:SOURCE_APP_FAMILY -eq 'current'){'current'}else{'1.17.0'}
          $apk=if($env:SOURCE_APP_FAMILY -eq 'candidate'){"source-artifact/localsend-candidate-pair-$env:SOURCE_APK_KIND-arm64.apk"}else{"source-artifact/localsend-$version-source-$env:SOURCE_APK_KIND-arm64.apk"}
          if(-not (Test-Path $apk)){throw 'Selected source APK missing'}
          $identity=Get-Content source-artifact/identity.txt -Raw
          New-Item -ItemType Directory evidence/source-lineage -Force|Out-Null
          if($env:SOURCE_APP_FAMILY -eq 'candidate'){
            $contract=Get-Content source-artifact/artifact-contract.json -Raw|ConvertFrom-Json
            $candidateRef=[string]$contract.candidate_source;$galRef=[string]$contract.gal_source
            if($candidateRef -notmatch '^[0-9a-f]{40}$' -or $galRef -notmatch '^[0-9a-f]{40}$'){throw 'Immutable candidate inputs required'}
            if($env:EXPECTED_CANDIDATE_SOURCE -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_GAL_SOURCE -notmatch '^[0-9a-f]{40}$'){throw 'Final reviewed candidate and Gal source refs must be set before runtime validation'}
            if($candidateRef -ne $env:EXPECTED_CANDIDATE_SOURCE -or $galRef -ne $env:EXPECTED_GAL_SOURCE){throw 'Candidate pair refs differ from the final reviewed source refs'}
            if($contract.source_family -ne 'candidate' -or $contract.baseline_source -ne 'c1ce322fb3acf08e44f329b8b7208b8b0d91e244'){throw 'Candidate pair source identity differs'}
            $entries=@($contract.artifacts|Where-Object {$_.kind -eq $env:SOURCE_APK_KIND})
            if($entries.Count -ne 1 -or $entries[0].filename -ne (Split-Path $apk -Leaf) -or $entries[0].sha256 -ne (Get-FileHash $apk).Hash.ToLowerInvariant()){throw 'Candidate APK hash/identity differs from contract'}
            Get-ChildItem source-artifact|Where-Object {$_.Name -notlike '*.apk'}|Copy-Item -Destination evidence/source-lineage/ -Recurse
          }else{
            $expected=if($env:SOURCE_APP_FAMILY -eq 'current'){'current_source=c1ce322fb3acf08e44f329b8b7208b8b0d91e244'}else{'historical_source=7f21d1f9082a43803e05c37f021912e012145aa5'}
            if($identity -notmatch $expected){throw 'Source identity differs from selected family'}
            Copy-Item source-artifact/*.txt,source-artifact/*.sha256,source-artifact/*.diff,source-artifact/file_saver*.dart evidence/source-lineage/
          }
          Get-FileHash $apk | ConvertTo-Json | Set-Content evidence/source-receiver-apk.json
          curl.exe --fail --silent --show-error -u "$($env:BROWSERSTACK_USERNAME):$($env:BROWSERSTACK_ACCESS_KEY)" https://api-cloud.browserstack.com/app-automate/upload -F "file=@$apk" -o C:/tmp/helper/source-upload.json
          if($LASTEXITCODE -ne 0){throw 'Source APK upload failed'}
          $app=(Get-Content C:/tmp/helper/source-upload.json|ConvertFrom-Json).app_url
          if(-not $app){throw 'No source app URL returned'}
          "BASELINE_APP=$app" | Add-Content $env:GITHUB_ENV
      - name: Retrieve exact shared media fixtures
        if: inputs.validation_suite == 'extended' || inputs.validation_suite == 'remaining-media'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.media_fixture_run_id }}
          name: issue2311-media-fixtures-${{ inputs.media_fixture_run_id }}
          path: media-fixtures
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the separate transport app
        shell: pwsh
        run: ./support/cloud_transport/build-helper.ps1
      - name: Start Local and run the physical app control in one process scope
        shell: pwsh
        run: |
          Invoke-WebRequest https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip -OutFile C:/tmp/bs-local.zip
          Expand-Archive C:/tmp/bs-local.zip C:/tmp/bs-local-bin -Force
          Get-FileHash C:/tmp/bs-local-bin/BrowserStackLocal.exe | ConvertTo-Json | Set-Content evidence/local-binary-hash.json
          New-NetFirewallRule -Name Issue2311BrowserStackLocal -DisplayName Issue2311BrowserStackLocal -Direction Inbound -Program (Resolve-Path C:/tmp/bs-local-bin/BrowserStackLocal.exe).Path -Action Allow -Profile Any | Out-Null
          New-NetFirewallRule -Name Issue2311RelayNode -DisplayName Issue2311RelayNode -Direction Inbound -Program (Get-Command node).Source -Protocol TCP -LocalPort 8080,53318 -Action Allow -Profile Any | Out-Null
          Start-Process node -ArgumentList support/cloud_transport/local.mjs -RedirectStandardOutput "$PWD/evidence/local.stdout.txt" -RedirectStandardError "$PWD/evidence/local.stderr.txt"
          $deadline=(Get-Date).AddSeconds(240)
          while(-not (Test-Path C:/tmp/helper/local-ready) -and (Get-Date) -lt $deadline){Start-Sleep 2}
          if(-not (Test-Path C:/tmp/helper/local-ready)){
            Get-Content evidence/local.stdout.txt,evidence/local.stderr.txt -ErrorAction SilentlyContinue
            throw 'BrowserStack Local did not become ready'
          }
          Start-Sleep -Seconds 15
          Get-Process node,BrowserStackLocal -ErrorAction SilentlyContinue | Select-Object ProcessName,Id,StartTime | ConvertTo-Json | Set-Content evidence/local-processes-before-session.json
          curl.exe --fail --silent --show-error -u "$($env:BROWSERSTACK_USERNAME):$($env:BROWSERSTACK_ACCESS_KEY)" https://api-cloud.browserstack.com/app-automate/upload -F file=@C:/tmp/helper/cloud-transport-helper.apk -o C:/tmp/helper/upload.json
          if($LASTEXITCODE -ne 0){throw 'Helper upload failed'}
          $env:HELPER_APP=(Get-Content C:/tmp/helper/upload.json | ConvertFrom-Json).app_url
          if(-not $env:HELPER_APP){throw 'No helper app URL'}
          node support/cloud_transport/mobile-control.mjs
      - name: Collect session identity
        if: always()
        shell: pwsh
        run: Copy-Item C:/tmp/helper/session-id evidence/session-id -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2311-physical-control
          path: |
            evidence
            !evidence/release/**
            !evidence/**/*.zip
            mobile-control-results.json
            mobile-control-final-status.json
            mobile-control-error.txt
            helper-failure-source.xml
            helper-failure.png
            localsend-source.xml
            relay-trace.json
          retention-days: 14
  windows11-sender-ui:
    if: inputs.scenario == 'windows11-sender-ui'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select a real file through the original Windows sender
        shell: pwsh
        run: |
          ./support/diagnostics/windows_release_ui_probe.ps1 -OutputDirectory evidence -ReleaseVersion 1.17.0 -AssetArchitecture x86-64 -RunnerLabel windows-11-arm -FixtureTimestampUtc '2026-10-11T00:00:00Z' -FixtureFileName issue2311-payload.txt -SelectionMethod PathEntry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2311-windows11-sender-ui
          path: evidence
          retention-days: 14
