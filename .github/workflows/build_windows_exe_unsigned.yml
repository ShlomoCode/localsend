name: Diagnose 3393 Windows Android networking
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        options: [software-emulator, windows11-sender-ui]
        default: software-emulator
permissions:
  contents: read
jobs:
  windows-android:
    if: inputs.scenario == 'software-emulator'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Inspect virtualization and SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence -Force | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture | ConvertTo-Json | Set-Content evidence/os.json
          Get-CimInstance Win32_Processor | Select-Object Name,VirtualizationFirmwareEnabled,SecondLevelAddressTranslationExtensions | ConvertTo-Json | Set-Content evidence/cpu.json
          Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform | Out-String | Set-Content evidence/whpx.txt
          "ANDROID_HOME=$env:ANDROID_HOME ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT" | Set-Content evidence/sdk.txt
          Get-ChildItem "$env:ANDROID_HOME" | Out-String | Add-Content evidence/sdk.txt
          & "$env:ANDROID_HOME/emulator/emulator.exe" -accel-check 2>&1 | Tee-Object evidence/accel.txt
          exit 0
      - name: Prepare Android15 software emulator and released applications
        shell: pwsh
        run: |
          $sdkmanager = "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          1..100 | ForEach-Object { 'y' } | & $sdkmanager 'system-images;android-35;google_apis;x86_64' 'platform-tools' 'emulator' 2>&1 | Tee-Object evidence/sdk-install.txt
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
          'no' | & "$env:ANDROID_HOME/cmdline-tools/latest/bin/avdmanager.bat" create avd -n issue3393 -k 'system-images;android-35;google_apis;x86_64' --force
          Invoke-WebRequest https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-android-x64.apk -OutFile evidence/android.apk
          Invoke-WebRequest https://github.com/localsend/localsend/releases/download/v1.17.0/LocalSend-1.17.0-windows-x86-64.zip -OutFile evidence/windows.zip
          Get-FileHash evidence/android.apk,evidence/windows.zip | ConvertTo-Json | Set-Content evidence/artifact-hashes.json
          Expand-Archive evidence/windows.zip sender
          Start-Process "$env:ANDROID_HOME/emulator/emulator.exe" -ArgumentList '-avd issue3393 -accel off -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2' -RedirectStandardOutput evidence/emulator.stdout.txt -RedirectStandardError evidence/emulator.stderr.txt
          $adb = "$env:ANDROID_HOME/platform-tools/adb.exe"
          $deadline = (Get-Date).AddMinutes(22)
          do {
            Start-Sleep 15
            $boot = & $adb shell getprop sys.boot_completed 2>&1
            "$(Get-Date -Format o) $boot" | Add-Content evidence/boot.txt
          } until ($boot -match '^1' -or (Get-Date) -gt $deadline)
          if ($boot -notmatch '^1') { throw 'Android15 did not boot before deadline' }
          & $adb shell getprop | Set-Content evidence/android-properties.txt
          & $adb install evidence/android.apk | Set-Content evidence/install.txt
          & $adb forward tcp:53317 tcp:53317
          & $adb shell monkey -p org.localsend.localsend_app 1 | Set-Content evidence/android-launch.txt
          Start-Sleep 15
          & $adb shell uiautomator dump /sdcard/window.xml
          & $adb pull /sdcard/window.xml evidence/android-window.xml
          & $adb shell screencap -p /sdcard/startup.png
          & $adb pull /sdcard/startup.png evidence/android-startup.png
          & $adb logcat -d | Set-Content evidence/android-logcat.txt
          $exe = Get-ChildItem sender -Recurse -Filter localsend_app.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList (Join-Path $PWD 'evidence/artifact-hashes.json')
          Start-Sleep 10
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $image = New-Object System.Drawing.Bitmap $bounds.Width,$bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($image)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $image.Save((Join-Path $PWD 'evidence/windows-startup.png'))
          Get-Process localsend_app | Select-Object Id,MainWindowTitle,MainWindowHandle | ConvertTo-Json | Set-Content evidence/windows-process.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue3393-network-feasibility
          path: evidence
          retention-days: 14
  windows11-sender-ui:
    if: inputs.scenario == 'windows11-sender-ui'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select a real file through the original Windows sender
        shell: pwsh
        run: |
          ./support/diagnostics/windows_release_ui_probe.ps1 -OutputDirectory evidence -ReleaseVersion 1.17.0 -AssetArchitecture x86-64 -RunnerLabel windows-11-arm -FixtureTimestampUtc '2026-10-11T00:00:00Z' -FixtureFileName issue3393-payload.txt -SelectionMethod PathEntry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue3393-windows11-sender-ui
          path: evidence
          retention-days: 14
