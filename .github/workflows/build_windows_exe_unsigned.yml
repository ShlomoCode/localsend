name: Issue 1549 historical upgrade diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-upgrade:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install WinGet if unavailable
        shell: powershell
        run: |
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            $ProgressPreference = 'SilentlyContinue'
            New-Item -ItemType Directory -Force evidence/cloud | Out-Null
            $bootstrap = Join-Path $env:RUNNER_TEMP 'winget1549'
            New-Item -ItemType Directory -Force $bootstrap | Out-Null
            Invoke-WebRequest 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380/DesktopAppInstaller_Dependencies.zip' -OutFile "$bootstrap/dependencies.zip"
            Expand-Archive "$bootstrap/dependencies.zip" "$bootstrap/dependencies"
            $dependencies = @(Get-ChildItem "$bootstrap/dependencies" -Recurse -File | Where-Object { $_.FullName -match '\\x64\\' -and $_.Extension -in @('.appx','.msix') } | Select-Object -ExpandProperty FullName)
            if ($dependencies.Count -eq 0) { throw 'Official dependency archive has no x64 packages' }
            foreach ($dependency in $dependencies) { Add-AppxPackage $dependency }
            Invoke-WebRequest 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' -OutFile "$bootstrap/winget.msixbundle"
            Invoke-WebRequest 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380/e53e159d00e04f729cc2180cffd1c02e_License1.xml' -OutFile "$bootstrap/license.xml"
            Get-ChildItem $bootstrap -File | Get-FileHash | ConvertTo-Json | Set-Content evidence/cloud/bootstrap-hashes.json
            Add-AppxProvisionedPackage -Online -PackagePath "$bootstrap/winget.msixbundle" -LicensePath "$bootstrap/license.xml" -DependencyPackagePath $dependencies
            Add-AppxPackage "$bootstrap/winget.msixbundle" -DependencyPath $dependencies
          }
      - name: Measure original release upgrade
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File support/diagnostics/issue1549.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue1549-historical-upgrade-${{ github.run_id }}
          path: evidence/cloud
          if-no-files-found: error
