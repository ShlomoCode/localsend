name: Issue 1549 historical upgrade diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-upgrade:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Measure original release upgrade
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File support/diagnostics/issue1549.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue1549-historical-upgrade-${{ github.run_id }}
          path: evidence/cloud
          if-no-files-found: error
