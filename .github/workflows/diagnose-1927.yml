name: Diagnose Flatpak autostart 1927
on:
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop and official Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox dbus-x11 flatpak imagemagick xdotool tesseract-ocr ffmpeg
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.localsend.localsend_app
      - name: Observe actual settings
        run: dbus-run-session -- bash support/diagnostics/issue1927.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1927-baseline-${{ github.run_id }}
          path: evidence/
