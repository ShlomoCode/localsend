name: Diagnose Flatpak autostart 1927
on:
  workflow_dispatch:
  push:
    branches: [codex/bug-1927-diagnostics]
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: issue1927-source-38166504952
          run-id: 38166504952
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence
      - name: Build normal stock-permission Flatpak package pair
        run: bash support/diagnostics/issue1927-package.sh
      - name: Preserve files after every outcome
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence && chmod -R a+rX evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1927-packages-${{ github.run_id }}
          path: evidence/
