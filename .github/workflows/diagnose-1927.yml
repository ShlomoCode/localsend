name: Diagnose Flatpak autostart 1927
on:
  workflow_dispatch:
  push:
    branches: [codex/bug-1927-diagnostics]
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Exercise normal Flatpak and Cinnamon login on Mint 22.2
        run: bash support/diagnostics/issue1927-mint.sh
      - name: Preserve VM files after every outcome
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" evidence && chmod -R a+rX evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1927-mint-${{ github.run_id }}
          path: evidence/
