name: Reproduce Debian 13 appindicator dependency

on:
  push:
    branches: [codex/repro-debian13-2898]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Download the reported 1.17.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reproduction
          gh release download v1.17.0 --repo localsend/localsend \
            --pattern LocalSend-1.17.0-linux-x86-64.deb --dir reproduction
          sha256sum reproduction/*.deb | tee reproduction/package.sha256
          echo 'b0244b2c3eacb2a81d61b2662534d6036ab37ace10d6782da36b630c222fa04c  reproduction/LocalSend-1.17.0-linux-x86-64.deb' | sha256sum -c -
      - name: Verify working control with Ayatana installed
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -w /work debian:13 \
            bash support/scripts/repro_debian13_appindicator.sh control
      - name: Installed package must start with its declared dependencies
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -w /work debian:13 \
            bash support/scripts/repro_debian13_appindicator.sh legacy
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debian13-appindicator-evidence
          path: |
            reproduction/*.log
            reproduction/*.sha256
