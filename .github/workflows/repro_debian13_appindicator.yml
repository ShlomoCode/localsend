name: Reproduce Debian 13 appindicator dependency

on:
  push:
    branches: [codex/repro-debian13-2898]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.17.0
            sha256: b0244b2c3eacb2a81d61b2662534d6036ab37ace10d6782da36b630c222fa04c
          - version: 1.18.2
            sha256: cc42a4f3eacdcb25ec31f0016b1272acb003145ab30484db8965450e20c72cd2
    env:
      RELEASE_VERSION: ${{ matrix.version }}
      RELEASE_SHA256: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reproduction
          gh release download "v$RELEASE_VERSION" --repo localsend/localsend \
            --pattern "LocalSend-$RELEASE_VERSION-linux-x86-64.deb" --dir reproduction
          sha256sum reproduction/*.deb | tee reproduction/package.sha256
          echo "$RELEASE_SHA256  reproduction/LocalSend-$RELEASE_VERSION-linux-x86-64.deb" | sha256sum -c -
      - name: Verify working control with Ayatana installed
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -w /work debian:13 \
            bash support/scripts/repro_debian13_appindicator.sh control \
              "/work/reproduction/LocalSend-$RELEASE_VERSION-linux-x86-64.deb"
      - name: Installed package must start with its declared dependencies
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" -w /work debian:13 \
            bash support/scripts/repro_debian13_appindicator.sh legacy \
              "/work/reproduction/LocalSend-$RELEASE_VERSION-linux-x86-64.deb"
      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debian13-appindicator-evidence-${{ matrix.version }}
          path: |
            reproduction/*.log
            reproduction/*.sha256
