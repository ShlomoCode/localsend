name: Record favorites dialog
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Reuse an exact-source recording-app artifact from this run (optional)
        default: ''
permissions:
  contents: read
jobs:
  recording:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        if: ${{ inputs.build_run == '' }}
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Prepare tooling and MSIX helper
        shell: pwsh
        run: |
          choco install tesseract ffmpeg --no-progress -y
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix
      - name: Build exact candidate source
        if: ${{ inputs.build_run == '' }}
        working-directory: app
        run: |
          dart pub global activate fvm
          & "$env:PUB_CACHE\bin\fvm.bat" use 3.41.9 --force
          if ($LASTEXITCODE -ne 0) {throw 'FVM setup failed'}
          & "$env:PUB_CACHE\bin\fvm.bat" flutter pub get
          if ($LASTEXITCODE -ne 0) {throw 'pub get failed'}
          & "$env:PUB_CACHE\bin\fvm.bat" flutter build windows --release
          if ($LASTEXITCODE -ne 0) {throw 'Windows build failed'}
      - uses: actions/download-artifact@v6
        if: ${{ inputs.build_run != '' }}
        with:
          name: recording-app
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: app/build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v6
        with:
          name: recording-app
          path: app/build/windows/x64/runner/Release
      - name: Source manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/favorites-recording" | Out-Null
          git rev-parse HEAD | Set-Content "$env:RUNNER_TEMP/favorites-recording/harness-commit.txt"
          git diff --name-only ac81c35d3c623df398ded2704f06b7a5401dec86 | Set-Content "$env:RUNNER_TEMP/favorites-recording/changed-paths.txt"
          if (git diff ac81c35d3c623df398ded2704f06b7a5401dec86 -- app packages) {throw 'Production source changed'}
      - name: Capture actual desktop apps
        shell: powershell
        run: |
          $ffmpeg = (Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          if (!$ffmpeg) { throw 'ffmpeg missing' }
          & ./support/test/windows/record-favorites.ps1 -Executable "$env:GITHUB_WORKSPACE/app/build/windows/x64/runner/Release/localsend_app.exe" -EvidenceDirectory "$env:RUNNER_TEMP/favorites-recording" -Ffmpeg $ffmpeg
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: favorites-recording
          path: |
            ${{ runner.temp }}/favorites-recording/*.mp4
            ${{ runner.temp }}/favorites-recording/*.json
            ${{ runner.temp }}/favorites-recording/*.txt
            ${{ runner.temp }}/favorites-recording/*.srt
            ${{ runner.temp }}/favorites-recording/*.png
          if-no-files-found: error
