name: Diagnose 2007 source APK comparison
on:
  workflow_dispatch:
    inputs:
      build_pair_run:
        description: Successful source build-pair run ID; dispatch only after fresh capacity check
        required: true
        type: string
      candidate_ref:
        description: Expected immutable candidate source SHA; verified before device allocation
        required: true
        type: string
      source_arms:
        description: Source comparison arm count
        required: true
        default: '4'
        type: choice
        options:
          - '4'
          - '2'
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnose-2007-source-device
  cancel-in-progress: false
jobs:
  source-session:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue2007-source-${{ github.run_id }}
      BS_DEVICE: Samsung Galaxy S21
      BS_OS: '11.0'
      ISSUE_2007_RELEASE: current-c1ce
      ISSUE_2007_SOURCE_COMPARISON: '1'
      ISSUE_2007_SCAN_COMPARISON: '0'
      ISSUE_2007_FINALIZE_INTERVENTION: ''
      ISSUE_2007_BUILD_PAIR_DIR: ${{ github.workspace }}/source-pair
      ISSUE_2007_BUILD_PAIR_JSON: ${{ github.workspace }}/source-pair/build-pair.json
      SCENARIO_MODULE: ${{ github.workspace }}/support/diagnostics/2007-source-session.mjs
      BASELINE_LINUX_SHA256: 98f6e749c0eb470b7d2bb4a365f704328ae7dc4bbc6d78ddf2d574dfb63cc20b
      PAIR_BUILD_RUN: ${{ inputs.build_pair_run }}
      ISSUE_2007_EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_ref }}
      ISSUE_2007_SOURCE_ARMS: ${{ inputs.source_arms }}
    steps:
      - uses: actions/checkout@v6
      - name: Static harness validation before device allocation
        run: |
          [[ "$PAIR_BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$ISSUE_2007_EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ISSUE_2007_SOURCE_ARMS" == 2 || "$ISSUE_2007_SOURCE_ARMS" == 4 ]]
          node --check support/cloud_transport/mobile-control.mjs
          node --check support/diagnostics/2007-source-session.mjs
          node --check support/diagnostics/2007-source-pair-preflight.mjs
          node --check support/diagnostics/2007-physical-control.mjs
          node --check support/diagnostics/2007-storage-observer.mjs
          bash -n support/cloud_transport/build-helper.sh
          mkdir -p evidence released
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install APK verification tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Reuse normal source baseline and candidate APK pair
        uses: actions/download-artifact@v5
        with:
          repository: ShlomoCode/localsend
          run-id: ${{ inputs.build_pair_run }}
          name: 2007-source-build-pair-${{ inputs.build_pair_run }}
          github-token: ${{ github.token }}
          path: source-pair
      - name: Verify immutable source APKs, package, architecture and common signer
        run: node support/diagnostics/2007-source-pair-preflight.mjs
      - name: Reuse existing unmodified c1ce Linux sender
        uses: actions/download-artifact@v5
        with:
          repository: ShlomoCode/localsend
          run-id: 38132747719
          name: issue2754-c1ce-flutter3419-linux-x64
          github-token: ${{ github.token }}
          path: current-reuse
      - name: Prepare normal Linux desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool scrot tesseract-ocr python3-pil ffmpeg network-manager gsettings-desktop-schemas at-spi2-core libayatana-appindicator3-1 libsecret-1-0 libgtk-3-0 libegl1 libgles2 libgl1-mesa-dri libopengl0 libglx-mesa0
          sudo systemctl start NetworkManager
          test "$(cat current-reuse/provenance/source-sha.txt)" = c1ce322fb3acf08e44f329b8b7208b8b0d91e244
          cp current-reuse/source-bundle.tar.gz released/linux.tar.gz
          cp -r current-reuse/provenance evidence/current-linux-provenance
          printf '%s  %s\n' "$BASELINE_LINUX_SHA256" released/linux.tar.gz | sha256sum -c -
          tar xf released/linux.tar.gz -C released
      - name: Verify transparent transport control
        run: node support/cloud_transport/control.mjs
      - name: Generate isolated relay capability
        run: |
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");'
      - name: Build separate read-only observer and transport helper
        run: bash support/cloud_transport/build-helper.sh
      - name: Connect BrowserStack Local
        run: |
          npm install --prefix /tmp/bs-local browserstack-local --no-audit --no-fund >/dev/null
          node support/cloud_transport/local.mjs > /tmp/bs-local.log 2>&1 &
          for attempt in $(seq 1 30); do test -f /tmp/helper/local-ready && break; sleep 2; done
          test -f /tmp/helper/local-ready
      - name: Upload separate transport helper
        run: |
          curl --fail --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" https://api-cloud.browserstack.com/app-automate/upload -F file=@/tmp/helper/cloud-transport-helper.apk -o /tmp/helper/upload.json
          node --input-type=module -e 'import fs from "node:fs";const app=JSON.parse(fs.readFileSync("/tmp/helper/upload.json")).app_url;if(!app)throw new Error("Helper upload failed");fs.appendFileSync(process.env.GITHUB_ENV,"HELPER_APP="+app+"\n");'
      - name: One Samsung Android 11 source comparison session
        run: node support/cloud_transport/mobile-control.mjs
      - name: Retain actual continuous session video
        if: always()
        run: node support/diagnostics/2007-video-evidence.mjs evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue-2007-source-session-${{ github.run_id }}
          path: |
            evidence/
            control-results.json
            mobile-control-results.json
            mobile-control-final-status.json
            localsend-source.xml
            helper-failure-source.xml
            helper-failure.png
            mobile-control-error.txt
