name: Diagnose issue 2007 physical original apps
on:
  workflow_dispatch:
  push:
    branches: [codex/bug-2007-diagnostics]
    paths: [.github/workflows/diagnose-2007-physical.yml]
jobs:
  original-app-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue2007-${{ github.run_id }}
      BASELINE_APP: bs://d5703b8a4cb6bc74c349f36d8f2ed3c3b9a28441
      BS_DEVICE: Vivo Y21
      BS_OS: '11.0'
      SCENARIO_MODULE: ${{ github.workspace }}/support/diagnostics/2007-physical-control.mjs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare original desktop release and supported runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox xdotool scrot tesseract-ocr network-manager gsettings-desktop-schemas at-spi2-core libayatana-appindicator3-1 libsecret-1-0 libgtk-3-0 libegl1 libgles2 libgl1-mesa-dri libopengl0 libglx-mesa0
          sudo systemctl start NetworkManager
          mkdir -p evidence released
          curl -fL https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.tar.gz -o released/linux.tar.gz
          echo '287690a9a8eb6da9c83cc97b3e3030ac67daf32a7331fcf307d0939300658d16  released/linux.tar.gz' | sha256sum -c -
          sha256sum released/linux.tar.gz > evidence/artifact-sha256.txt
          tar xf released/linux.tar.gz -C released
      - name: Verify transparent transport control
        run: node support/cloud_transport/control.mjs
      - name: Generate isolated relay capability
        run: |
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");'
      - name: Build separate transport helper
        run: bash support/cloud_transport/build-helper.sh
      - name: Connect BrowserStack Local
        run: |
          npm install --prefix /tmp/bs-local browserstack-local --no-audit --no-fund >/dev/null
          node support/cloud_transport/local.mjs > /tmp/bs-local.log 2>&1 &
          for attempt in $(seq 1 30); do test -f /tmp/helper/local-ready && break; sleep 2; done
          test -f /tmp/helper/local-ready
      - name: Upload isolated transport helper
        run: |
          curl --fail --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" https://api-cloud.browserstack.com/app-automate/upload -F file=@/tmp/helper/cloud-transport-helper.apk -o /tmp/helper/upload.json
          node --input-type=module -e 'import fs from "node:fs";const app=JSON.parse(fs.readFileSync("/tmp/helper/upload.json")).app_url;if(!app)throw new Error("Helper upload failed");fs.appendFileSync(process.env.GITHUB_ENV,"HELPER_APP="+app+"\n");'
      - name: Real desktop picker and Android receive control
        run: node support/cloud_transport/mobile-control.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue-2007-original-app-control-${{ github.run_id }}
          path: |
            evidence/
            control-results.json
            mobile-control-results.json
            mobile-control-final-status.json
            localsend-source.xml
            helper-failure-source.xml
            helper-failure.png
            mobile-control-error.txt
