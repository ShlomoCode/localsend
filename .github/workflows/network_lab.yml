name: CLI network lab

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/network_lab.yml'
      - 'support/network_lab/**'
      - 'cli/**'
      - 'packages/core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build CLI once
        run: cargo build -p localsend-cli --locked
      - name: Package CLI with executable permissions
        run: tar -czf localsend-cli.tar.gz -C target/debug localsend-cli
      - uses: actions/upload-artifact@v6
        with:
          name: network-lab-cli
          path: localsend-cli.tar.gz
          if-no-files-found: error

  topology:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario: [smoke, full]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: network-lab-cli
      - name: Install network tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables nftables tcpdump
      - name: Unpack CLI
        run: mkdir -p target/debug && tar -xzf localsend-cli.tar.gz -C target/debug
      - name: Run real network namespaces
        run: sudo python3 support/network_lab/run.py --binary target/debug/localsend-cli --scenario "${{ matrix.scenario }}" --artifacts artifacts/network-lab
      - name: Upload network diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: network-lab-${{ matrix.scenario }}
          path: artifacts/network-lab
          if-no-files-found: ignore
