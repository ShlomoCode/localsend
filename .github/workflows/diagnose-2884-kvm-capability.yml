name: Diagnose 2884 KVM capability
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-2884-kvm-capability]
    paths: [.github/workflows/diagnose-2884-kvm-capability.yml]
permissions:
  contents: read
concurrency:
  group: diagnose-2884
  cancel-in-progress: false
jobs:
  capability:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect host and advertised nested KVM capability
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence/2884-kvm
          {
            date -u --iso-8601=seconds
            uname -a
            cat /etc/os-release
            printf 'runner_os=%s runner_arch=%s runner_name=%s image_os=%s image_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'repository=%s head=%s run=%s attempt=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            id
            lscpu
            ls -l /dev/kvm
            for parameter in /sys/module/kvm_intel/parameters/nested /sys/module/kvm_intel/parameters/ept /sys/module/kvm_amd/parameters/nested; do
              printf '\n%s\n' "$parameter"
              if [ -r "$parameter" ]; then cat "$parameter"; else printf 'absent_or_unreadable\n'; fi
            done
          } > evidence/2884-kvm/host.txt 2>&1
          sha256sum support/diagnostics/2884-kvm-capability.c > evidence/2884-kvm/source-sha256.txt
          gcc --version > evidence/2884-kvm/compiler.txt 2>&1
          if ! probe_dir=$(mktemp -d /tmp/2884-kvm-capability.XXXXXXXX); then exit 1; fi
          trap 'rm -rf -- "$probe_dir"' EXIT
          if ! gcc -O2 -Wall -Wextra -Werror support/diagnostics/2884-kvm-capability.c -o "$probe_dir/probe" 2> evidence/2884-kvm/compile.txt; then exit 1; fi
          set +e
          timeout --signal=TERM --kill-after=2s 15s "$probe_dir/probe" > evidence/2884-kvm/kvm-unprivileged.txt 2>&1
          probe_status=$?
          printf '%s\n' "$probe_status" > evidence/2884-kvm/probe-unprivileged-exit.txt
          # Exit 4 means only open(/dev/kvm) returned EACCES. Keep that
          # observation and run the same owned probe using runner sudo.
          # No device permissions, group membership, or modules are changed.
          if [ "$probe_status" -eq 4 ]; then
            sudo -n -- /usr/bin/timeout --signal=TERM --kill-after=2s 15s "$probe_dir/probe" > evidence/2884-kvm/kvm-sudo.txt 2>&1
            probe_status=$?
            printf '%s\n' "$probe_status" > evidence/2884-kvm/probe-sudo-exit.txt
          fi
          printf '%s\n' "$probe_status" > evidence/2884-kvm/probe-exit.txt
          exit "$probe_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue2884-kvm-capability-${{ github.run_id }}
          path: evidence/2884-kvm
          if-no-files-found: error
