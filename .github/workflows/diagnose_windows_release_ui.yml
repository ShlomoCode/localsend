name: Diagnose released Windows UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released_windows_ui:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            asset_architecture: arm-64
            selection_mode: File
            fixture_method: UtcApi
            selection_method: ShellItem
          - runner: windows-11-arm
            asset_architecture: arm-64
            selection_mode: Folder
            fixture_method: UtcApi
            selection_method: ShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: UtcApi
            selection_method: ShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: UtcApi
            selection_method: ShellItem
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: UtcApi
            selection_method: ShellItem
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: UtcApi
            selection_method: ShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: ShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: ShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
            package_kind: Installer
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
            package_kind: Installer
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
            package_kind: Installer
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: MouseShellItem
            package_kind: Installer
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: SendInputShellItem
            package_kind: Installer
          - runner: windows-11-arm
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: SendInputShellItem
            package_kind: Installer
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            fixture_method: IssuePowerShell
            selection_method: SendInputShellItem
            package_kind: Installer
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: Folder
            fixture_method: IssuePowerShell
            selection_method: SendInputShellItem
            package_kind: Installer
    defaults:
      run:
        shell: powershell
    env:
      LS_RELEASE_UI_OUTPUT: ${{ github.workspace }}\release-ui-output
      LS_PACKAGE_KIND: ${{ matrix.package_kind || 'Zip' }}
    steps:
      - uses: actions/checkout@v6
      - name: Select ${{ matrix.selection_mode }} via ${{ matrix.selection_method }} in v1.18.2 ${{ matrix.asset_architecture }} ${{ matrix.package_kind || 'Zip' }} on ${{ matrix.runner }} (${{ matrix.fixture_method }})
        run: .\support\diagnostics\windows_release_ui_probe.ps1 -SelectionMode ${{ matrix.selection_mode }} -AssetArchitecture ${{ matrix.asset_architecture }} -PackageKind $env:LS_PACKAGE_KIND -RunnerLabel ${{ matrix.runner }} -SelectionMethod ${{ matrix.selection_method }} -FixtureMethod ${{ matrix.fixture_method }}
      - name: Print ${{ matrix.asset_architecture }} ${{ matrix.selection_mode }} evidence when artifact download is unavailable
        if: always()
        run: |
          Write-Output 'ASSET_ARCHITECTURE=${{ matrix.asset_architecture }} PACKAGE_KIND=${{ matrix.package_kind || 'Zip' }} SELECTION_MODE=${{ matrix.selection_mode }} SELECTION_METHOD=${{ matrix.selection_method }} FIXTURE_METHOD=${{ matrix.fixture_method }} RUNNER=${{ matrix.runner }}'
          $report = 'release-ui-output/release-ui-report.json'
          $image = 'release-ui-output/app-window-send.png'
          $afterFileImage = 'release-ui-output/app-window-after-file.png'
          $afterFolderImage = 'release-ui-output/app-window-after-folder.png'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Raw }
          if (Test-Path -LiteralPath $image) {
            Write-Output ('APP_WINDOW_SEND_PNG_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($image)))
          }
          if (Test-Path -LiteralPath $afterFileImage) {
            Write-Output ('APP_WINDOW_AFTER_FILE_PNG_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($afterFileImage)))
          }
          if (Test-Path -LiteralPath $afterFolderImage) {
            Write-Output ('APP_WINDOW_AFTER_FOLDER_PNG_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($afterFolderImage)))
          }
      - name: Preserve release process log and screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shell-item-${{ matrix.runner }}-v1.18.2-${{ matrix.asset_architecture }}-${{ matrix.package_kind || 'Zip' }}-${{ matrix.selection_mode }}-${{ matrix.fixture_method }}-${{ matrix.selection_method }}
          path: |
            release-ui-output/release-ui-report.json
            release-ui-output/desktop.png
            release-ui-output/app-window.png
            release-ui-output/app-window-send.png
            release-ui-output/app-window-after-file.png
            release-ui-output/app-window-after-folder.png
            release-ui-output/native-dialog-parent.png
            release-ui-output/desktop-preparation.json
            release-ui-output/installer.log
            release-ui-output/file-dialog-driver.*.txt
          if-no-files-found: error
