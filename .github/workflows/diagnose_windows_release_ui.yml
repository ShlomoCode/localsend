name: Reproduce issue 2906 on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released_windows_ui:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            release_version: 1.17.0
            entry_method: Picker
            fixture_method: UtcApi
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            release_version: 1.17.0
            entry_method: SendTo
            fixture_method: UtcApi
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            release_version: 1.18.2
            entry_method: Picker
            fixture_method: UtcApi
          - runner: windows-2025
            asset_architecture: x86-64
            selection_mode: File
            release_version: 1.18.2
            entry_method: SendTo
            fixture_method: UtcApi
    defaults:
      run:
        shell: powershell
    env:
      LS_RELEASE_UI_OUTPUT: ${{ github.workspace }}\release-ui-output
    steps:
      - uses: actions/checkout@v6
      - name: Exercise issue 2906 via ${{ matrix.entry_method }} on LocalSend ${{ matrix.release_version }}
        run: .\support\diagnostics\windows_release_ui_probe.ps1 -SelectionMode ${{ matrix.selection_mode }} -AssetArchitecture ${{ matrix.asset_architecture }} -RunnerLabel ${{ matrix.runner }} -ReleaseVersion ${{ matrix.release_version }} -EntryMethod ${{ matrix.entry_method }} -SelectionMethod ShellItem -FixtureMethod ${{ matrix.fixture_method }} -FixtureTimestampUtc '1927-10-15T12:34:56Z' -FixtureFileName 'fixture-1927-10-15.txt'
      - name: Print ${{ matrix.release_version }} ${{ matrix.entry_method }} evidence when artifact download is unavailable
        if: always()
        run: |
          Write-Output 'ISSUE=2906 RELEASE=${{ matrix.release_version }} ENTRY_METHOD=${{ matrix.entry_method }} ASSET_ARCHITECTURE=${{ matrix.asset_architecture }} SELECTION_MODE=${{ matrix.selection_mode }} SELECTION_METHOD=ShellItem FIXTURE_METHOD=${{ matrix.fixture_method }} FIXTURE_TIMESTAMP_UTC=1927-10-15T12:34:56Z RUNNER=${{ matrix.runner }}'
          $report = 'release-ui-output/release-ui-report.json'
          $image = 'release-ui-output/app-window-send.png'
          $afterFileImage = 'release-ui-output/app-window-after-file.png'
          $afterFolderImage = 'release-ui-output/app-window-after-folder.png'
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report -Raw }
          if (Test-Path -LiteralPath $image) {
            Write-Output ('APP_WINDOW_SEND_PNG_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($image)))
          }
          if (Test-Path -LiteralPath $afterFileImage) {
            Write-Output ('APP_WINDOW_AFTER_FILE_PNG_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($afterFileImage)))
          }
          if (Test-Path -LiteralPath $afterFolderImage) {
            Write-Output ('APP_WINDOW_AFTER_FOLDER_PNG_BASE64=' + [Convert]::ToBase64String([IO.File]::ReadAllBytes($afterFolderImage)))
          }
      - name: Preserve release process log and screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue-2906-${{ matrix.runner }}-v${{ matrix.release_version }}-${{ matrix.entry_method }}
          path: |
            release-ui-output/release-ui-report.json
            release-ui-output/desktop.png
            release-ui-output/app-window.png
            release-ui-output/app-window-send.png
            release-ui-output/app-window-after-file.png
            release-ui-output/app-window-after-folder.png
            release-ui-output/native-dialog-parent.png
          if-no-files-found: error
