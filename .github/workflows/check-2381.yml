name: Focused candidate checks for issue 2381
on:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fe313d66f4bc0787fc9968af032df694d8c0caa4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Check changed file formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib/pages/tabs/send_tab.dart
      - name: Analyze changed file
        working-directory: app
        run: flutter analyze lib/pages/tabs/send_tab.dart
      - name: Check existing favorite behavior
        working-directory: app
        run: flutter test test/unit/provider/favorites_provider_test.dart
