name: Diagnose PR3129 GNOME repaint
on:
  workflow_dispatch:
  push:
    branches: [diag/pr3129-gnome-runner]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - name: Setup GNOME and build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev gnome-shell gnome-terminal dbus-x11 xvfb xdotool wmctrl ffmpeg mesa-utils x11-utils ruby
      - uses: actions/cache@v4
        id: bundles
        with:
          path: |
            bundles
            build-evidence
          key: pr3129-bundles-v1-${{ hashFiles('diagnostics/pr3129/instrument.rb', 'diagnostics/pr3129/probe.dart', 'diagnostics/pr3129/fix.patch') }}
      - uses: subosito/flutter-action@v2
        if: steps.bundles.outputs.cache-hit != 'true'
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Build original and controlled variants
        if: steps.bundles.outputs.cache-hit != 'true'
        run: |
          mkdir -p evidence bundles
          git rev-parse HEAD > evidence/source.txt
          sha256sum app/pubspec.lock > evidence/lockfile-before.sha256
          cp app/pubspec.lock evidence/pubspec.lock
          cp .fvmrc evidence/source-fvmrc
          flutter --version > evidence/flutter.txt
          (cd app && flutter pub get)
          (cd app && flutter build linux --release)
          cp -a app/build/linux/x64/release/bundle bundles/original
          ruby diagnostics/pr3129/instrument.rb
          (cd app && flutter build linux --profile)
          cp -a app/build/linux/x64/profile/bundle bundles/base
          git restore app/lib
          git apply --check diagnostics/pr3129/fix.patch
          git apply diagnostics/pr3129/fix.patch
          ruby diagnostics/pr3129/instrument.rb
          (cd app && flutter build linux --profile)
          cp -a app/build/linux/x64/profile/bundle bundles/fix
          git diff > evidence/instrumentation-and-fix.patch
          sha256sum app/pubspec.lock > evidence/lockfile-after.sha256
          find bundles -type f -print0 | sort -z | xargs -0 sha256sum > evidence/bundle-sha256.txt
          cp "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/page_view.dart" evidence/flutter-page-view.dart
          cp "$FLUTTER_ROOT/packages/flutter/lib/src/widgets/scroll_delegate.dart" evidence/flutter-scroll-delegate.dart
          cp -a evidence build-evidence
      - name: Restore retained build evidence
        if: steps.bundles.outputs.cache-hit == 'true'
        run: cp -a build-evidence evidence
      - name: Save bundle cache before desktop exercise
        if: steps.bundles.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            bundles
            build-evidence
          key: pr3129-bundles-v1-${{ hashFiles('diagnostics/pr3129/instrument.rb', 'diagnostics/pr3129/probe.dart', 'diagnostics/pr3129/fix.patch') }}
      - uses: actions/upload-artifact@v4
        with:
          name: pr3129-build-bundles
          path: |
            bundles
            build-evidence
      - name: Exercise real GNOME desktop
        run: |
          git rev-parse HEAD > evidence/harness-source.txt
          dbus-run-session -- bash diagnostics/pr3129/desktop.sh
          ruby diagnostics/pr3129/analyze.rb evidence > evidence/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr3129-gnome-evidence
          path: |
            evidence
            diagnostics/pr3129
