name: Diagnose 2462 current Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build unmodified current app with diagnostic signing
        working-directory: app
        run: |
          mkdir -p ../evidence-build
          git rev-parse HEAD > ../evidence-build/source-commit.txt
          flutter --version > ../evidence-build/flutter-version.txt
          rustc --version > ../evidence-build/rust-version.txt
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          sha256sum build/app/outputs/flutter-apk/app-release.apk > ../evidence-build/apk-sha256.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue2462-current-android
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            evidence-build
