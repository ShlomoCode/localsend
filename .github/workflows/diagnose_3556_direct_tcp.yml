name: Issue 3556 direct native TCP gate
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: issue3556-owned-diagnostics
  cancel-in-progress: false
jobs:
  direct-tcp:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Fresh run identity and private authentication
        shell: pwsh
        run: |
          $token=[Guid]::NewGuid().ToString('N')+[Guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$token"
          "TCP_TOKEN=$token" >> $env:GITHUB_ENV
          "TCP_MARKER=$([Guid]::NewGuid().ToString('N'))" >> $env:GITHUB_ENV
          "BS_LOCAL_ID=direct3556-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_ENV
      - name: Select one owned active adapter private IPv4 address
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@(foreach ($adapter in Get-NetIPConfiguration) {
            if ($adapter.NetAdapter.Status -ne 'Up' -or -not $adapter.IPv4DefaultGateway) { continue }
            foreach ($address in $adapter.IPv4Address) {
              $parsed=$null
              if (-not [Net.IPAddress]::TryParse($address.IPAddress,[ref]$parsed)) { continue }
              if ($parsed.AddressFamily -ne [Net.Sockets.AddressFamily]::InterNetwork) { continue }
              $octets=$parsed.GetAddressBytes()
              $private=$octets[0] -eq 10 -or ($octets[0] -eq 172 -and $octets[1] -ge 16 -and $octets[1] -le 31) -or ($octets[0] -eq 192 -and $octets[1] -eq 168)
              if (-not $private -or [Net.IPAddress]::IsLoopback($parsed) -or ($octets[0] -eq 169 -and $octets[1] -eq 254)) { continue }
              [pscustomobject]@{interfaceIndex=$adapter.InterfaceIndex;interfaceAlias=$adapter.InterfaceAlias;address=$parsed.ToString();prefixLength=$address.PrefixLength;gateway=@($adapter.IPv4DefaultGateway.NextHop);status=$adapter.NetAdapter.Status}
            }
          })
          if ($candidates.Count -eq 0) { throw 'No active default-gateway adapter with private nonloopback IPv4; no device session will start.' }
          $selected=$candidates | Sort-Object interfaceIndex,address | Select-Object -First 1
          New-Item -ItemType Directory -Force evidence/direct-tcp | Out-Null
          $selection=@{utc=[DateTime]::UtcNow.ToString('o');method='First private IPv4 on active default-gateway adapter, ordered by interface index then address; local interface inventory only';selected=$selected;candidates=$candidates}
          [IO.File]::WriteAllText((Join-Path $pwd 'evidence/direct-tcp/adapter-selection.json'),($selection | ConvertTo-Json -Depth 6),[Text.UTF8Encoding]::new($false))
          "TCP_HOST=$($selected.address)" >> $env:GITHUB_ENV
      - name: Build separate native diagnostic APK
        shell: pwsh
        run: support/diagnose_3556/direct-tcp/build.ps1
      - name: Download BrowserStack Local
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip' -OutFile "$env:RUNNER_TEMP/local.zip"
          Expand-Archive "$env:RUNNER_TEMP/local.zip" "$env:RUNNER_TEMP/bs-local"
          "BS_LOCAL_BINARY=$env:RUNNER_TEMP/bs-local/BrowserStackLocal.exe" >> $env:GITHUB_ENV
      - name: Cloud syntax check and one owned native TCP session
        shell: pwsh
        run: |
          node --check support/diagnose_3556/direct-tcp/control.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node support/diagnose_3556/direct-tcp/control.mjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue3556-direct-tcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/direct-tcp/
          if-no-files-found: warn
      - name: Delete private capability build material
        if: always()
        shell: pwsh
        run: |
          if ($env:TCP_HELPER_APK) { Remove-Item (Split-Path $env:TCP_HELPER_APK) -Recurse -Force -ErrorAction SilentlyContinue }
