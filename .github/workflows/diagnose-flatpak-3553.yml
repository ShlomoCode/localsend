name: Diagnose Flatpak startup 3553

on:
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Install desktop diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb openbox x11-utils scrot gdb curl libayatana-appindicator3-1 libegl1 libgles2 libgl1

      - name: Install released Flatpak and download matching tar build
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.localsend.localsend_app
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Platform.GL.default//25.08
          curl -L --fail --retry 3 -o /tmp/localsend-1.18.2.tar.gz https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.tar.gz
          curl -L --fail --retry 3 -o /tmp/localsend-1.18.2.deb https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.deb
          mkdir -p /tmp/localsend-1.18.2
          tar -xzf /tmp/localsend-1.18.2.tar.gz -C /tmp/localsend-1.18.2
          sudo apt-get install -y /tmp/localsend-1.18.2.deb
          flatpak info org.localsend.localsend_app
          sha256sum /tmp/localsend-1.18.2.tar.gz /tmp/localsend-1.18.2.deb
          find /opt /usr -name localsend_app -type f -print

      - name: Record exact Flatpak commits and runner hardware
        run: |
          mkdir -p evidence
          uname -a > evidence/runner-hardware.txt
          lscpu >> evidence/runner-hardware.txt
          ls -l /dev/kvm /dev/dri >> evidence/runner-hardware.txt 2>&1 || true
          flatpak info --show-commit org.localsend.localsend_app > evidence/app-installed-commit.txt
          flatpak info --show-commit org.freedesktop.Platform//26.08 > evidence/runtime26-installed-commit.txt
          timeout 40 flatpak remote-info --log flathub org.localsend.localsend_app > evidence/app-remote-history.txt 2>&1 || true
          timeout 40 flatpak remote-info --log flathub org.freedesktop.Platform//26.08 > evidence/runtime26-remote-history.txt 2>&1 || true

      - name: Compare startup in one X11 session
        run: |
          mkdir -p evidence
          cat > /tmp/diagnose-startup.sh <<'EOF'
          set -u
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > evidence/xvfb.log 2>&1 &
          sleep 2
          openbox > evidence/openbox.log 2>&1 &
          sleep 2
          echo '=== desktop ===' | tee evidence/environment.txt
          lsb_release -a 2>&1 | tee -a evidence/environment.txt
          flatpak --version | tee -a evidence/environment.txt
          xdpyinfo | sed -n '1,12p' | tee -a evidence/environment.txt
          sha256sum /tmp/localsend-1.18.2/localsend_app "$(flatpak info -l org.localsend.localsend_app)/files/localsend_app" | tee evidence/binary-hashes.txt
          deb_binary=$(find /opt /usr -name localsend_app -type f -print -quit)
          for kind in deb tar flatpak; do
            mkdir -p "/tmp/localsend-home-$kind"
            if [ "$kind" = deb ]; then
              HOME="/tmp/localsend-home-$kind" "$deb_binary" > "evidence/$kind.log" 2>&1 &
            elif [ "$kind" = tar ]; then
              HOME="/tmp/localsend-home-$kind" /tmp/localsend-1.18.2/localsend_app > "evidence/$kind.log" 2>&1 &
            else
              HOME="/tmp/localsend-home-$kind" flatpak run org.localsend.localsend_app > "evidence/$kind.log" 2>&1 &
            fi
            launcher=$!
            sleep 15
            echo "=== $kind launcher $launcher ===" | tee "evidence/$kind-state.txt"
            ps -eo pid,ppid,stat,pcpu,comm,args | grep -E 'localsend|flatpak' | grep -v grep | tee -a "evidence/$kind-state.txt" || true
            xwininfo -root -tree | tee -a "evidence/$kind-state.txt"
            if xwininfo -root -tree | grep -q '"LocalSend"'; then
              echo 'UI_WINDOW=present' | tee -a "evidence/$kind-state.txt"
            else
              echo 'UI_WINDOW=absent' | tee -a "evidence/$kind-state.txt"
            fi
            ss -lntup | grep 53317 | tee -a "evidence/$kind-state.txt" || true
            scrot "evidence/$kind.png"
            app_pid=$(pgrep -n -x localsend_app || pgrep -n -x localsend || true)
            if [ -n "$app_pid" ]; then
              timeout 15 sudo gdb -q -batch -p "$app_pid" -ex 'thread apply all bt 8' > "evidence/$kind-backtrace.txt" 2>&1 || true
            fi
            kill "$launcher" 2>/dev/null || true
            pkill -f '/localsend_app( |$)' 2>/dev/null || true
            pkill -x localsend 2>/dev/null || true
            sleep 2
          done
          EOF
          dbus-run-session -- bash /tmp/diagnose-startup.sh

      - name: Compare startup on nested GNOME Wayland
        run: |
          sudo apt-get install -y gnome-shell mutter-dev-bin pipewire wireplumber
          mkdir -p evidence/gnome
          cat > /tmp/diagnose-gnome.sh <<'EOF'
          set -u
          export DISPLAY=:100
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo install -d -m 700 -o "$(id -u)" -g "$(id -g)" "$XDG_RUNTIME_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR/dconf"
          Xvfb :100 -screen 0 1280x800x24 > evidence/gnome/xvfb.log 2>&1 &
          sleep 2
          openbox > evidence/gnome/openbox.log 2>&1 &
          sleep 2
          pipewire > evidence/gnome/pipewire.log 2>&1 &
          wireplumber > evidence/gnome/wireplumber.log 2>&1 &
          sleep 2
          gnome-shell --devkit --wayland --wayland-display=wayland-1 > evidence/gnome/shell.log 2>&1 &
          shell_pid=$!
          for i in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-1" ]; then break; fi
            sleep 1
          done
          gnome-shell --version > evidence/gnome/environment.txt
          if [ ! -S "$XDG_RUNTIME_DIR/wayland-1" ]; then
            echo 'GNOME_WAYLAND=unavailable' | tee -a evidence/gnome/environment.txt
            exit 1
          fi
          sleep 3
          if ! kill -0 "$shell_pid" 2>/dev/null; then
            echo 'GNOME_WAYLAND=exited' | tee -a evidence/gnome/environment.txt
            exit 1
          fi
          echo 'GNOME_WAYLAND=ready' | tee -a evidence/gnome/environment.txt
          deb_binary=$(find /opt /usr -name localsend_app -type f -print -quit)
          for kind in deb flatpak flatpak-home flatpak25; do
            if [ "$kind" != flatpak-home ]; then
              mkdir -p "/tmp/localsend-gnome-home-$kind"
            fi
            if [ "$kind" = deb ]; then
              HOME="/tmp/localsend-gnome-home-$kind" WAYLAND_DISPLAY=wayland-1 GDK_BACKEND=wayland XDG_SESSION_TYPE=wayland "$deb_binary" > "evidence/gnome/$kind.log" 2>&1 &
            elif [ "$kind" = flatpak ]; then
              HOME="/tmp/localsend-gnome-home-$kind" WAYLAND_DISPLAY=wayland-1 GDK_BACKEND=wayland XDG_SESSION_TYPE=wayland flatpak run --nosocket=fallback-x11 --nosocket=x11 org.localsend.localsend_app > "evidence/gnome/$kind.log" 2>&1 &
            elif [ "$kind" = flatpak-home ]; then
              echo "host_home=$HOME" > evidence/gnome/flatpak-home-environment.txt
              echo "xdg_config_home=${XDG_CONFIG_HOME-unset}" >> evidence/gnome/flatpak-home-environment.txt
              echo "xdg_cache_home=${XDG_CACHE_HOME-unset}" >> evidence/gnome/flatpak-home-environment.txt
              echo "xdg_data_home=${XDG_DATA_HOME-unset}" >> evidence/gnome/flatpak-home-environment.txt
              flatpak info --show-runtime org.localsend.localsend_app >> evidence/gnome/flatpak-home-environment.txt
              WAYLAND_DISPLAY=wayland-1 GDK_BACKEND=wayland XDG_SESSION_TYPE=wayland flatpak run --nosocket=fallback-x11 --nosocket=x11 org.localsend.localsend_app > "evidence/gnome/$kind.log" 2>&1 &
            else
              HOME="/tmp/localsend-gnome-home-$kind" WAYLAND_DISPLAY=wayland-1 GDK_BACKEND=wayland XDG_SESSION_TYPE=wayland flatpak run --runtime-version=25.08 --nosocket=fallback-x11 --nosocket=x11 org.localsend.localsend_app > "evidence/gnome/$kind.log" 2>&1 &
            fi
            launcher=$!
            sleep 20
            echo "=== $kind launcher $launcher ===" | tee "evidence/gnome/$kind-state.txt"
            ps -eo pid,ppid,stat,pcpu,comm,args | grep -E 'localsend|flatpak' | grep -v grep | tee -a "evidence/gnome/$kind-state.txt" || true
            ss -lntup | grep 53317 | tee -a "evidence/gnome/$kind-state.txt" || true
            echo "log_bytes=$(wc -c < "evidence/gnome/$kind.log")" | tee -a "evidence/gnome/$kind-state.txt"
            scrot "evidence/gnome/$kind.png"
            app_pid=$(pgrep -n -x localsend_app || true)
            if [ -n "$app_pid" ] && ! ss -lntup | grep -q 53317; then
              timeout 12 sudo gdb -q -batch -p "$app_pid" -ex 'thread apply all bt 12' > "evidence/gnome/$kind-backtrace.txt" 2>&1 || true
            fi
            kill "$launcher" 2>/dev/null || true
            pkill -f '/localsend_app( |$)' 2>/dev/null || true
            pkill -x localsend 2>/dev/null || true
            sleep 2
          done
          EOF
          dbus-run-session -- bash /tmp/diagnose-gnome.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-3553-evidence
          path: evidence/
