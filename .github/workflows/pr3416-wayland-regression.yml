name: Issue 3416 GNOME Wayland regression

on:
  push:
    branches: [codex/pr3354-linux-screenshots]
    paths: [.github/workflows/pr3416-wayland-regression.yml]
  workflow_dispatch:
    inputs:
      builds_run:
        description: 'Reuse pr3416-bundles from a previous run; blank rebuilds historical sources'
        type: string
        default: ''
      build_only:
        description: 'Prepare historical bundles without starting the desktop'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: ${{ !github.event.inputs.builds_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Build historical and single-line controls
        run: |
          set -euo pipefail
          mkdir bundles
          git fetch https://github.com/localsend/localsend.git fd50a0130a73bea0d1ed93c869202997f194f8e4 d67b84ffdb96ad6c9a44155bad30ba9234800b5e
          git worktree add --detach source fd50a0130a73bea0d1ed93c869202997f194f8e4
          cd source/app
          flutter pub get
          for case in parent commit commit-minus-prgname parent-plus-prgname; do
            if [[ "$case" = parent* ]]; then
              git show fd50a0130a73bea0d1ed93c869202997f194f8e4:app/linux/my_application.cc > linux/my_application.cc
            else
              git show d67b84ffdb96ad6c9a44155bad30ba9234800b5e:app/linux/my_application.cc > linux/my_application.cc
            fi
            CASE="$case" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('linux/my_application.cc')
          text = path.read_text()
          case = os.environ['CASE']
          call = '  g_set_prgname(APPLICATION_ID);\n'
          if case == 'commit-minus-prgname':
              assert text.count(call) == 1
              text = text.replace(call, '')
          elif case == 'parent-plus-prgname':
              assert call not in text
              marker = 'MyApplication* my_application_new() {\n'
              assert text.count(marker) == 1
              text = text.replace(marker, marker + call)
          path.write_text(text)
          PY
            flutter build linux --release
            cp -a build/linux/x64/release/bundle "../../bundles/$case"
            cp linux/my_application.cc "../../bundles/$case-source.cc"
          done
          cp pubspec.lock ../../bundles/resolved-pubspec.lock
          git diff fd50a0130a73bea0d1ed93c869202997f194f8e4 d67b84ffdb96ad6c9a44155bad30ba9234800b5e -- linux/my_application.cc > ../../bundles/commit.patch
          printf 'Parent: fd50a0130a73bea0d1ed93c869202997f194f8e4\nCommit: d67b84ffdb96ad6c9a44155bad30ba9234800b5e\nFlutter: 3.24.5\nBuild OS: Ubuntu 22.04\nAll variants use the parent Dart sources, dependencies and packaging; only the native runner changes.\n' > ../../bundles/sources.txt
      - uses: actions/upload-artifact@v6
        with:
          name: pr3416-bundles
          path: bundles/

  desktop:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Install full GNOME Wayland desktop
        run: |
          set -euo pipefail
          sudo systemctl mask gdm3.service
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ubuntu-desktop-minimal gnome-shell-extension-appindicator python3-dbus python3-pil libayatana-appindicator3-1
          sudo useradd --create-home --shell /bin/bash traytest
          sudo sed -i '/^XDG_RUNTIME_DIR=/d; /^DBUS_SESSION_BUS_ADDRESS=/d; /^XDG_CONFIG_HOME=/d; /^XDG_CACHE_HOME=/d; /^XDG_DATA_HOME=/d; /^XDG_STATE_HOME=/d' /etc/environment
          sudo loginctl enable-linger traytest
          sudo mkdir -p /opt/pr3416/support/tests /opt/pr3416/evidence /opt/pr3416/releases
          sudo cp -a support/tests/pr3416-* /opt/pr3416/support/tests/
          sudo chown -R "$(id -u):$(id -g)" /opt/pr3416
          sudo chmod 777 /opt/pr3416/evidence
          cp /etc/os-release /opt/pr3416/evidence/desktop-os.txt
          sudo systemd-run --unit=pr3416-gnome --uid=traytest --property=PAMName=login --property=WorkingDirectory=/home/traytest \
            --setenv=XDG_SESSION_TYPE=wayland --setenv=XDG_SESSION_DESKTOP=ubuntu \
            --setenv=XDG_CURRENT_DESKTOP=ubuntu:GNOME --setenv=GNOME_SHELL_SESSION_MODE=ubuntu \
            --setenv=LIBGL_ALWAYS_SOFTWARE=1 --setenv=LANG=C.UTF-8 \
            /bin/bash /opt/pr3416/support/tests/pr3416-start-gnome.sh
          bash support/tests/pr3416-desktop-user.sh ready
      - name: Reproduce with official installed deb releases
        run: |
          set -euo pipefail
          for version in 1.17.0 1.18.0; do
            gh release download "v$version" --repo localsend/localsend --pattern "LocalSend-$version-linux-x86-64.deb" --dir /opt/pr3416/releases
            package="/opt/pr3416/releases/LocalSend-$version-linux-x86-64.deb"
            sha256sum "$package" > "/opt/pr3416/evidence/release-$version-sha256.txt"
            sudo apt-get install -y "$package"
            cp /usr/share/applications/localsend_app.desktop "/opt/pr3416/evidence/release-$version.desktop"
            dpkg-query -L localsend > "/opt/pr3416/evidence/release-$version-files.txt"
            executable=$(python3 -c 'import os, pathlib, sys; paths=[pathlib.Path(p) for p in pathlib.Path(sys.argv[1]).read_text().splitlines()]; matches=[p for p in paths if p.name == "localsend_app" and p.is_file() and os.access(p, os.X_OK)]; assert len(matches) == 1, matches; print(matches[0])' "/opt/pr3416/evidence/release-$version-files.txt")
            expected=generic
            if [[ "$version" = 1.17.0 ]]; then expected=matched; fi
            bash support/tests/pr3416-desktop-user.sh "release-$version" "$expected" "$executable"
          done
      - name: Wait for controlled historical builds
        env:
          BUILDS_RUN: ${{ github.event.inputs.builds_run || github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILDS_RUN/artifacts" --jq '[.artifacts[] | select(.name == "pr3416-bundles")] | length')
            if [[ "$count" = 1 ]]; then exit 0; fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILDS_RUN/jobs" --jq '.jobs[] | select(.name == "build") | .conclusion')
            if [[ "$state" = failure || "$state" = cancelled ]]; then exit 1; fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v6
        with:
          name: pr3416-bundles
          path: downloaded-bundles
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.builds_run || github.run_id }}
      - name: Isolate the exact commit and the program-name call
        run: |
          set -euo pipefail
          cp downloaded-bundles/{sources.txt,commit.patch,*-source.cc,resolved-pubspec.lock} /opt/pr3416/evidence/
          for case in parent commit commit-minus-prgname parent-plus-prgname; do
            sudo rm -rf /opt/pr3416/app
            sudo cp -a "downloaded-bundles/$case" /opt/pr3416/app
            sudo chown -R traytest:traytest /opt/pr3416/app
            sudo chmod +x /opt/pr3416/app/localsend_app
            expected=generic
            if [[ "$case" = parent || "$case" = commit-minus-prgname ]]; then expected=matched; fi
            bash support/tests/pr3416-desktop-user.sh "$case" "$expected" /opt/pr3416/app/localsend_app
          done
          sudo rm -rf /opt/pr3416/app
          sudo cp -a downloaded-bundles/commit /opt/pr3416/app
          sudo chown -R traytest:traytest /opt/pr3416/app
          sudo chmod +x /opt/pr3416/app/localsend_app
          sudo sed -i '/^StartupWMClass=/d' /usr/share/applications/localsend_app.desktop
          echo 'StartupWMClass=org.localsend.localsend_app' | sudo tee -a /usr/share/applications/localsend_app.desktop
          sudo update-desktop-database /usr/share/applications
          cp /usr/share/applications/localsend_app.desktop /opt/pr3416/evidence/desktop-fix.desktop
          # Shell retains GDesktopAppInfo instances for installed apps. Start
          # a fresh session, as a user would after changing the desktop entry.
          sudo systemctl stop pr3416-gnome.service
          sudo loginctl terminate-user traytest
          sudo systemctl stop "user@$(id -u traytest).service"
          sudo systemctl start pr3416-gnome.service
          bash support/tests/pr3416-desktop-user.sh ready
          bash support/tests/pr3416-desktop-user.sh desktop-fix matched /opt/pr3416/app/localsend_app
      - name: Preserve desktop diagnostics
        if: always()
        run: |
          sudo journalctl -b -u pr3416-gnome --no-pager > /opt/pr3416/evidence/gnome-session.log || true
          sudo journalctl -b _UID="$(id -u traytest)" --no-pager > /opt/pr3416/evidence/desktop-user-journal.log || true
          ps -eo user,pid,ppid,args > /opt/pr3416/evidence/processes.txt
          sudo cp -a /opt/pr3416/evidence desktop-evidence
          sudo chown -R "$(id -u):$(id -g)" desktop-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr3416-wayland-evidence
          path: desktop-evidence/
          if-no-files-found: error
