name: Issue 3441 admitted native keyboard observation
on:
  push:
    branches:
      - codex/diagnose-3441-transfer
permissions:
  contents: read
concurrency:
  group: issue3441-owned-diagnostics
  cancel-in-progress: false
jobs:
  keyboard-source:
    if: >-
      github.repository == 'ShlomoCode/localsend' &&
      vars.ISSUE3441_ADMITTED_HEAD == github.sha &&
      contains(github.event.head_commit.message, '[issue3441-admitted]')
    runs-on: macos-15
    timeout-minutes: 20
    env:
      ISSUE3441_ADMITTED: '1'
      ISSUE3441_KEYBOARD_SOURCE_PROBE: '1'
      ISSUE3441_KEYBOARD_DISMISS_PROBE: '1'
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      TRANSFER_EVIDENCE_DIRECTORY: evidence/issue3441/android
    steps:
      - name: Record deadline before preparation
        run: |
          printf 'ISSUE3441_JOB_DEADLINE_UTC=%s\n' "$(date -u -v+20M '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          printf 'BS_LOCAL_ID=issue3441-%s-attempt-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'FIXTURE_DIRECTORY=%s/evidence/issue3441/fixtures\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64
      - name: Provision original APK and fixture tools without transport or receiver
        timeout-minutes: 4
        run: |
          mkdir -p evidence/issue3441/android
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
          bash support/diagnostics/3441/provision-transfer.sh
      - name: Generate and build existing native picker fixtures
        timeout-minutes: 3
        run: |
          node support/diagnostics/3441/fixtures.mjs
          bash support/diagnostics/3441-android/build-helpers.sh
      - name: Select actual control through original picker and observe native favorite keyboard
        timeout-minutes: 16
        run: node support/diagnostics/3441/keyboard-source.mjs
      - name: Recover only the owned session
        if: always()
        timeout-minutes: 1
        run: node support/diagnostics/3441-android/cleanup.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        timeout-minutes: 3
        with:
          name: issue3441-keyboard-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/issue3441/
          compression-level: 0
          if-no-files-found: warn
