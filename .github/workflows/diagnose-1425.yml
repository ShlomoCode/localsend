name: Diagnose Linux transfer cancellation 1425
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Real original AppImage sender and receiver
        run: sudo bash support/diagnostics/1425-run.sh
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1425-original-${{ github.run_id }}
          path: evidence/
          retention-days: 30
