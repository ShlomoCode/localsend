name: Repack issue 2830 evidence
on:
  workflow_dispatch:
    inputs:
      source_run:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ShlomoCode/localsend
          run-id: ${{ inputs.source_run }}
          name: issue2830-physical-control
          path: input
      - uses: actions/upload-artifact@v4
        with:
          name: issue2830-raw-evidence-${{ inputs.source_run }}
          path: |
            input/evidence/*.json
            input/evidence/*.jsonl
            input/evidence/*.png
            input/evidence/*.xml
            input/evidence/*.txt
            input/mobile-control-results.json
            input/mobile-control-final-status.json
            input/mobile-control-error.txt
            input/relay-trace.json
          retention-days: 14
