name: Diagnose issue 2096 Downloads filenames
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact independently reviewed diagnostic source commit
        required: true
        type: string
      admission_utc:
        description: Fresh coordinator admission UTC
        required: true
        type: string
      reservation_id:
        description: Coordinator one-session reservation identity
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: windows-2022
    timeout-minutes: 45
    concurrency:
      group: issue2096-owned-diagnostic
      cancel-in-progress: false
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      ADMISSION_UTC: ${{ inputs.admission_utc }}
      RESERVATION_ID: ${{ inputs.reservation_id }}
      BS_LOCAL_ID: issue2096-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Bind finite job deadline before preparation
        shell: pwsh
        run: |
          if($env:GITHUB_SHA -ne $env:EXPECTED_HEAD){throw 'Dispatch head differs from frozen review'}
          $deadline=[DateTime]::UtcNow.AddMinutes(44).ToString('o')
          [IO.File]::AppendAllText($env:GITHUB_ENV,"JOB_DEADLINE_UTC=$deadline"+[Environment]::NewLine)
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Source checks and one bounded actual-app experiment
        shell: pwsh
        run: ./support/diagnose_2096/run-cloud.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue2096-evidence
          path: |
            evidence/
            !evidence/**/release/**
            !evidence/**/*.zip
            !evidence/**/*.apk
          retention-days: 14
