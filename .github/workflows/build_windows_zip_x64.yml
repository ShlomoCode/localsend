name: Diagnose 1461 direct Windows WSL peer TCP
on:
  workflow_dispatch:
    inputs:
      receiver_lifetime_only:
        description: Observe original receiver lifetime only; no Windows sender or fixtures
        type: boolean
        default: true
        required: true
jobs:
  original-apps:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: windows-2025
    timeout-minutes: 45
    concurrency:
      group: issue1461-owned-diagnostic
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Preserve supported WSL NAT configuration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence/issue1461 | Out-Null
          @('[wsl2]', 'networkingMode=nat', 'localhostForwarding=false', 'guiApplications=false') | Set-Content "$env:USERPROFILE/.wslconfig" -Encoding ascii
          Copy-Item "$env:USERPROFILE/.wslconfig" evidence/issue1461/wslconfig.txt
          netsh interface ipv4 show excludedportrange protocol=tcp | Out-File evidence/issue1461/windows-excluded-tcp-ports.txt
      - name: Install supported pinned Ubuntu 24.04 WSL2
        timeout-minutes: 8
        uses: Vampire/setup-wsl@887f39deb6c0976365e546926fe66f41b77d65ff
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          use-cache: true
      - name: Source syntax and desktop observation dependencies
        shell: pwsh
        run: |
          foreach($name in @('windows_sender.ps1','direct_wsl.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "support/diagnose_1461/$name"),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
          choco install ffmpeg --yes --no-progress --limit-output
          if($LASTEXITCODE){throw 'Desktop observation dependency provisioning failed'}
          $env:PATH += ';C:\ProgramData\chocolatey\bin'
          $ffmpeg=(Get-Command ffmpeg -ErrorAction Stop).Source
          "FFMPEG_PATH=$ffmpeg" | Out-File -Append $env:GITHUB_ENV
          $linuxRoot=(& wsl -d Ubuntu-24.04 -u root -- wslpath -a $PWD.Path.Replace('\','/')).Trim()
          $autocrlf=& git config --show-origin --get core.autocrlf
          @{exitCode=$LASTEXITCODE;output=@($autocrlf);scope='Actual checkout Git configuration; absent value remains unknown'} | ConvertTo-Json | Set-Content evidence/issue1461/checkout-core-autocrlf.json
          foreach($name in @('wsl_prepare.sh','wsl_receiver.sh','wsl_control.sh','wsl_lifetime_snapshot.sh')){
            $path=Join-Path $PWD "support/diagnose_1461/$name"
            $bytes=[IO.File]::ReadAllBytes($path)
            @{name=$name;sha256=(Get-FileHash $path -Algorithm SHA256).Hash;bytes=$bytes.Length;carriageReturnBytes=@($bytes|Where-Object {$_ -eq 13}).Count} | ConvertTo-Json | Set-Content "evidence/issue1461/$name.checkout.json"
            if($bytes -contains 13){throw 'Guest shell script checkout must retain LF bytes; no app experiment admitted'}
            & wsl -d Ubuntu-24.04 -u root -- bash -n "$linuxRoot/support/diagnose_1461/$name"
            if($LASTEXITCODE){throw 'Guest source syntax failed'}
          }
      - name: Bounded receiver discriminator or original peer sequence
        shell: pwsh
        env:
          RECEIVER_LIFETIME_ONLY: ${{ inputs.receiver_lifetime_only }}
        run: |
          if($env:RECEIVER_LIFETIME_ONLY -ceq 'true'){
            ./support/diagnose_1461/direct_wsl.ps1 -ReceiverLifetimeOnly
          }elseif($env:RECEIVER_LIFETIME_ONLY -ceq 'false'){
            ./support/diagnose_1461/direct_wsl.ps1
          }else{throw 'Explicit receiver-only routing input required'}
      - name: Preserve environment and verify real recordings
        if: always()
        shell: pwsh
        run: |
          wsl --list --verbose 2>&1 | Out-File evidence/issue1461/wsl-inventory.txt
          wsl --status 2>&1 | Out-File evidence/issue1461/wsl-status.txt
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture | ConvertTo-Json | Out-File evidence/issue1461/windows-environment.json
          foreach($path in @(Get-ChildItem evidence/issue1461 -Recurse -File | Where-Object {$_.Extension -in @('.mkv','.mp4')})){
            & ffprobe -v error -select_streams v:0 -show_entries 'stream=codec_name,width,height,nb_frames,duration:format=duration' -of json $path.FullName | Set-Content ($path.FullName+'.probe.json')
            if($LASTEXITCODE){throw 'Cloud recording metadata failed'}
            & ffprobe -v error -select_streams v:0 -show_entries frame=best_effort_timestamp_time -of csv $path.FullName | Set-Content ($path.FullName+'.timestamps.csv')
            if($LASTEXITCODE){throw 'Cloud recording timestamps failed'}
            & ffmpeg -v error -i $path.FullName -f null - 2> ($path.FullName+'.decode.stderr.txt')
            if($LASTEXITCODE){throw 'Cloud recording decode failed'}
            @{status='decoded';bytes=$path.Length;sha256=(Get-FileHash $path.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content ($path.FullName+'.verified.json')
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue1461-source-handle-evidence
          path: |
            evidence/
            !evidence/**/release/**
            !evidence/**/*.zip
            !evidence/**/*.deb
            !evidence/**/*.bin
          retention-days: 30
