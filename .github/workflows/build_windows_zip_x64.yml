name: Diagnose 1461 Windows source handle
on:
  workflow_dispatch:
jobs:
  original-apps:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: windows-2022
    timeout-minutes: 40
    concurrency:
      group: issue1461-owned-diagnostic
      cancel-in-progress: false
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue1461-${{ github.run_id }}-${{ github.run_attempt }}
      INTERRUPTION_MODE: provider-airplane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check diagnostic source and build separate transport helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          node --check support/diagnose_1461/control.mjs
          if($LASTEXITCODE){throw 'Controller syntax failed'}
          node --check support/cloud_transport/relay.mjs
          if($LASTEXITCODE){throw 'Relay syntax failed'}
          foreach($name in @('windows_sender.ps1','build-helper.ps1','step.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "support/diagnose_1461/$name"),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw ($errors|Out-String)}
          }
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");fs.writeFileSync(process.env.RUNNER_TEMP+"/relay-token",token);'
          $env:RELAY_TOKEN=Get-Content (Join-Path $env:RUNNER_TEMP 'relay-token') -Raw
          Remove-Item (Join-Path $env:RUNNER_TEMP 'relay-token')
          ./support/diagnose_1461/build-helper.ps1
      - name: Original release apps and normal Android Wi-Fi interruption
        shell: pwsh
        run: |
          if(-not(Get-Command ffmpeg -ErrorAction SilentlyContinue)){
            choco install ffmpeg --yes --no-progress --limit-output
            if($LASTEXITCODE){throw 'Windows desktop recorder provisioning failed'}
          }
          $recorder=Get-Command ffmpeg -ErrorAction Stop
          $recorderPath=$recorder.Source
          $env:FFMPEG_PATH=$recorderPath
          New-Item -ItemType Directory -Force C:/tmp/bs-local-bin | Out-Null
          Invoke-WebRequest https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip -OutFile (Join-Path $env:RUNNER_TEMP 'bs-local.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'bs-local.zip') C:/tmp/bs-local-bin -Force
          ./support/diagnose_1461/step.ps1
      - name: Verify real cloud recordings decode and retain capture timestamps
        if: always()
        shell: pwsh
        run: |
          foreach($name in @('windows/windows-continuous.mkv','android-session.mp4')){
            $path=Join-Path 'evidence/issue1461' $name
            if(Test-Path -LiteralPath $path){
              & ffprobe -v error -select_streams v:0 -show_entries 'stream=codec_name,width,height,nb_frames,duration:format=duration' -of json $path | Set-Content ($path+'.probe.json')
              if($LASTEXITCODE){throw 'Cloud recording metadata verification failed'}
              & ffprobe -v error -select_streams v:0 -show_entries frame=best_effort_timestamp_time -of csv $path | Set-Content ($path+'.timestamps.csv')
              if($LASTEXITCODE){throw 'Cloud capture timestamp extraction failed'}
              & ffmpeg -v error -i $path -f null - 2> ($path+'.decode.stderr.txt')
              if($LASTEXITCODE){throw 'Cloud recording decode failed'}
              @{status='decoded';bytes=(Get-Item $path).Length;sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant();verifiedUtc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content ($path+'.verified.json')
            }
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue1461-source-handle-evidence
          path: |
            evidence/
            !evidence/**/release/**
            !evidence/**/*.zip
            !evidence/**/*.apk
