name: Diagnose 2277 animations Back
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download official reported release
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/localsend/localsend/releases/download/v1.16.1/LocalSend-1.16.1-windows-x86-64.zip -OutFile $env:RUNNER_TEMP/app.zip
          Expand-Archive $env:RUNNER_TEMP/app.zip $env:RUNNER_TEMP/release
      - name: Install OCR
        run: choco install tesseract --no-progress -y
      - name: Exercise actual application
        shell: powershell
        run: |
          $exe = (Get-ChildItem $env:RUNNER_TEMP/release -Recurse -Filter localsend_app.exe | Select-Object -First 1).FullName
          & ./support/diagnostics/windows2277.ps1 -Executable $exe -EvidenceDirectory $env:RUNNER_TEMP/evidence2277
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence2277
          path: |
            ${{ runner.temp }}/evidence2277
            !${{ runner.temp }}/evidence2277/*-app/**
