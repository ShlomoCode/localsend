name: Diagnose AppImage 2690 Gentoo
on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: Existing run to compact without application workloads
        type: string
        default: ''
      use_c1ce:
        description: Package the existing source-built c1ce Linux artifact
        type: boolean
        default: false
      old_libc_run:
        description: Existing packed artifacts to retry only the Focal gate
        type: string
        default: ''
      wayland_run:
        description: Existing packed artifacts for a clean-home native Weston gate
        type: string
        default: ''
jobs:
  gentoo:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        if: inputs.evidence_run == '' && inputs.old_libc_run == '' && inputs.wayland_run == '' && inputs.use_c1ce
        with:
          name: issue2754-c1ce-flutter3419-linux-x64
          path: evidence/main-source
          github-token: ${{ github.token }}
          run-id: 38132747719
      - name: Inspect official artifact and prepare Gentoo
        if: inputs.evidence_run == '' && inputs.old_libc_run == '' && inputs.wayland_run == ''
        env:
          USE_C1CE: ${{ inputs.use_c1ce }}
        run: bash support/diagnostics/2690/inspect.sh
      - uses: actions/download-artifact@v6
        if: inputs.evidence_run != '' || inputs.old_libc_run != '' || inputs.wayland_run != ''
        with:
          name: issue2690-evidence-${{ inputs.evidence_run || inputs.old_libc_run || inputs.wayland_run }}
          path: evidence/cloud
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run || inputs.old_libc_run || inputs.wayland_run }}
      - name: Retry Focal with existing artifacts
        if: inputs.old_libc_run != ''
        run: |
          printf '%s\n' '${{ inputs.old_libc_run }}' > evidence/cloud/old-libc-input-run.txt
          sha256sum -c evidence/cloud/repacked-new-client.sha256
          sha256sum -c evidence/cloud/repacked-candidate.sha256
          chmod a+x evidence/cloud/repacked-new-client.AppImage evidence/cloud/repacked-candidate.AppImage
          mv evidence/cloud/launch/results.tsv evidence/cloud/launch/prior-results.tsv
          curl -fL --retry 3 https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.AppImage -o evidence/cloud/current.AppImage
          echo '19f21613d1834f6caa69517113670461a3f10b80a2a315f86548c0663d9c0aaf  evidence/cloud/current.AppImage' | sha256sum -c -
          chmod a+x evidence/cloud/current.AppImage
          docker pull ubuntu:20.04
          docker image inspect ubuntu:20.04 > evidence/cloud/old-libc-image.json
          docker run --privileged --name issue2690-old-libc -v "$PWD/evidence/cloud:/evidence" -v "$PWD/support/diagnostics/2690:/diagnostic:ro" ubuntu:20.04 bash /diagnostic/old-libc.sh > evidence/cloud/old-libc.log 2>&1
      - name: Clean-home Weston with existing artifacts
        if: inputs.wayland_run != ''
        run: |
          printf '%s\n' '${{ inputs.wayland_run }}' > evidence/cloud/wayland-input-run.txt
          sha256sum -c evidence/cloud/repacked-new-client.sha256
          sha256sum -c evidence/cloud/repacked-candidate.sha256
          sha256sum -c evidence/cloud/repacked-baseline.sha256
          chmod a+x evidence/cloud/repacked-new-client.AppImage evidence/cloud/repacked-candidate.AppImage evidence/cloud/repacked-baseline.AppImage
          mv evidence/cloud/launch/wayland-results.tsv evidence/cloud/launch/prior-wayland-results.tsv
          curl -fL --retry 3 https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-linux-x86-64.AppImage -o evidence/cloud/current.AppImage
          echo '19f21613d1834f6caa69517113670461a3f10b80a2a315f86548c0663d9c0aaf  evidence/cloud/current.AppImage' | sha256sum -c -
          chmod a+x evidence/cloud/current.AppImage
          docker pull gentoo/stage3:latest
          docker image inspect gentoo/stage3:latest > evidence/cloud/gentoo-image.json
          docker run --privileged --name issue2690-wayland -v "$PWD/evidence/cloud:/evidence" -v "$PWD/support/diagnostics/2690:/diagnostic:ro" gentoo/stage3:latest bash /diagnostic/prepare-wayland.sh
      - name: Compact existing evidence
        if: inputs.evidence_run != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg squashfs-tools binutils
          if [[ -f evidence/cloud/repacked-new-client.AppImage ]]; then
            chmod u+x evidence/cloud/repacked-new-client.AppImage
            offset=$(evidence/cloud/repacked-new-client.AppImage --appimage-offset)
            unsquashfs -o "$offset" -d /tmp/issue2690-packed evidence/cloud/repacked-new-client.AppImage > evidence/cloud/packed-extract.log
            (cd /tmp/issue2690-packed && find . -type f -print0 | sort -z | xargs -0 sha256sum) > evidence/cloud/inventory-packed-new-client.txt
            for library in libwayland-client.so.0 libffi.so.8; do
              target="/tmp/issue2690-packed/usr/lib/x86_64-linux-gnu/$library"
              {
                readlink -f "$target"
                sha256sum "$target"
                readelf -d "$target"
                readelf -V "$target"
                readelf --dyn-syms --wide "$target"
              } > "evidence/cloud/packed-$library.txt"
            done
          fi
          shopt -s nullglob
          for screenshot in evidence/cloud/launch/*.xwd; do
            ffmpeg -loglevel error -y -f xwd_pipe -i "$screenshot" -frames:v 1 "${screenshot%.xwd}.png"
            rm "$screenshot"
          done
          rm -f evidence/cloud/repacked-*.AppImage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue2690-evidence-${{ github.run_id }}
          path: |
            evidence/cloud/*.txt
            evidence/cloud/*.log
            evidence/cloud/*.sha256
            evidence/cloud/*.json
            evidence/cloud/repacked-*.AppImage
            evidence/cloud/launch/**
