name: Issue 1035 native Linux focus observation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-1035
  cancel-in-progress: false
jobs:
  focus:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
      - name: Observe unchanged AppImages under normal XFCE
        timeout-minutes: 16
        run: |
          mkdir -p evidence
          timeout --signal=TERM --kill-after=55s 870s bash support/diagnostics/1035/runner.sh
      - name: Retain every outcome
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: issue1035-native-${{ github.run_id }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
