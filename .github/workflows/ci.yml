name: Diagnostic 3296 NVDA release episode
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnose-3296
  cancel-in-progress: false
jobs:
  episode:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      EVIDENCE: C:\e3296
    steps:
      - name: Establish absolute clock
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:EVIDENCE | Out-Null
          "EPISODE_STARTED=$([DateTime]::UtcNow.ToString('o'))" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
      - name: Bounded standalone supervisor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem support/diagnostics/3296 -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content "$env:EVIDENCE/source-hashes.json"
          git rev-parse HEAD | Set-Content "$env:EVIDENCE/source-head.txt"
          & support/diagnostics/3296/supervise.ps1 -Evidence $env:EVIDENCE -StartedUtc ([DateTime]::Parse($env:EPISODE_STARTED))
          exit $LASTEXITCODE
      - name: Guarded cleanup and original media qualification
        if: always()
        shell: powershell
        run: '& support/diagnostics/3296/retain.ps1 -Evidence $env:EVIDENCE'
      - name: Retain original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-3296-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:\e3296
          retention-days: 14
          if-no-files-found: error
