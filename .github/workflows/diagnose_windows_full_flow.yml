name: Issue 2426 real peer alias observation
on:
  workflow_dispatch:
    inputs:
      artifact:
        type: choice
        options: [current, historical]
        default: current
permissions:
  contents: read
  actions: read
jobs:
  real-peer:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue2426-${{ github.run_id }}
      SHARE_AFTER_CONTROL: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build separate paired diagnostic helpers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          node --check support/diagnose_3556/windows-transfer-control.mjs
          if($LASTEXITCODE -ne 0){throw 'Controller syntax failed'}
          node --check support/diagnose_3556/share-scenario.mjs
          if($LASTEXITCODE -ne 0){throw 'Share callback syntax failed'}
          node --check support/cloud_transport/relay.mjs
          if($LASTEXITCODE -ne 0){throw 'Relay syntax failed'}
          foreach($script in @('windows-helper-build.ps1','windows-transfer-step.ps1','windows_receiver.ps1')){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "support/diagnose_3556/$script"),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ($errors | Out-String)}
          }
          $nativeOcr=Get-Content support/diagnose_2426/native-ocr.ps1 -Raw
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($nativeOcr,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw ($errors | Out-String)}
          choco install ffmpeg --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'ffmpeg install failed'}
          $ffmpeg=(Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe=Join-Path (Split-Path $ffmpeg) 'ffprobe.exe'
          if(-not (Test-Path $ffmpeg) -or -not (Test-Path $ffprobe)){throw 'ffmpeg binaries unavailable'}
          $seed=Join-Path $env:RUNNER_TEMP 'issue3556-seed.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=10 -t 1 -c:v libx264 -pix_fmt yuv420p -movflags +faststart $seed
          if($LASTEXITCODE -ne 0){throw 'MP4 seed generation failed'}
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");fs.writeFileSync(process.env.RUNNER_TEMP+"/relay-token",token);'
          $env:RELAY_TOKEN=Get-Content (Join-Path $env:RUNNER_TEMP 'relay-token') -Raw
          Remove-Item (Join-Path $env:RUNNER_TEMP 'relay-token')
          ./support/diagnose_3556/windows-helper-build.ps1 -VideoSeedPath $seed -FfmpegPath $ffmpeg -FfprobePath $ffprobe
      - name: Download unchanged current Android artifact
        if: inputs.artifact == 'current'
        shell: pwsh
        run: |
          gh api repos/ShlomoCode/localsend/actions/artifacts/11691000051/zip > current-apk.zip
          if($LASTEXITCODE -ne 0){throw 'Current artifact download failed'}
          Expand-Archive current-apk.zip current-apk
          $apk=(Get-ChildItem current-apk -Recurse -Filter app-release.apk | Select-Object -First 1).FullName
          if((Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant() -ne '69df1d0fa252328f8b80a2197d850c78483df1fd711a4de18fbb021f23a637ea'){throw 'Current APK identity mismatch'}
          "ALIAS_BASELINE_APK=$apk" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Real Android and Windows alias observation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/tmp/bs-local-bin | Out-Null
          Invoke-WebRequest https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip -OutFile (Join-Path $env:RUNNER_TEMP 'bs-local.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'bs-local.zip') C:/tmp/bs-local-bin -Force
          Get-FileHash C:/tmp/bs-local-bin/BrowserStackLocal.exe | ConvertTo-Json | Set-Content evidence/local-binary-hash.json
          ./support/diagnose_3556/windows-transfer-step.ps1 -BaselineApkPath $env:ALIAS_BASELINE_APK
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue2426-alias-evidence
          path: |
            evidence/
            !evidence/**/release/**
            !evidence/**/*.zip
