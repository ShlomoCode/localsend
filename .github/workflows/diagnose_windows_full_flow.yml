name: Issue 3556 fixture and storage diagnosis
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        default: selection
        options: [selection, windows-transfer-control]
jobs:
  storage-control:
    if: inputs.scenario == 'selection'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      HOLD_SECONDS: '0'
      SELECTION_MATRIX: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build separate public API fixture helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          bash support/diagnose_3556/build-helper.sh
      - name: Upload helper and unmodified released application
        run: |
          curl --fail --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" https://api-cloud.browserstack.com/app-automate/upload -F file=@/tmp/fixture3556/helper.apk -o /tmp/fixture3556/helper-upload.json
          curl --fail --silent --show-error -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" https://api-cloud.browserstack.com/app-automate/upload -F url=https://github.com/localsend/localsend/releases/download/v1.18.2/LocalSend-1.18.2-android-arm64v8.apk -o /tmp/fixture3556/baseline-upload.json
          node --input-type=module -e 'import fs from "node:fs";for(const [key,file] of [["HELPER_APP","helper"],["BASELINE_APP","baseline"]]){const app=JSON.parse(fs.readFileSync("/tmp/fixture3556/"+file+"-upload.json")).app_url;if(!app)throw Error("Upload missing URL");fs.appendFileSync(process.env.GITHUB_ENV,key+"="+app+"\n");}'
      - name: Physical S20 capacity and small fixture control
        run: node support/diagnose_3556/storage-control.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue3556-storage-evidence
          path: evidence/
  windows-transfer-control:
    if: inputs.scenario == 'windows-transfer-control'
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      BS_LOCAL_ID: issue3556-${{ github.run_id }}
      SHARE_AFTER_CONTROL: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build separate paired diagnostic helpers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          node --check support/diagnose_3556/windows-transfer-control.mjs
          if($LASTEXITCODE -ne 0){throw 'Controller syntax failed'}
          node --check support/diagnose_3556/share-scenario.mjs
          if($LASTEXITCODE -ne 0){throw 'Share callback syntax failed'}
          foreach($script in @('windows-helper-build.ps1','windows-transfer-step.ps1','windows_receiver.ps1')){
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "support/diagnose_3556/$script"),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ($errors | Out-String)}
          }
          $receiverSource=Get-Content support/diagnose_3556/windows_receiver.ps1 -Raw
          $nativeOcr=[regex]::Match($receiverSource,"(?s)param\(\[string\]\`$Image,\[string\]\`$Result\).*?(?=\r?\n'@)").Value
          if(-not $nativeOcr){throw 'Native OCR source not found'}
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($nativeOcr,[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){throw ($errors | Out-String)}
          choco install ffmpeg --yes --no-progress
          if($LASTEXITCODE -ne 0){throw 'ffmpeg install failed'}
          $ffmpeg=(Get-ChildItem C:/ProgramData/chocolatey/lib/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe=Join-Path (Split-Path $ffmpeg) 'ffprobe.exe'
          if(-not (Test-Path $ffmpeg) -or -not (Test-Path $ffprobe)){throw 'ffmpeg binaries unavailable'}
          $seed=Join-Path $env:RUNNER_TEMP 'issue3556-seed.mp4'
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=10 -t 1 -c:v libx264 -pix_fmt yuv420p -movflags +faststart $seed
          if($LASTEXITCODE -ne 0){throw 'MP4 seed generation failed'}
          node --input-type=module -e 'import fs from "node:fs";import {randomBytes} from "node:crypto";const token=randomBytes(24).toString("hex");console.log("::add-mask::"+token);fs.appendFileSync(process.env.GITHUB_ENV,"RELAY_TOKEN="+token+"\n");fs.writeFileSync(process.env.RUNNER_TEMP+"/relay-token",token);'
          $env:RELAY_TOKEN=Get-Content (Join-Path $env:RUNNER_TEMP 'relay-token') -Raw
          Remove-Item (Join-Path $env:RUNNER_TEMP 'relay-token')
          ./support/diagnose_3556/windows-helper-build.ps1 -VideoSeedPath $seed -FfmpegPath $ffmpeg -FfprobePath $ffprobe
      - name: Small real Android sender and Windows receiver control
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/tmp/bs-local-bin | Out-Null
          Invoke-WebRequest https://local-downloads.browserstack.com/BrowserStackLocal-win32.zip -OutFile (Join-Path $env:RUNNER_TEMP 'bs-local.zip')
          Expand-Archive (Join-Path $env:RUNNER_TEMP 'bs-local.zip') C:/tmp/bs-local-bin -Force
          Get-FileHash C:/tmp/bs-local-bin/BrowserStackLocal.exe | ConvertTo-Json | Set-Content evidence/local-binary-hash.json
          ./support/diagnose_3556/windows-transfer-step.ps1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: issue3556-windows-transfer-evidence
          path: |
            evidence/
            !evidence/**/release/**
            !evidence/**/*.zip
