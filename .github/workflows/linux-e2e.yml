name: Diagnose Linux tray hover 3484
on:
  workflow_dispatch:
jobs:
  arch-tray:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Arch Hyprland VM and real Quickshell hover
        run: |
          bash support/diagnostics/3484/vm.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tray3484-${{ github.run_id }}
          path: evidence/cloud
