name: Linux E2E

on:
  push:
    branches: [codex/pr3354-linux-screenshots]
    paths: [.github/workflows/linux-e2e.yml]
  workflow_dispatch:
    inputs:
      scenario:
        description: Test scenario
        type: choice
        options: [all, snap, dock, tray-smoke]
        default: all
      snap_builds_run:
        description: Reuse Snap builds from a run ID
        type: string
        default: ''
      dock_builds_run:
        description: Reuse dock builds from a run ID
        type: string
        default: ''
      build_only:
        description: Build test apps only
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  tray-smoke:
    name: Tray smoke test
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scenario == 'all' || inputs.scenario == 'tray-smoke') && !inputs.build_only }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install build and tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev \
            xvfb dbus-x11 xfce4-panel xfce4-statusnotifier-plugin xfconf openbox \
            imagemagick python3-dbus python3-pil
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Build exact PR baseline and fix
        run: |
          set -euo pipefail
          mkdir -p evidence bundles
          git fetch https://github.com/localsend/localsend.git 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b refs/pull/3354/head
          git diff 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b cc50a2e8395fe9d7de60547475b44a3268ad2d0c -- app/lib/util/native/tray_helper.dart > evidence/fix.patch
          git worktree add --detach source 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b
          printf 'Base: %s\nFix: %s\nFlutter: 3.41.9\nUbuntu: 22.04, XFCE StatusNotifier, X11/Xvfb\nSNAP environment simulation; not an installed Snap or GNOME session.\n' \
            6f6cd3ee496903e2206c51ffa3a13a5d10bc340b cc50a2e8395fe9d7de60547475b44a3268ad2d0c > evidence/environment.txt
          cd source/app
          flutter pub get
          flutter build linux --release
          cp -a build/linux/x64/release/bundle ../../bundles/before
          git apply ../../evidence/fix.patch
          flutter build linux --release
          cp -a build/linux/x64/release/bundle ../../bundles/after
      - name: Capture control, before and after
        run: |
          set -euo pipefail
          for case in control before after; do
            bundle=before
            if [ "$case" = after ]; then bundle=after; fi
            xvfb-run -a -s '-screen 0 1024x768x24' dbus-run-session -- \
              bash support/tests/pr3354-tray-session.sh "$case" "$PWD/bundles/$bundle" "$PWD/evidence"
          done
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          result = Image.new('RGB', (384, 320), '#202020')
          draw = ImageDraw.Draw(result)
          for y, name, label in [(0, 'before', 'BEFORE: baseline with SNAP'), (160, 'after', 'AFTER: PR 3354 with SNAP')]:
              draw.text((12, y + 8), label, fill='white')
              tray = Image.open('evidence/' + name + '-tray.png').convert('RGB')
              result.paste(tray.crop((0, 0, 128, 40)).resize((384, 120), Image.NEAREST), (0, y + 30))
          result.save('evidence/before-after.png')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr3354-tray-evidence
          path: evidence/
          if-no-files-found: error

  snap-build:
    name: Build Snap test apps
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scenario == 'all' || inputs.scenario == 'snap') && !inputs.snap_builds_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Prepare pinned sources before restoring build caches
        run: |
          set -euo pipefail
          mkdir bundles
          git fetch https://github.com/localsend/localsend.git 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b cc50a2e8395fe9d7de60547475b44a3268ad2d0c
          git diff 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b cc50a2e8395fe9d7de60547475b44a3268ad2d0c -- app/lib/util/native/tray_helper.dart > bundles/fix.patch
          git worktree add --detach source 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            source/target
            source/app/build/linux
          key: pr3354-pinned-builds-v1
      - name: Build pinned before and after
        run: |
          set -euo pipefail
          cd source/app
          flutter pub get
          flutter build linux --release
          cp -a build/linux/x64/release/bundle ../../bundles/before
          git apply ../../bundles/fix.patch
          flutter build linux --release
          cp -a build/linux/x64/release/bundle ../../bundles/after
          printf 'Base: 6f6cd3ee496903e2206c51ffa3a13a5d10bc340b\nFix: cc50a2e8395fe9d7de60547475b44a3268ad2d0c\nFlutter: 3.41.9\nBuild OS: Ubuntu 22.04\n' > ../../bundles/sources.txt
      - uses: actions/upload-artifact@v6
        with:
          name: pr3354-bundles
          path: bundles/

  snap-desktop:
    name: Snap desktop tests
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scenario == 'all' || inputs.scenario == 'snap') && !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Install full Ubuntu GNOME desktop and Snap runtime
        run: |
          sudo systemctl mask gdm3.service
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ubuntu-desktop-minimal \
            gnome-shell-extension-appindicator \
            xserver-xorg-video-dummy xdotool imagemagick wmctrl python3-dbus python3-pil \
            squashfs-tools snapd libayatana-appindicator3-1
          sudo systemctl enable --now snapd.socket
          sudo timeout 180 snap wait system seed.loaded
          sudo useradd --create-home --shell /bin/bash traytest
          # The hosted image pins its runner's runtime path globally. Let PAM
          # and systemd create the dedicated desktop user's own runtime instead.
          sudo sed -i '/^XDG_RUNTIME_DIR=/d; /^DBUS_SESSION_BUS_ADDRESS=/d; /^XDG_CONFIG_HOME=/d; /^XDG_CACHE_HOME=/d; /^XDG_DATA_HOME=/d; /^XDG_STATE_HOME=/d' /etc/environment
          sudo loginctl enable-linger traytest
          sudo mkdir -p /opt/pr3354/support/tests /opt/pr3354/evidence /opt/pr3354/snaps
          sudo cp -a support/tests/pr3354-* /opt/pr3354/support/tests/
          sudo chown -R "$(id -u):$(id -g)" /opt/pr3354
          sudo chmod 777 /opt/pr3354/evidence
          cp /etc/os-release /opt/pr3354/evidence/desktop-os.txt
          dpkg-query -W gnome-shell gnome-session ubuntu-desktop-minimal gnome-shell-extension-appindicator snapd \
            > /opt/pr3354/evidence/desktop-packages.txt
          sudo Xorg :99 -config /opt/pr3354/support/tests/pr3354-xorg.conf \
            -noreset -nolisten tcp -ac -novtswitch -sharevts -logfile /opt/pr3354/evidence/Xorg.log \
            > /opt/pr3354/evidence/Xorg-stdout.log 2>&1 &
          sleep 5
          sudo systemd-run --unit=pr3354-gnome --uid=traytest --property=PAMName=login \
            --property=WorkingDirectory=/home/traytest \
            --setenv=DISPLAY=:99 --setenv=XDG_SESSION_TYPE=x11 --setenv=XDG_SESSION_DESKTOP=ubuntu \
            --setenv=XDG_CURRENT_DESKTOP=ubuntu:GNOME --setenv=GNOME_SHELL_SESSION_MODE=ubuntu \
            --setenv=LIBGL_ALWAYS_SOFTWARE=1 --setenv=LANG=C.UTF-8 \
            /bin/bash /opt/pr3354/support/tests/pr3354-start-gnome.sh
          bash support/tests/pr3354-desktop-user.sh ready
      - name: Install and reproduce the reported store revision
        run: |
          set -euo pipefail
          cd /opt/pr3354/snaps
          snap download localsend --revision=35
          sha256sum *.snap > ../evidence/store-snap-sha256.txt
          sudo snap ack localsend_35.assert
          sudo snap install localsend_35.snap
          bash "$GITHUB_WORKSPACE/support/tests/pr3354-connect-snap.sh"
          snap info localsend > ../evidence/store-snap-info.txt
          snap connections localsend > ../evidence/store-connections.txt
          bash "$GITHUB_WORKSPACE/support/tests/pr3354-desktop-user.sh" store fallback
      - name: Wait for the controlled builds
        env:
          BUILDS_RUN: ${{ inputs.snap_builds_run || github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILDS_RUN/artifacts" --jq '[.artifacts[] | select(.name == "pr3354-bundles")] | length')
            if [ "$count" = 1 ]; then exit 0; fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILDS_RUN/jobs" --jq '.jobs[] | select(.name == "Build Snap test apps") | .conclusion')
            if [ "$state" = failure ] || [ "$state" = cancelled ]; then exit 1; fi
            sleep 10
          done
          echo 'Pinned builds artifact did not become available' >&2
          exit 1
      - uses: actions/download-artifact@v6
        with:
          name: pr3354-bundles
          path: downloaded-bundles
          github-token: ${{ github.token }}
          run-id: ${{ inputs.snap_builds_run || github.run_id }}
      - name: Package, install and exercise actual strict Snaps
        run: |
          set -euo pipefail
          sudo cp -a downloaded-bundles /opt/pr3354/bundles
          sudo chown -R traytest:traytest /opt/pr3354/bundles
          sudo chmod +x /opt/pr3354/bundles/{before,after}/localsend_app
          cp /opt/pr3354/bundles/{sources.txt,fix.patch} /opt/pr3354/evidence/
          bash support/tests/pr3354-desktop-user.sh control logo
          for case in before after; do
            bash support/tests/pr3354-snap-package.sh /opt/pr3354/snaps/localsend_35.snap \
              "/opt/pr3354/bundles/$case" "/opt/pr3354/snaps/$case.snap"
            sudo snap remove --purge localsend
            sudo snap install --dangerous "/opt/pr3354/snaps/$case.snap"
            sha256sum "/opt/pr3354/snaps/$case.snap" > "/opt/pr3354/evidence/$case-snap-sha256.txt"
            bash support/tests/pr3354-connect-snap.sh
            snap info localsend > "/opt/pr3354/evidence/$case-snap-info.txt"
            snap connections localsend > "/opt/pr3354/evidence/$case-connections.txt"
            cp /snap/localsend/current/meta/snap.yaml "/opt/pr3354/evidence/$case-snap.yaml"
            bash support/tests/pr3354-desktop-user.sh "$case" "$([ "$case" = before ] && echo fallback || echo logo)"
            bash support/tests/pr3354-desktop-user.sh "$case-restart" "$([ "$case" = before ] && echo fallback || echo logo)"
          done
          bash support/tests/pr3354-desktop-user.sh compose
      - name: Preserve desktop and confinement diagnostics
        if: always()
        run: |
          sudo journalctl -b -u pr3354-gnome --no-pager > /opt/pr3354/evidence/gnome-session.log || true
          sudo journalctl -b _UID="$(id -u traytest)" --no-pager > /opt/pr3354/evidence/desktop-user-journal.log || true
          sudo journalctl -b -k --no-pager > /opt/pr3354/evidence/kernel-apparmor.log || true
          loginctl list-sessions > /opt/pr3354/evidence/login-sessions.txt
          ps -eo user,pid,ppid,args > /opt/pr3354/evidence/processes.txt
          snap debug confinement > /opt/pr3354/evidence/snap-confinement.txt
          sudo cp -a /opt/pr3354/evidence desktop-evidence
          sudo chown -R "$(id -u):$(id -g)" desktop-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr3354-real-snap-gnome-evidence
          path: desktop-evidence/
          if-no-files-found: error

  dock-build:
    name: Build dock test apps
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scenario == 'all' || inputs.scenario == 'dock'))) && !inputs.dock_builds_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Build historical and single-line controls
        run: |
          set -euo pipefail
          mkdir bundles
          git fetch https://github.com/localsend/localsend.git fd50a0130a73bea0d1ed93c869202997f194f8e4 d67b84ffdb96ad6c9a44155bad30ba9234800b5e
          git worktree add --detach source fd50a0130a73bea0d1ed93c869202997f194f8e4
          cd source/app
          flutter pub get
          for case in parent commit commit-minus-prgname parent-plus-prgname; do
            if [[ "$case" = parent* ]]; then
              git show fd50a0130a73bea0d1ed93c869202997f194f8e4:app/linux/my_application.cc > linux/my_application.cc
            else
              git show d67b84ffdb96ad6c9a44155bad30ba9234800b5e:app/linux/my_application.cc > linux/my_application.cc
            fi
            CASE="$case" python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('linux/my_application.cc')
          text = path.read_text()
          case = os.environ['CASE']
          call = '  g_set_prgname(APPLICATION_ID);\n'
          if case == 'commit-minus-prgname':
              assert text.count(call) == 1
              text = text.replace(call, '')
          elif case == 'parent-plus-prgname':
              assert call not in text
              marker = 'MyApplication* my_application_new() {\n'
              assert text.count(marker) == 1
              text = text.replace(marker, marker + call)
          path.write_text(text)
          PY
            flutter build linux --release
            cp -a build/linux/x64/release/bundle "../../bundles/$case"
            cp linux/my_application.cc "../../bundles/$case-source.cc"
          done
          cp pubspec.lock ../../bundles/resolved-pubspec.lock
          git diff fd50a0130a73bea0d1ed93c869202997f194f8e4 d67b84ffdb96ad6c9a44155bad30ba9234800b5e -- linux/my_application.cc > ../../bundles/commit.patch
          printf 'Parent: fd50a0130a73bea0d1ed93c869202997f194f8e4\nCommit: d67b84ffdb96ad6c9a44155bad30ba9234800b5e\nFlutter: 3.24.5\nBuild OS: Ubuntu 22.04\nAll variants use the parent Dart sources, dependencies and packaging; only the native runner changes.\n' > ../../bundles/sources.txt
      - uses: actions/upload-artifact@v6
        with:
          name: pr3416-bundles
          path: bundles/

  dock-desktop:
    name: Wayland dock tests
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scenario == 'all' || inputs.scenario == 'dock') && !inputs.build_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Install full GNOME Wayland desktop
        run: |
          set -euo pipefail
          sudo systemctl mask gdm3.service
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ubuntu-desktop-minimal gnome-shell-extension-appindicator python3-dbus python3-pil libayatana-appindicator3-1
          sudo useradd --create-home --shell /bin/bash traytest
          sudo sed -i '/^XDG_RUNTIME_DIR=/d; /^DBUS_SESSION_BUS_ADDRESS=/d; /^XDG_CONFIG_HOME=/d; /^XDG_CACHE_HOME=/d; /^XDG_DATA_HOME=/d; /^XDG_STATE_HOME=/d' /etc/environment
          sudo loginctl enable-linger traytest
          sudo mkdir -p /opt/pr3416/support/tests /opt/pr3416/evidence /opt/pr3416/releases
          sudo cp -a support/tests/pr3416-* /opt/pr3416/support/tests/
          sudo chown -R "$(id -u):$(id -g)" /opt/pr3416
          sudo chmod 777 /opt/pr3416/evidence
          cp /etc/os-release /opt/pr3416/evidence/desktop-os.txt
          sudo systemd-run --unit=pr3416-gnome --uid=traytest --property=PAMName=login --property=WorkingDirectory=/home/traytest \
            --setenv=XDG_SESSION_TYPE=wayland --setenv=XDG_SESSION_DESKTOP=ubuntu \
            --setenv=XDG_CURRENT_DESKTOP=ubuntu:GNOME --setenv=GNOME_SHELL_SESSION_MODE=ubuntu \
            --setenv=LIBGL_ALWAYS_SOFTWARE=1 --setenv=LANG=C.UTF-8 \
            /bin/bash /opt/pr3416/support/tests/pr3416-start-gnome.sh
          bash support/tests/pr3416-desktop-user.sh ready
      - name: Reproduce with official installed deb releases
        run: |
          set -euo pipefail
          for version in 1.17.0 1.18.0; do
            gh release download "v$version" --repo localsend/localsend --pattern "LocalSend-$version-linux-x86-64.deb" --dir /opt/pr3416/releases
            package="/opt/pr3416/releases/LocalSend-$version-linux-x86-64.deb"
            sha256sum "$package" > "/opt/pr3416/evidence/release-$version-sha256.txt"
            sudo apt-get install -y "$package"
            cp /usr/share/applications/localsend_app.desktop "/opt/pr3416/evidence/release-$version.desktop"
            dpkg-query -L localsend > "/opt/pr3416/evidence/release-$version-files.txt"
            executable=$(python3 -c 'import os, pathlib, sys; paths=[pathlib.Path(p) for p in pathlib.Path(sys.argv[1]).read_text().splitlines()]; matches=[p for p in paths if p.name == "localsend_app" and p.is_file() and os.access(p, os.X_OK)]; assert len(matches) == 1, matches; print(matches[0])' "/opt/pr3416/evidence/release-$version-files.txt")
            expected=generic
            if [[ "$version" = 1.17.0 ]]; then expected=matched; fi
            bash support/tests/pr3416-desktop-user.sh "release-$version" "$expected" "$executable"
          done
      - name: Wait for controlled historical builds
        env:
          BUILDS_RUN: ${{ inputs.dock_builds_run || github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILDS_RUN/artifacts" --jq '[.artifacts[] | select(.name == "pr3416-bundles")] | length')
            if [[ "$count" = 1 ]]; then exit 0; fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILDS_RUN/jobs" --jq '.jobs[] | select(.name == "Build dock test apps") | .conclusion')
            if [[ "$state" = failure || "$state" = cancelled ]]; then exit 1; fi
            sleep 10
          done
          exit 1
      - uses: actions/download-artifact@v6
        with:
          name: pr3416-bundles
          path: downloaded-bundles
          github-token: ${{ github.token }}
          run-id: ${{ inputs.dock_builds_run || github.run_id }}
      - name: Isolate the exact commit and the program-name call
        run: |
          set -euo pipefail
          cp downloaded-bundles/{sources.txt,commit.patch,*-source.cc,resolved-pubspec.lock} /opt/pr3416/evidence/
          for case in parent commit commit-minus-prgname parent-plus-prgname; do
            sudo rm -rf /opt/pr3416/app
            sudo cp -a "downloaded-bundles/$case" /opt/pr3416/app
            sudo chown -R traytest:traytest /opt/pr3416/app
            sudo chmod +x /opt/pr3416/app/localsend_app
            expected=generic
            if [[ "$case" = parent || "$case" = commit-minus-prgname ]]; then expected=matched; fi
            bash support/tests/pr3416-desktop-user.sh "$case" "$expected" /opt/pr3416/app/localsend_app
          done
          sudo rm -rf /opt/pr3416/app
          sudo cp -a downloaded-bundles/commit /opt/pr3416/app
          sudo chown -R traytest:traytest /opt/pr3416/app
          sudo chmod +x /opt/pr3416/app/localsend_app
          sudo sed -i '/^StartupWMClass=/d' /usr/share/applications/localsend_app.desktop
          printf '\nStartupWMClass=org.localsend.localsend_app\n' | sudo tee -a /usr/share/applications/localsend_app.desktop
          desktop-file-validate /usr/share/applications/localsend_app.desktop
          sudo /usr/bin/python3 -c 'from gi.repository import Gio; info=Gio.DesktopAppInfo.new_from_filename("/usr/share/applications/localsend_app.desktop"); assert info.get_startup_wm_class() == "org.localsend.localsend_app"; assert info.get_boolean("StartupNotify")'
          sudo update-desktop-database /usr/share/applications
          cp /usr/share/applications/localsend_app.desktop /opt/pr3416/evidence/desktop-fix.desktop
          # Verify the updated desktop entry after logout and login.
          sudo systemctl stop pr3416-gnome.service
          sudo loginctl terminate-user traytest
          sudo systemctl stop "user@$(id -u traytest).service"
          sudo systemd-run --unit=pr3416-gnome --uid=traytest --property=PAMName=login --property=WorkingDirectory=/home/traytest \
            --setenv=XDG_SESSION_TYPE=wayland --setenv=XDG_SESSION_DESKTOP=ubuntu \
            --setenv=XDG_CURRENT_DESKTOP=ubuntu:GNOME --setenv=GNOME_SHELL_SESSION_MODE=ubuntu \
            --setenv=LIBGL_ALWAYS_SOFTWARE=1 --setenv=LANG=C.UTF-8 \
            /bin/bash /opt/pr3416/support/tests/pr3416-start-gnome.sh
          bash support/tests/pr3416-desktop-user.sh ready
          bash support/tests/pr3416-desktop-user.sh desktop-fix matched /opt/pr3416/app/localsend_app
      - name: Preserve desktop diagnostics
        if: always()
        run: |
          sudo journalctl -b -u pr3416-gnome --no-pager > /opt/pr3416/evidence/gnome-session.log || true
          sudo journalctl -b _UID="$(id -u traytest)" --no-pager > /opt/pr3416/evidence/desktop-user-journal.log || true
          ps -eo user,pid,ppid,args > /opt/pr3416/evidence/processes.txt
          sudo cp -a /opt/pr3416/evidence desktop-evidence
          sudo chown -R "$(id -u):$(id -g)" desktop-evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr3416-wayland-evidence
          path: desktop-evidence/
          if-no-files-found: error
