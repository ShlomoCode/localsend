name: Diagnose Linux tray hover 3484
on:
  workflow_dispatch:
    inputs:
      archive_date:
        description: Coherent Arch repository snapshot (latest or report date)
        type: choice
        default: latest
        options: [latest, '2026-09-29']
jobs:
  arch-tray:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Arch Hyprland VM and real Quickshell hover
        env:
          ARCH_DATE: ${{ inputs.archive_date || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash support/diagnostics/3484/vm.sh
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tray3484-${{ github.run_id }}
          path: evidence/cloud
