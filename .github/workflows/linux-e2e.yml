name: Diagnose AppImage GNOME dash 2433
on:
  workflow_dispatch:
    inputs:
      source_comparison:
        type: boolean
        default: false
      package_run_id:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  fedora-gnome:
    if: inputs.package_run_id == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        if: inputs.source_comparison
      - name: Build exact production base once
        if: inputs.source_comparison
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2 desktop-file-utils
          dart pub global activate fvm 3.2.1
          export PATH="$HOME/.pub-cache/bin:$PATH"
          fvm install
          fvm flutter --version
          rustup show
          git worktree add --detach source c1ce322fb3acf08e44f329b8b7208b8b0d91e244
          cd source/app
          fvm flutter pub get
          fvm flutter build linux --release
          cd ../..
          mkdir -p evidence/cloud packages-2433
          git rev-parse HEAD > evidence/cloud/diagnostic-source.txt
          git -C source rev-parse HEAD > evidence/cloud/application-source.txt
          fvm flutter --version > evidence/cloud/flutter-version.txt
          sha256sum source/app/build/linux/x64/release/bundle/localsend_app > evidence/cloud/built-executable.sha256
          git show c1ce322fb3acf08e44f329b8b7208b8b0d91e244:support/build/appimage/AppImageBuilder_x86_64.yml > baseline-recipe.yml
          cp support/build/appimage/AppImageBuilder_x86_64.yml candidate-recipe.yml
          cp baseline-recipe.yml evidence/cloud/
          cp candidate-recipe.yml evidence/cloud/
          bash support/tests/issue2433-host.sh prepare-appdir
      - name: Package unmodified baseline recipe
        if: inputs.source_comparison
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./baseline-recipe.yml
      - name: Preserve baseline and reset packaging input
        if: inputs.source_comparison
        run: |
          set -euo pipefail
          sudo mv LocalSend-*.AppImage packages-2433/baseline.AppImage
          sudo rm -rf AppDir appimage-build
          bash support/tests/issue2433-host.sh prepare-appdir
      - name: Package minimal candidate recipe
        if: inputs.source_comparison
        uses: AppImageCrafters/build-appimage@57c3bc6963f870ce3be103117de5b5e33ffbaeb6
        with:
          recipe: ./candidate-recipe.yml
      - name: Preserve candidate package
        if: inputs.source_comparison
        run: |
          sudo mv LocalSend-*.AppImage packages-2433/candidate.AppImage
          sudo chown -R "$(id -u):$(id -g)" packages-2433
          sha256sum packages-2433/*.AppImage > evidence/cloud/packages.sha256
      - name: Boot official Fedora 42 cloud VM
        run: bash support/tests/issue2433-host.sh boot
      - name: Prepare real GNOME Wayland and supported integration
        env:
          SOURCE_COMPARISON: ${{ inputs.source_comparison }}
        run: bash support/tests/issue2433-host.sh provision
      - name: Observe actual Shell launches and dash icons
        env:
          SOURCE_COMPARISON: ${{ inputs.source_comparison }}
        run: bash support/tests/issue2433-host.sh observe
      - name: Preserve diagnostics
        if: always()
        run: bash support/tests/issue2433-host.sh collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fedora-gnome-2433-evidence
          path: evidence/cloud/
      - uses: actions/upload-artifact@v4
        if: always() && inputs.source_comparison
        with:
          name: source-appimages-2433
          path: packages-2433/
  verify-packages:
    if: inputs.package_run_id != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the two actual packaged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libfuse2
          gh run download "$PACKAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n source-appimages-2433 -D packages
          gh run download "$PACKAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n fedora-gnome-2433-evidence -D source-evidence
          mkdir baseline candidate evidence
          chmod +x packages/*.AppImage
          (cd baseline && ../packages/baseline.AppImage --appimage-extract > ../evidence/baseline-extract.log)
          (cd candidate && ../packages/candidate.AppImage --appimage-extract > ../evidence/candidate-extract.log)
          sha256sum baseline/squashfs-root/localsend_app candidate/squashfs-root/localsend_app | tee evidence/packaged-executables.sha256
          cmp baseline/squashfs-root/localsend_app candidate/squashfs-root/localsend_app
          (cd baseline/squashfs-root && find . -type f \( -name '*.so' -o -name '*.so.*' \) -print0 | sort -z | xargs -0 sha256sum) > evidence/baseline-libraries.sha256
          (cd candidate/squashfs-root && find . -type f \( -name '*.so' -o -name '*.so.*' \) -print0 | sort -z | xargs -0 sha256sum) > evidence/candidate-libraries.sha256
          diff -u evidence/baseline-libraries.sha256 evidence/candidate-libraries.sha256 > evidence/system-libraries.diff || test "$?" = 1
          (cd baseline/squashfs-root && find lib -maxdepth 1 -type f -name '*.so' -print0 | sort -z | xargs -0 sha256sum) > evidence/baseline-app-libraries.sha256
          (cd candidate/squashfs-root && find lib -maxdepth 1 -type f -name '*.so' -print0 | sort -z | xargs -0 sha256sum) > evidence/candidate-app-libraries.sha256
          cmp evidence/baseline-app-libraries.sha256 evidence/candidate-app-libraries.sha256
          grep -q 'libapp.so' evidence/candidate-app-libraries.sha256
          grep -q 'libflutter_linux_gtk.so' evidence/candidate-app-libraries.sha256
          cp source-evidence/built-executable.sha256 evidence/prepackaging-executable.sha256
          cp baseline/squashfs-root/org.localsend.localsend_app.desktop evidence/baseline.desktop
          cp candidate/squashfs-root/org.localsend.localsend_app.desktop evidence/candidate.desktop
          ! grep -q '^StartupWMClass=' evidence/baseline.desktop
          grep -qx 'StartupWMClass=org.localsend.localsend_app' evidence/candidate.desktop
          diff -u evidence/baseline.desktop evidence/candidate.desktop > evidence/desktop.diff || test "$?" = 1
          sed '/^StartupWMClass=/d; /^$/d' evidence/baseline.desktop > evidence/baseline-normalized.desktop
          sed '/^StartupWMClass=/d; /^$/d' evidence/candidate.desktop > evidence/candidate-normalized.desktop
          cmp evidence/baseline-normalized.desktop evidence/candidate-normalized.desktop
          desktop-file-validate evidence/baseline.desktop
          desktop-file-validate evidence/candidate.desktop
          printf 'Identical exact-source executable; generated candidate desktop class validated.\n' > evidence/verdict.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-metadata-2433
          path: evidence/
