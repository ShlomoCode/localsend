name: Diagnose 2751 MATE tray scaling
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Optional completed diagnostic run to measure again
        type: string
        default: ''
      panel_size:
        description: Supported panel size in logical pixels (20 or 24)
        type: string
        default: '24'
      min_icon_size:
        description: Supported notification area minimum icon size (16 or 24)
        type: string
        default: '24'
      nixpkgs_revision:
        description: Report-date pin or official NixOS 25.05 release commit
        type: string
        default: '6132ff3ee5a9509d0aeb66a01a7d662c6384289b'
      app_route:
        description: Supported Nix build or unchanged official 1.17 tar through FHS wrapper
        type: string
        default: 'nix'
      runtime_only:
        description: Capture desktop daemon PATH and wrappers without starting LocalSend
        type: boolean
        default: false
jobs:
  mate-4k:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        if: inputs.artifact_run == ''
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Enable KVM for the NixOS test VM
        if: inputs.artifact_run == ''
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          df -h
      - name: Run unchanged LocalSend 1.17 on a supported MATE desktop
        if: inputs.artifact_run == ''
        env:
          PANEL_SIZE: ${{ inputs.panel_size }}
          MIN_ICON_SIZE: ${{ inputs.min_icon_size }}
          NIXPKGS_REVISION: ${{ inputs.nixpkgs_revision }}
          APP_ROUTE: ${{ inputs.app_route }}
          RUNTIME_ONLY: ${{ inputs.runtime_only }}
        run: |
          set -euo pipefail
          [[ "$PANEL_SIZE" =~ ^(20|24)$ ]]
          [[ "$MIN_ICON_SIZE" =~ ^(16|24)$ ]]
          [[ "$NIXPKGS_REVISION" =~ ^(6132ff3ee5a9509d0aeb66a01a7d662c6384289b|11cb3517b3af6af300dd6c055aeda73c9bf52c48)$ ]]
          [[ "$APP_ROUTE" =~ ^(nix|official)$ ]]
          [[ "$RUNTIME_ONLY" =~ ^(true|false)$ ]]
          for variant in baseline; do
            mkdir -p "evidence/$variant"
            printf '%s\n' "$NIXPKGS_REVISION" > "evidence/$variant/nixpkgs-revision.txt"
            if [ "$NIXPKGS_REVISION" = 11cb3517b3af6af300dd6c055aeda73c9bf52c48 ]; then
              nix-instantiate --eval --strict --json support/diagnostics/2751/cache.nix --argstr revision "$NIXPKGS_REVISION" > "evidence/$variant/cache-paths.json"
              while read -r store_path; do
                store_name=${store_path#/nix/store/}
                store_hash=${store_name%%-*}
                curl -fsS "https://cache.nixos.org/$store_hash.narinfo" > "evidence/$variant/$store_name.narinfo"
              done < <(jq -r '.[]' "evidence/$variant/cache-paths.json")
            fi
            fixed=false
            if [ "$variant" = panel-fix ]; then fixed=true; fi
            nix-build support/diagnostics/2751/mate.nix -A driver --arg panelFix "$fixed" --arg panelSize "$PANEL_SIZE" --arg minIconSize "$MIN_ICON_SIZE" --argstr revision "$NIXPKGS_REVISION" --argstr appRoute "$APP_ROUTE" --arg runtimeOnly "$RUNTIME_ONLY" --no-out-link | tee "evidence/$variant/driver-path.txt"
            driver=$(tail -1 "evidence/$variant/driver-path.txt")
            "$driver/bin/nixos-test-driver" --no-interactive --global-timeout 900 -o "$PWD/evidence/$variant" 2>&1 | tee "evidence/$variant/test-driver.log"
          done
      - name: Download retained diagnostic screenshots
        if: inputs.artifact_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.artifact_run }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir downloaded
          mkdir -p evidence
          for variant in baseline panel-fix; do
            source=$(find downloaded -type d -name "$variant" | head -1)
            if [ -n "$source" ]; then cp -R "$source" evidence/; fi
          done
      - name: Measure rendered icon pixels and retain tray crops
        if: inputs.runtime_only != true
        run: |
          set -euo pipefail
          python3 -m pip install Pillow
          for variant in evidence/*; do
            python3 support/diagnostics/2751/measure.py "$variant"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-2751-mate-4k-${{ github.run_id }}
          path: evidence/
