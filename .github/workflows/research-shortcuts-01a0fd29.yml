name: Research uncovered tiny bugs (2026-10-04)

on:
  push:
    branches:
      - codex/research-shortcuts-20261004-01a0fd29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-app-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: localsend/localsend
          ref: 9529e915f438d8edd8bdf23e9f7aab2261a8b3e6
          path: baseline
          persist-credentials: false
      - name: Pinned Flutter on disposable runner
        run: |
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve exact source and locked packages on runner
        run: |
          mkdir -p observations
          flutter --version
          flutter --version --machine > observations/flutter-version.json
          git -C baseline rev-parse HEAD > observations/baseline-sha.txt
          cd baseline
          flutter pub get --enforce-lockfile
      - name: Settings label component matrix
        id: settings
        continue-on-error: true
        run: |
          cp research/runner-uncovered/ui-settings-layout-harness.dart baseline/app/test/research_settings_layout_test.dart
          cd baseline/app
          flutter test test/research_settings_layout_test.dart --reporter expanded 2>&1 | tee ../../observations/settings-layout.log
      - name: Actual SendNotifier stale byte length before and after
        id: size
        continue-on-error: true
        run: |
          cp research/runner-uncovered/protocol-size-test.dart baseline/app/test/research_protocol_size_test.dart
          cd baseline/app
          set +e
          flutter test test/research_protocol_size_test.dart --reporter expanded > ../../observations/size-before.log 2>&1
          before_status=$?
          set -e
          echo "$before_status" > ../../observations/size-before-status.txt
          test "$before_status" -ne 0
          python3 ../../research/runner-uncovered/protocol-size-apply.py ..
          flutter test test/research_protocol_size_test.dart --reporter expanded 2>&1 | tee ../../observations/size-after.log
          git diff -- lib/provider/network/send_provider.dart > ../../observations/size-production.diff
      - name: Actual alias widget before and after
        id: alias
        continue-on-error: true
        run: |
          cp research/runner-uncovered/fresh-alias-history-2462-before-widget_test.dart baseline/app/test/research_alias_test.dart
          cd baseline/app
          set +e
          flutter test test/research_alias_test.dart --reporter expanded > ../../observations/alias-before.log 2>&1
          before_status=$?
          set -e
          echo "$before_status" > ../../observations/alias-before-status.txt
          test "$before_status" -ne 0
          git -C .. apply ../research/runner-uncovered/fresh-alias-history-2462.patch
          cp ../../research/runner-uncovered/fresh-alias-history-2462-after-widget_test.dart test/research_alias_test.dart
          flutter test test/research_alias_test.dart --reporter expanded 2>&1 | tee ../../observations/alias-after.log
          git diff -- lib/widget/dialogs/text_field_with_actions.dart lib/pages/tabs/settings_tab.dart > ../../observations/alias-production.diff
      - name: Actual Wayland resize and persistence before and after
        id: wayland
        continue-on-error: true
        run: |
          cp research/runner-uncovered/packaging-wayland-fixture_test.dart baseline/app/test/research_wayland_test.dart
          cd baseline/app
          flutter test test/research_wayland_test.dart --dart-define=PATCHED=false --reporter expanded 2>&1 | tee ../../observations/wayland-before.log
          git -C .. apply ../research/runner-uncovered/packaging-wayland-size-patch.diff
          flutter test test/research_wayland_test.dart --dart-define=PATCHED=true --reporter expanded 2>&1 | tee ../../observations/wayland-after.log
          git diff -- lib/provider/window_dimensions_provider.dart lib/provider/persistence_provider.dart lib/widget/watcher/window_watcher.dart > ../../observations/wayland-production.diff
      - name: Final fixture gate
        if: always()
        run: |
          test '${{ steps.settings.outcome }}' = success
          test '${{ steps.size.outcome }}' = success
          test '${{ steps.alias.outcome }}' = success
          test '${{ steps.wayland.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncovered-app-observations
          path: observations/
          if-no-files-found: error
  launcher-and-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runtime prerequisites only on runner
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0
          git clone --depth 1 --branch 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Actual desktop launcher generation and GLib launches
        id: launcher
        continue-on-error: true
        run: |
          mkdir -p observations
          flutter --version
          dart research/runner-uncovered/packaging-autostart-fixture.dart research/runner-uncovered/autostart-baseline.dart research/runner-uncovered/packaging-autostart-after.dart observations/launches
          /usr/bin/python3 research/runner-uncovered/packaging-glib-launch-fixture.py observations/launches 2>&1 | tee observations/launcher.log
      - name: Photo export timestamp source seam before and after
        id: photo
        continue-on-error: true
        run: |
          set +e
          dart research/runner-uncovered/fresh-photo-3316-before.dart > observations/photo-before.log 2>&1
          before_status=$?
          set -e
          echo "$before_status" > observations/photo-before-status.txt
          test "$before_status" -ne 0
          dart research/runner-uncovered/fresh-photo-3316-after.dart 2>&1 | tee observations/photo-after.log
      - name: Favorite endpoint label source seam before and after
        id: favorite
        continue-on-error: true
        run: |
          set +e
          dart research/runner-uncovered/fresh-alias-history-2381-before.dart > observations/favorite-before.log 2>&1
          before_status=$?
          set -e
          echo "$before_status" > observations/favorite-before-status.txt
          test "$before_status" -ne 0
          dart research/runner-uncovered/fresh-alias-history-2381-after.dart 2>&1 | tee observations/favorite-after.log
      - name: Final fixture gate
        if: always()
        run: |
          test '${{ steps.launcher.outcome }}' = success
          test '${{ steps.photo.outcome }}' = success
          test '${{ steps.favorite.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncovered-launcher-observations
          path: observations/
          if-no-files-found: error
  native-windows-theme:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Actual Win32 theme message before and after
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force observations | Out-Null
          cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE research/runner-uncovered/fresh-ui-input-win32-real.cpp /Fe:theme-before.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /EHsc /std:c++17 /DUNICODE /D_UNICODE /DAFTER_FIX research/runner-uncovered/fresh-ui-input-win32-real.cpp /Fe:theme-after.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./theme-before.exe 2>&1 | Tee-Object observations/theme-before.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./theme-after.exe 2>&1 | Tee-Object observations/theme-after.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uncovered-windows-observations
          path: observations/
          if-no-files-found: error
