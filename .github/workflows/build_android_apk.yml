name: Gal3 physical-device build
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        type: string
      label:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            packages/localsend_isolates/rust -> ../rust_builder/build
      - name: Prepare supported FOSS build
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - name: Configure release signing
        env:
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          printf '%s' "$KEY_PROPERTIES" | base64 -di > app/android/key.properties
          mkdir -p secrets
          printf '%s' "$KEY_STORE" | base64 -di > secrets/android-keystore.jks
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Build ARM64 release
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64
      - name: Record build identity
        env:
          BUILD_LABEL: ${{ inputs.label }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          flutter --version > evidence/flutter-version.txt
          cp pubspec.lock evidence/pubspec.lock
          cp app/android/gradle/wrapper/gradle-wrapper.properties evidence/
          cp app/build/app/outputs/flutter-apk/app-release.apk "evidence/$BUILD_LABEL.apk"
          sha256sum "evidence/$BUILD_LABEL.apk" > evidence/apk-sha256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.label }}
          path: evidence
