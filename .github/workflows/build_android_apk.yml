# Source template only. Publish on an authorized temporary driver branch under
# an already registered workflow filename; never modify the default branch.
name: Independent reviewed cloud operation
run-name: independent:${{ inputs.operation_id }}
on:
  workflow_dispatch:
    inputs:
      operation_id:
        required: true
        type: string
      sourceCommit:
        required: true
        type: string
      scenarioHash:
        required: true
        type: string
      harnessPath:
        required: true
        type: string
      harnessSha256:
        required: true
        type: string
      runner_os:
        required: true
        type: choice
        options: [ubuntu, windows, macos]
      timeout_minutes:
        required: true
        type: string
permissions:
  contents: read
jobs:
  operation:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/independent-driver' && inputs.timeout_minutes >= 3 && inputs.timeout_minutes <= 85
    runs-on: ${{ fromJSON('{"ubuntu":"ubuntu-24.04","windows":"windows-2022","macos":"macos-14"}')[inputs.runner_os] }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: Checkout exact reviewed driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ShlomoCode/localsend
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Checkout exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ShlomoCode/localsend
          ref: ${{ inputs.sourceCommit }}
          path: source
          persist-credentials: false
      - name: Execute reviewed harness and retain typed evidence
        shell: bash
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
          OUTPUT_ROOT: ${{ github.workspace }}/independent-output
          OPERATION_ID: ${{ inputs.operation_id }}
          SOURCE_COMMIT: ${{ inputs.sourceCommit }}
          SCENARIO_HASH: ${{ inputs.scenarioHash }}
          HARNESS_PATH: ${{ inputs.harnessPath }}
          HARNESS_SHA256: ${{ inputs.harnessSha256 }}
          REQUESTED_RUNNER_OS: ${{ inputs.runner_os }}
          DRIVER_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        run: node driver/.a5c/processes/localsend-independent/cloud-driver.mjs
      - name: Retain original operation files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-${{ inputs.operation_id }}
          path: independent-output/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
