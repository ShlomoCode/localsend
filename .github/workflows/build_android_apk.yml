name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_gal_comparison:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            gal_sha: 5a36aff5b0669690cd94a9443a6eed64d4c7cc78
          - variant: fixed
            gal_sha: 0f4f532d8f58ea98b7d8712ab6b9096b0232dee0

    steps:
      - name: Checkout LocalSend 1.17.0
        uses: actions/checkout@v6
        with:
          ref: v1.17.0

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Configure gal source
        env:
          GAL_SHA: ${{ matrix.gal_sha }}
        run: |
          cat > app/pubspec_overrides.yaml <<EOT
          dependency_overrides:
            gal:
              git:
                url: https://github.com/natsuk4ze/gal.git
                ref: $GAL_SHA
          EOT

      - name: Decode Android signing configuration
        env:
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          echo "$KEY_PROPERTIES" | base64 -di > app/android/key.properties
          mkdir -p secrets
          echo "$KEY_STORE" | base64 -di > secrets/android-keystore.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Resolve dependencies and verify gal commit
        working-directory: app
        env:
          GAL_SHA: ${{ matrix.gal_sha }}
        run: |
          flutter pub get
          grep -Fq "resolved-ref: $GAL_SHA" pubspec.lock

      - name: Build arm64 APK
        working-directory: app
        run: flutter build apk --split-per-abi

      - name: Record build identity
        env:
          GAL_SHA: ${{ matrix.gal_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          printf 'LocalSend: v1.17.0 (7f21d1f9082a43803e05c37f021912e012145aa5)\nGal: %s\nVariant: %s\n' "$GAL_SHA" "$VARIANT" > app/build/app/outputs/flutter-apk/build-identity.txt
          sha256sum app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk >> app/build/app/outputs/flutter-apk/build-identity.txt

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: gal-2311-${{ matrix.variant }}-arm64
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/build-identity.txt
