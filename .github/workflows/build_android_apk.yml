name: Issue 2311 Android source boundary diagnostics

on:
  workflow_dispatch:
    inputs:
      source_family:
        type: choice
        options: [historical, current, candidate]
        default: historical
      build_tagged:
        type: boolean
        default: true
      candidate_stage:
        type: choice
        options: [resolve-lock, build-pair]
        default: resolve-lock
      candidate_ref:
        description: Full immutable LocalSend candidate commit
        type: string
        default: ''
      gal_ref:
        description: Full immutable ShlomoCode/gal candidate commit
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: issue2311-android-source-build
  cancel-in-progress: false

jobs:
  source_boundary:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch' && inputs.source_family == 'historical'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic infrastructure
        uses: actions/checkout@v6
        with:
          path: diagnostics
          persist-credentials: false

      - name: Checkout exact historical app source
        uses: actions/checkout@v6
        with:
          repository: ShlomoCode/localsend
          ref: 7f21d1f9082a43803e05c37f021912e012145aa5
          path: historical
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install historical Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install historical Rust SDK and Android ARM64 target
        run: |
          rustup toolchain install 1.84.1 --profile minimal
          rustup target add --toolchain 1.84.1 aarch64-linux-android

      - name: Build control and tagged ARM64 release APKs
        shell: bash
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
          RUSTUP_TOOLCHAIN: '1.84.1'
        run: bash diagnostics/support/diagnostics/issue2311-build-boundary.sh "$GITHUB_WORKSPACE/historical" "$GITHUB_WORKSPACE/issue2311-build-evidence"

      - name: Upload APKs and source build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: issue2311-source-boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue2311-build-evidence/
          if-no-files-found: error
          retention-days: 30
  current_boundary:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch' && inputs.source_family == 'current'
    uses: ./.github/workflows/issue2311_current_android_boundary.yml
    with:
      build_tagged: ${{ inputs.build_tagged }}
    secrets: inherit
  candidate_pair:
    if: github.repository == 'ShlomoCode/localsend' && github.event_name == 'workflow_dispatch' && inputs.source_family == 'candidate'
    uses: ./.github/workflows/issue2311_candidate_android_pair.yml
    with:
      candidate_stage: ${{ inputs.candidate_stage }}
      candidate_ref: ${{ inputs.candidate_ref }}
      gal_ref: ${{ inputs.gal_ref }}
    secrets: inherit
