name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      helper_only:
        type: boolean
        default: false
  workflow_call:

jobs:
  build_gal_comparison:
    if: ${{ !inputs.helper_only }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            gal_sha: 5a36aff5b0669690cd94a9443a6eed64d4c7cc78
          - variant: fixed
            gal_sha: 0f4f532d8f58ea98b7d8712ab6b9096b0232dee0

    steps:
      - name: Checkout LocalSend 1.17.0
        uses: actions/checkout@v6
        with:
          ref: v1.17.0
          persist-credentials: false

      - name: Checkout gal
        uses: actions/checkout@v6
        with:
          repository: natsuk4ze/gal
          ref: ${{ matrix.gal_sha }}
          path: gal_source
          persist-credentials: false

      - name: Remove proprietary dependencies
        run: sh scripts/remove_proprietary_dependencies.sh

      - name: Configure gal source
        env:
          GAL_SHA: ${{ matrix.gal_sha }}
        run: |
          test "$(git -C gal_source rev-parse HEAD)" = "$GAL_SHA"
          grep -Fqx '    compileSdk flutter.compileSdkVersion' gal_source/android/build.gradle
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' gal_source/android/build.gradle
          cat > app/pubspec_overrides.yaml <<EOT
          dependency_overrides:
            gal:
              path: ../gal_source
          EOT

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.84.1
          override: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Build arm64 APK
        working-directory: app
        run: flutter build apk --debug --split-per-abi --target-platform android-arm64

      - name: Record build identity
        env:
          GAL_SHA: ${{ matrix.gal_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          printf 'LocalSend: v1.17.0 (7f21d1f9082a43803e05c37f021912e012145aa5)\nGal: %s\nVariant: %s\n' "$GAL_SHA" "$VARIANT" > app/build/app/outputs/flutter-apk/build-identity.txt
          sha256sum gal_source/android/src/main/java/studio/midoridesign/gal/GalPlugin.java >> app/build/app/outputs/flutter-apk/build-identity.txt
          git -C gal_source diff -- android/build.gradle >> app/build/app/outputs/flutter-apk/build-identity.txt
          sha256sum app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk >> app/build/app/outputs/flutter-apk/build-identity.txt

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v6
        with:
          name: gal-2311-${{ matrix.variant }}-arm64
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            app/build/app/outputs/flutter-apk/build-identity.txt
            app/pubspec.lock

  build_transport_helper:
    if: ${{ inputs.helper_only }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout diagnostic helper
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build transport helper
        run: bash support/diagnostics/gal331-transport-helper/build.sh "$RUNNER_TEMP/gal331-transport-helper.apk"

      - name: Upload transport helper
        uses: actions/upload-artifact@v6
        with:
          name: gal-2311-transport-helper
          path: ${{ runner.temp }}/gal331-transport-helper.apk
