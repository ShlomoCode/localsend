name: Diagnose issue 1864 Android TV
on:
  workflow_dispatch:
    inputs:
      image:
        description: Genuine image; supplementary Android 10 x64 or TV 16 x64
        type: choice
        options:
          - system-images;android-29;google_apis;x86_64
          - system-images;android-36;android-tv;x86_64
          - system-images;android-29;android-tv;x86
        default: system-images;android-29;google_apis;x86_64
      mouse:
        description: Diagnostic mouse injection backend
        type: choice
        options: [adb, w3c-native]
        default: adb
      apk:
        description: Existing APK, diagnostic source pair, or clean production source pair
        type: choice
        options: [original, current-c1ce, source-pair, source-reuse, source-trace-reuse, production-pair, format-helper, ndk-toolchain]
        default: original
      candidate_commit:
        description: Reviewed production candidate full 40-character commit SHA (production-pair only)
        type: string
        default: ''
      focus_trace:
        description: Observational Flutter focus/action trace; requires new source-pair build
        type: boolean
        default: false
      probe:
        description: Source-pair variable; collapsed-path keeps thumbnail focus enabled in both variants
        type: choice
        options: [thumbnail-focus, collapsed-path]
        default: thumbnail-focus
      recording_stop:
        description: Diagnostic recorder finalization; inputs remain unchanged
        type: choice
        options: [signal, natural, whole]
        default: signal
permissions:
  contents: read
  actions: read
concurrency:
  group: issue-1864-tv
  cancel-in-progress: false
jobs:
  baseline:
    if: inputs.apk != 'format-helper' && inputs.apk != 'ndk-toolchain'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.apk == 'production-pair' && 150 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated production comparison inputs
        if: inputs.apk == 'production-pair'
        env:
          ISSUE1864_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          ISSUE1864_IMAGE: ${{ inputs.image }}
          ISSUE1864_MOUSE: ${{ inputs.mouse }}
          ISSUE1864_FOCUS_TRACE: ${{ inputs.focus_trace }}
          ISSUE1864_PROBE: ${{ inputs.probe }}
          ISSUE1864_RECORDING_STOP: ${{ inputs.recording_stop }}
          ISSUE1864_REPOSITORY: ${{ github.repository }}
        run: |
          test "$ISSUE1864_REPOSITORY" = ShlomoCode/localsend
          [[ "$ISSUE1864_CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$ISSUE1864_IMAGE" = 'system-images;android-36;android-tv;x86_64'
          test "$ISSUE1864_MOUSE" = w3c-native
          test "$ISSUE1864_FOCUS_TRACE" = false
          test "$ISSUE1864_PROBE" = thumbnail-focus
          test "$ISSUE1864_RECORDING_STOP" = natural
          test -f support/tests/issue1864-production-replay.sh
          mkdir -p evidence-cloud
          ISSUE1864_JOB_START_EPOCH=$(date +%s)
          ISSUE1864_HOST_DEADLINE_EPOCH_MS=$(((ISSUE1864_JOB_START_EPOCH + 145 * 60) * 1000))
          echo "ISSUE1864_HOST_DEADLINE_EPOCH_MS=$ISSUE1864_HOST_DEADLINE_EPOCH_MS" >> "$GITHUB_ENV"
          printf 'job timeout: 150 minutes\nhost deadline: %s ms since epoch (145 minutes from gate)\neach release build timeout: 1800 seconds, then 60-second kill grace\n' "$ISSUE1864_HOST_DEADLINE_EPOCH_MS" > evidence-cloud/production-job-budget.txt
      - name: Require normal source build for Flutter instrumentation
        if: inputs.focus_trace && inputs.apk != 'source-pair' && inputs.apk != 'source-trace-reuse'
        run: exit 1
      - name: Require traced controls for retained observational pair
        if: inputs.apk == 'source-trace-reuse' && !inputs.focus_trace
        run: exit 1
      - name: Require traced source pair for whole-variant recording
        if: inputs.recording_stop == 'whole' && (!inputs.focus_trace || (inputs.apk != 'source-pair' && inputs.apk != 'source-trace-reuse'))
        run: exit 1
      - name: Require new traced source pair for collapsed-path probe
        if: inputs.probe == 'collapsed-path' && (inputs.apk != 'source-pair' || !inputs.focus_trace)
        run: exit 1
      - uses: actions/setup-java@v5
        if: inputs.apk == 'source-pair' || inputs.apk == 'production-pair'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: inputs.apk == 'source-pair' || inputs.apk == 'production-pair'
        with:
          flutter-version: '3.41.9'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.apk == 'source-pair' || inputs.apk == 'production-pair'
        with:
          toolchain: '1.97.1'
      - name: Build exact clean production pair through normal release route
        if: inputs.apk == 'production-pair'
        env:
          ISSUE1864_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: bash support/tests/issue1864-production-build.sh
      - name: Build controlled source pair through normal Flutter build
        if: inputs.apk == 'source-pair'
        working-directory: app
        run: |
          mkdir -p ../evidence-cloud
          git rev-parse HEAD > ../evidence-cloud/source-pair-head.txt
          flutter --version > ../evidence-cloud/source-pair-flutter.txt
          rustc --version > ../evidence-cloud/source-pair-rust.txt
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle
          flutter pub get
          dart format lib/util/ui/diagnostic_asset_picker_delegate.dart lib/util/ui/diagnostic_picker_focus_trace.dart lib/util/native/file_picker.dart
          flutter analyze lib/util/ui/diagnostic_asset_picker_delegate.dart lib/util/ui/diagnostic_picker_focus_trace.dart lib/util/native/file_picker.dart
          git diff > ../evidence-cloud/source-pair-common-diff.patch
          cp ../pubspec.lock ../evidence-cloud/source-pair-pubspec.lock
          if [ '${{ inputs.probe }}' = collapsed-path ]; then
            cat > ../evidence-cloud/source-pair-experiment.json <<'JSON'
          {"probe":"collapsed-path","baseline":"FAD-only control","focus":"FAD plus collapsed-path exclusion","defines":{"baseline":{"ISSUE1864_FOCUS_PROBE":true,"ISSUE1864_TRACE":true,"ISSUE1864_EXCLUDE_COLLAPSED_PATH":false},"focus":{"ISSUE1864_FOCUS_PROBE":true,"ISSUE1864_TRACE":true,"ISSUE1864_EXCLUDE_COLLAPSED_PATH":true}},"baselineEvidence":"Run 38178411434: FAD-only short/fresh selection and cyan counts were zero","buildRoute":"Same normal Flutter build, source head, toolchain and resolved dependencies for both variants"}
          JSON
          else
            cat > ../evidence-cloud/source-pair-experiment.json <<'JSON'
          {"probe":"thumbnail-focus","baseline":"Original thumbnail control","focus":"FAD thumbnail focus","defines":{"baseline":{"ISSUE1864_FOCUS_PROBE":false,"ISSUE1864_TRACE":${{ inputs.focus_trace }},"ISSUE1864_EXCLUDE_COLLAPSED_PATH":false},"focus":{"ISSUE1864_FOCUS_PROBE":true,"ISSUE1864_TRACE":${{ inputs.focus_trace }},"ISSUE1864_EXCLUDE_COLLAPSED_PATH":false}},"buildRoute":"Same normal Flutter build, source head, toolchain and resolved dependencies for both variants"}
          JSON
          fi
          for mode in false true; do
            if [ "$mode" = false ]; then variant=baseline; else variant=focus; fi
            if [ '${{ inputs.probe }}' = collapsed-path ]; then
              flutter build apk --release --target-platform android-arm64 --dart-define=ISSUE1864_FOCUS_PROBE=true --dart-define=ISSUE1864_TRACE=true --dart-define=ISSUE1864_EXCLUDE_COLLAPSED_PATH=$mode
            else
              flutter build apk --release --target-platform android-arm64 --dart-define=ISSUE1864_FOCUS_PROBE=$mode --dart-define=ISSUE1864_TRACE=${{ inputs.focus_trace }}
            fi
            cp build/app/outputs/flutter-apk/app-release.apk ../evidence-cloud/source-$variant.apk
            sha256sum ../evidence-cloud/source-$variant.apk >> ../evidence-cloud/source-pair-apk-sha256.txt
          done
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Reuse exact retained normal source pair
        if: inputs.apk == 'source-reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence-cloud
          gh run download 38164923680 --repo ShlomoCode/localsend --name issue1864-tv29-initial --dir /tmp/issue1864-source-reuse
          cp /tmp/issue1864-source-reuse/source-*.apk evidence-cloud/
          cp /tmp/issue1864-source-reuse/source-pair* evidence-cloud/
          echo 'e633bffbdd2b4de18f80eaa1f365b2e7c273266f83d25a9bb37195df0c0c234b  evidence-cloud/source-baseline.apk' | sha256sum -c -
          echo 'f6925e4846f3c3ee177d8b490e1f0e53aea634f391f43418d7bd4ce21816deb1  evidence-cloud/source-focus.apk' | sha256sum -c -
          echo 'Exact pair reused from run38164923680, headf927f8dd; no app rebuild or APK changes in this test-only job.' > evidence-cloud/source-pair-reuse.txt
      - name: Reuse exact retained observational source pair
        if: inputs.apk == 'source-trace-reuse'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence-cloud
          gh run download 38170048603 --repo ShlomoCode/localsend --name issue1864-tv29-initial --dir /tmp/issue1864-source-trace-reuse
          cp /tmp/issue1864-source-trace-reuse/source-*.apk evidence-cloud/
          cp /tmp/issue1864-source-trace-reuse/source-pair* evidence-cloud/
          echo '3d71df2ec508886337a1e296d6dd8a0212fa2214864401c4a514f4a6fe7a20e4  evidence-cloud/source-baseline.apk' | sha256sum -c -
          echo '22e1adefd19127ca8a4a6cd069803f2ac7c6a984f1553bb0e72b7e84ce3ecd56  evidence-cloud/source-focus.apk' | sha256sum -c -
          echo 'Exact observational pair from run38170048603, head5b70d519; TRACE=true shared by both; no rebuild or APK changes.' > evidence-cloud/source-pair-reuse.txt
      - name: Prepare genuine TV 10 image and avdslim
        shell: bash
        run: |
          mkdir -p evidence-cloud
          echo '${{ inputs.image }}' > evidence-cloud/system-image.txt
          sdkmanager 'platform-tools' 'emulator' '${{ inputs.image }}'
          echo no | avdmanager create avd --name issue1864-tv29 --package '${{ inputs.image }}' --device 'tv_1080p'
          avdmanager list avd > evidence-cloud/avd-list.txt
          ISSUE_AVD_DIR="$(avdmanager list avd | sed -n 's/^ *Path: //p' | head -1)"
          cp "$ISSUE_AVD_DIR/config.ini" evidence-cloud/avd-default.ini
          mkdir -p "$HOME/.android"
          ln -s "$(dirname "$ISSUE_AVD_DIR")" "$HOME/.android/avd"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          curl -fsSL https://github.com/kdbhalala/avdslim/releases/download/v1.0.15/avdslim_v1.0.15_linux_amd64.tar.gz -o /tmp/avdslim.tar.gz
          tar -xzf /tmp/avdslim.tar.gz -C /tmp
          sudo install /tmp/avdslim_v1.0.15_linux_amd64/avdslim /usr/local/bin/avdslim
          avdslim help > evidence-cloud/avdslim-help.txt
          avdslim enable dpad issue1864-tv29
          cp "$ISSUE_AVD_DIR/config.ini" evidence-cloud/avd-dpad.ini
          sudo chmod 666 /dev/kvm
          if timeout 180 avdslim start issue1864-tv29 --headless --no-slim --no-lowram > evidence-cloud/emulator-launch.log 2>&1; then
            echo 0 > evidence-cloud/emulator-launch-status.txt
          else
            echo "$?" > evidence-cloud/emulator-launch-status.txt
          fi
          bash support/tests/issue1864-boot.sh
          adb shell getprop > evidence-cloud/getprop.txt
          adb shell settings list system > evidence-cloud/system-settings.txt
          adb shell settings list secure > evidence-cloud/secure-settings.txt
          adb shell dumpsys input > evidence-cloud/input-default.txt
      - name: Install exact diagnostic APK and capture readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '${{ inputs.apk }}' > evidence-cloud/apk-target.txt
          if [ '${{ inputs.apk }}' != original ]; then
            adb shell getprop ro.product.cpu.abilist | grep arm64-v8a
          fi
          if [ '${{ inputs.apk }}' = current-c1ce ]; then
            gh run download 38107226429 --repo ShlomoCode/localsend --name issue2462-current-android --dir /tmp/issue1864-current
            mapfile -t ISSUE_CURRENT_APKS < <(find /tmp/issue1864-current -type f -name app-release.apk)
            [ "${#ISSUE_CURRENT_APKS[@]}" = 1 ]
            cp "${ISSUE_CURRENT_APKS[0]}" evidence-cloud/current-c1ce.apk
            ISSUE_DIAGNOSTIC_APK=evidence-cloud/current-c1ce.apk
            echo '69df1d0fa252328f8b80a2197d850c78483df1fd711a4de18fbb021f23a637ea  evidence-cloud/current-c1ce.apk' | sha256sum -c -
            echo 'Existing build run38107226429, artifact11691000051, workflow head6dd3184ef65cb473a717fd52dd37b9b88ae4edc4; app source c1ce322fb3acf08e44f329b8b7208b8b0d91e244; Flutter3.41.9, Dart3.11.5, Rust1.97.1; legitimate runtime ARM64 ABI/native bridge only; no new build.' > evidence-cloud/current-build-provenance.txt
          elif [ '${{ inputs.apk }}' = source-pair ] || [ '${{ inputs.apk }}' = source-reuse ] || [ '${{ inputs.apk }}' = source-trace-reuse ] || [ '${{ inputs.apk }}' = production-pair ]; then
            ISSUE_DIAGNOSTIC_APK=evidence-cloud/source-baseline.apk
          else
            curl -fsSL https://github.com/localsend/localsend/releases/download/v1.15.4/LocalSend-1.15.4-android-google-play.apk -o evidence-cloud/original-1.15.4.apk
            ISSUE_DIAGNOSTIC_APK=evidence-cloud/original-1.15.4.apk
          fi
          sha256sum "$ISSUE_DIAGNOSTIC_APK" > evidence-cloud/apk-sha256.txt
          unzip -Z1 "$ISSUE_DIAGNOSTIC_APK" | grep '^lib/' > evidence-cloud/apk-libraries.txt
          if [ '${{ inputs.apk }}' != original ]; then
            # This artifact has full ARM64 app libraries but x64 plugin stubs.
            # Ask PackageManager for the supported full ABI, preserving the APK.
            adb install --abi arm64-v8a -r "$ISSUE_DIAGNOSTIC_APK" 2>&1 | tee evidence-cloud/install.log
          else
            adb install -r "$ISSUE_DIAGNOSTIC_APK" 2>&1 | tee evidence-cloud/install.log
          fi
          adb shell dumpsys package org.localsend.localsend_app > evidence-cloud/installed-package.txt
          if [ '${{ inputs.apk }}' != original ]; then
            grep 'primaryCpuAbi=arm64-v8a' evidence-cloud/installed-package.txt
          fi
          adb shell am start -n org.localsend.localsend_app/.MainActivity 2>&1 | tee evidence-cloud/launch.log
          sleep 5
          adb exec-out screencap -p > evidence-cloud/initial.png
          adb shell dumpsys activity activities > evidence-cloud/activity.txt
          adb logcat -d > evidence-cloud/logcat.txt || echo "Initial optional logcat dump exited $?" > evidence-cloud/logcat-dump-status.txt
          adb shell uiautomator dump /sdcard/ui.xml 2>&1 | tee evidence-cloud/uiautomator-dump.txt || true
          adb pull /sdcard/ui.xml evidence-cloud/initial.xml || true
      - name: Seed ordinary photos and capture real Media route
        shell: bash
        env:
          ISSUE1864_MOUSE: ${{ inputs.mouse }}
          ISSUE1864_APK: ${{ inputs.apk }}
          ISSUE1864_TRACE: ${{ inputs.focus_trace }}
          ISSUE1864_RECORDING_STOP: ${{ inputs.recording_stop }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick tesseract-ocr ffmpeg
          mkdir -p /tmp/issue1864-photos
          for color in red green blue yellow purple orange; do convert -size 640x480 xc:$color /tmp/issue1864-photos/$color.jpg; done
          adb shell mkdir -p /sdcard/Pictures/issue1864
          adb push /tmp/issue1864-photos/. /sdcard/Pictures/issue1864/
          for color in red green blue yellow purple orange; do adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Pictures/issue1864/$color.jpg; done
          sleep 3
          adb shell content query --uri content://media/external/images/media --projection _id:_display_name > evidence-cloud/seeded-mediastore.txt
          if [ '${{ inputs.apk }}' != production-pair ]; then
            for permission in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO; do adb shell pm grant org.localsend.localsend_app android.permission.$permission 2>&1 | tee -a evidence-cloud/permission-grants.txt || true; done
          fi
          npm install -g appium
          appium driver install uiautomator2
          appium --version > evidence-cloud/appium-version.txt
          appium driver list --installed > evidence-cloud/appium-drivers.txt
          appium --port 4723 --log evidence-cloud/appium.log &
          ISSUE_APPIUM_PID=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4723/status && break; sleep 1; done
          curl -fsS http://127.0.0.1:4723/status > evidence-cloud/appium-readiness.json
          ISSUE_TV_SCRIPT=support/tests/issue1864-tv.mjs
          if [ '${{ inputs.recording_stop }}' = whole ]; then ISSUE_TV_SCRIPT=support/tests/issue1864-whole.mjs; fi
          if [ '${{ inputs.apk }}' = production-pair ]; then
            bash support/tests/issue1864-production-replay.sh
          elif [ '${{ inputs.apk }}' = source-pair ] || [ '${{ inputs.apk }}' = source-reuse ] || [ '${{ inputs.apk }}' = source-trace-reuse ]; then
            ISSUE1864_PHASE=paired-core ISSUE1864_APK=source-baseline node "$ISSUE_TV_SCRIPT"
            kill "$ISSUE_APPIUM_PID"
            wait "$ISSUE_APPIUM_PID" || true
            mkdir -p evidence-cloud/source-baseline
            find evidence-cloud -maxdepth 1 -type f ! -name '*.apk' ! -name 'source-pair*' -exec mv {} evidence-cloud/source-baseline/ \;
            adb install --abi arm64-v8a -r evidence-cloud/source-focus.apk
            adb shell pm clear org.localsend.localsend_app
            adb shell dumpsys package org.localsend.localsend_app > evidence-cloud/focus-installed-package.txt
            grep 'primaryCpuAbi=arm64-v8a' evidence-cloud/focus-installed-package.txt
            for permission in READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO; do adb shell pm grant org.localsend.localsend_app android.permission.$permission 2>&1 | tee -a evidence-cloud/focus-permission-grants.txt || true; done
            appium --port 4723 --log evidence-cloud/appium.log &
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4723/status && break; sleep 1; done
            curl -fsS http://127.0.0.1:4723/status > evidence-cloud/appium-readiness.json
            ISSUE1864_PHASE=paired-core ISSUE1864_APK=source-focus node "$ISSUE_TV_SCRIPT"
            mkdir -p evidence-cloud/source-focus
            find evidence-cloud -maxdepth 1 -type f ! -name '*.apk' ! -name 'source-pair*' -exec mv {} evidence-cloud/source-focus/ \;
            node support/tests/issue1864-pair.mjs
          else
            node support/tests/issue1864-tv.mjs
          fi
      - name: Validate recordings and render logged input review aids
        if: always()
        run: |
          mkdir -p evidence-cloud
          free -h > evidence-cloud/host-memory.txt
          df -h > evidence-cloud/host-disk.txt
          ps -eo pid,ppid,rss,comm > evidence-cloud/host-processes.txt
          sudo dmesg --ctime > evidence-cloud/host-kernel.txt 2> evidence-cloud/host-kernel-stderr.txt || echo "Optional kernel collection exited $?" > evidence-cloud/host-kernel-status.txt
          adb devices -l > evidence-cloud/adb-final-devices.txt 2> evidence-cloud/adb-final-stderr.txt || echo "Optional adb devices collection exited $?" > evidence-cloud/adb-final-status.txt
          for logfile in /tmp/avdslim-emulator-*.log; do if [ -f "$logfile" ]; then cp "$logfile" evidence-cloud/; fi; done
          adb logcat -d > evidence-cloud/final-logcat.txt 2> evidence-cloud/final-logcat-stderr.txt || echo "Final optional logcat dump exited $?" > evidence-cloud/final-logcat-status.txt
          node support/tests/issue1864-video.mjs
          if [ '${{ inputs.apk }}' = source-pair ] || [ '${{ inputs.apk }}' = source-reuse ] || [ '${{ inputs.apk }}' = source-trace-reuse ]; then
            ISSUE1864_VIDEO_DIR=evidence-cloud/source-baseline node support/tests/issue1864-video.mjs
            ISSUE1864_VIDEO_DIR=evidence-cloud/source-focus node support/tests/issue1864-video.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1864-tv29-initial
          path: evidence-cloud
  ndk-toolchain:
    if: inputs.apk == 'ndk-toolchain'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Require the fork
        run: test "$GITHUB_REPOSITORY" = ShlomoCode/localsend
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Qualify the required NDK through the existing SDK Manager
        run: bash support/tests/issue1864-ndk-toolchain.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1864-ndk-toolchain
          path: evidence-cloud/ndk-toolchain
          if-no-files-found: error
  format:
    if: inputs.apk == 'format-helper'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ISSUE1864_CANDIDATE: 8dae8cbf053195f913cf132f4d07ff9f76da5278
      ISSUE1864_HELPER: app/lib/util/ui/keyboard_asset_picker.dart
    steps:
      - name: Require the fork and initialize evidence
        run: |
          mkdir -p format-evidence
          printf 'repository=%s\nworkflow_sha=%s\ncandidate=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$ISSUE1864_CANDIDATE" > format-evidence/request.txt
          test "$GITHUB_REPOSITORY" = ShlomoCode/localsend

      - name: Check out the immutable candidate separately
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: 8dae8cbf053195f913cf132f4d07ff9f76da5278
          path: issue1864-candidate
          persist-credentials: false

      - name: Require clean source and reviewed file hashes
        id: original
        working-directory: issue1864-candidate
        run: |
          git rev-parse HEAD > ../format-evidence/candidate-head.txt
          test "$(git rev-parse HEAD)" = "$ISSUE1864_CANDIDATE"
          ! git symbolic-ref -q HEAD
          git status --porcelain=v1 --untracked-files=all > ../format-evidence/status-before.txt
          test ! -s ../format-evidence/status-before.txt
          cp "$ISSUE1864_HELPER" ../format-evidence/keyboard_asset_picker.original.dart
          cp app/lib/util/native/file_picker.dart ../format-evidence/file_picker.original.dart
          cp app/analysis_options.yaml ../format-evidence/analysis_options.original.yaml
          cp .fvmrc ../format-evidence/fvmrc.original.json
          cp pubspec.lock ../format-evidence/pubspec.original.lock
          cp pubspec.yaml ../format-evidence/pubspec.original.yaml
          cp app/pubspec.yaml ../format-evidence/app-pubspec.original.yaml
          sha256sum "$ISSUE1864_HELPER" app/lib/util/native/file_picker.dart app/analysis_options.yaml pubspec.lock > ../format-evidence/original-sha256.txt
          printf '%s\n' \
            '023e7d532e2e24685bc30615811b034924f6e33dc2df3196baa525ec5b014cef  app/lib/util/native/file_picker.dart' \
            '7e91be6855ba0fd3a495b7afb2a4c881a43e595addccc878d59776599f6d4f7c  app/lib/util/ui/keyboard_asset_picker.dart' \
            | sha256sum -c - > ../format-evidence/original-hash-check.txt
          grep -Eq '^  page_width: 150$' app/analysis_options.yaml
          grep -Eq '^  trailing_commas: preserve$' app/analysis_options.yaml

      - name: Install the pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Record and require Flutter and Dart versions
        run: |
          timeout --kill-after=10s 60s flutter --version --machine > format-evidence/toolchain.json
          timeout --kill-after=10s 60s dart --version > format-evidence/dart-version.txt 2>&1
          jq -e '.frameworkVersion == "3.41.9" and .dartSdkVersion == "3.11.5"' format-evidence/toolchain.json

      - name: Resolve normal workspace dependencies
        id: dependencies
        working-directory: issue1864-candidate/app
        run: |
          timeout --kill-after=10s 240s flutter pub get > ../../format-evidence/pub-get.txt 2>&1

      - name: Format only the shipping helper with inherited configuration
        id: formatter
        working-directory: issue1864-candidate/app
        run: |
          timeout --kill-after=10s 60s dart format lib/util/ui/keyboard_asset_picker.dart > ../../format-evidence/formatter.txt 2>&1

      - name: Retain source, dependency resolution, and exact patches
        if: always() && steps.checkout.outcome == 'success'
        working-directory: issue1864-candidate
        env:
          ISSUE1864_ORIGINAL_RESULT: ${{ steps.original.outcome }}
          ISSUE1864_DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          ISSUE1864_FORMAT_RESULT: ${{ steps.formatter.outcome }}
        run: |
          printf 'original_guard=%s\ndependency_resolution=%s\nformatter=%s\n' "$ISSUE1864_ORIGINAL_RESULT" "$ISSUE1864_DEPENDENCY_RESULT" "$ISSUE1864_FORMAT_RESULT" > ../format-evidence/step-results.txt
          cp "$ISSUE1864_HELPER" ../format-evidence/keyboard_asset_picker.after.dart
          cp app/analysis_options.yaml ../format-evidence/analysis_options.after.yaml
          cp pubspec.lock ../format-evidence/pubspec.resolved.lock
          sha256sum "$ISSUE1864_HELPER" app/lib/util/native/file_picker.dart app/analysis_options.yaml pubspec.lock > ../format-evidence/after-sha256.txt
          git diff --binary -- "$ISSUE1864_HELPER" > ../format-evidence/helper-format.patch
          git diff --binary -- pubspec.lock > ../format-evidence/dependency-resolution.patch
          git diff --binary > ../format-evidence/full-working-tree.patch
          git status --porcelain=v1 --untracked-files=all > ../format-evidence/status-after.txt
          git diff --name-only > ../format-evidence/changed-tracked-files.txt
          git ls-files --others --exclude-standard > ../format-evidence/untracked-files.txt

      - name: Require the helper to be the only source change
        if: success()
        working-directory: issue1864-candidate
        run: |
          test "$(git rev-parse HEAD)" = "$ISSUE1864_CANDIDATE"
          ! git symbolic-ref -q HEAD
          test ! -s ../format-evidence/untracked-files.txt
          # Dependency lock changes are retained separately from the helper patch.
          git diff --name-only -- . ':!pubspec.lock' > ../format-evidence/changed-source-files.txt
          if test -s ../format-evidence/changed-source-files.txt; then
            test "$(cat ../format-evidence/changed-source-files.txt)" = "$ISSUE1864_HELPER"
          fi
          cmp app/analysis_options.yaml ../format-evidence/analysis_options.original.yaml
          printf '%s\n' '023e7d532e2e24685bc30615811b034924f6e33dc2df3196baa525ec5b014cef  app/lib/util/native/file_picker.dart' | sha256sum -c - > ../format-evidence/unchanged-native-hash-check.txt
          cp "$ISSUE1864_HELPER" ../format-evidence/keyboard_asset_picker.formatted.dart
          sha256sum "$ISSUE1864_HELPER" > ../format-evidence/formatted-sha256.txt

      - name: Upload formatting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue1864-helper-format
          path: format-evidence
          if-no-files-found: error
