name: Diagnostic 2973 original Android picker

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Uploaded unmodified official APK bs:// identity
        required: true
      plan:
        description: Reviewed source-only plan (preflight or matrix)
        type: choice
        options: [preflight, observation, matrix]
        default: preflight

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostic-2973
  cancel-in-progress: false

jobs:
  device:
    if: github.repository == 'ShlomoCode/localsend'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
      APK_APP_URL: ${{ inputs.app_url }}
      PICKER_PLAN: ${{ inputs.plan }}
      GH_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded cloud controller
        run: node support/diagnostics/2973/cloud-controller.mjs
      - name: Retain raw evidence regardless of verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-2973-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-2973-evidence
          if-no-files-found: error
          retention-days: 30

  cleanup:
    needs: device
    if: always() && github.repository == 'ShlomoCode/localsend'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BS_SPRINT_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BS_SPRINT_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile and end only this unique owned session
        run: node support/diagnostics/2973/cloud-cleanup.mjs
      - name: Retain independent cleanup verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-2973-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-2973-cleanup
          if-no-files-found: error
