[package]
name = "localsend-cli"
version = "1.18.2"
edition = "2024"

[[bin]]
name = "localsend-cli"
path = "src/main.rs"

[dependencies]
localsend = { path = "../packages/core", features = ["full"] }
localsend-client = { path = "../packages/client" }
anyhow = "1.0"
bytes = "1.11"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6.0"
gethostname = "1.0"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
ratatui-explorer = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
unicode-width = "0.2"

[build-dependencies]
winresource = "0.1"
