[package]
name = "localsend-client"
version = "1.18.2"
edition = "2024"

[dependencies]
localsend = { path = "../core", features = ["full"] }
anyhow = "1.0"
bytes = "1.11"
futures-util = "0.3"
if-addrs = "0.15"
mime_guess = "2.0"
pem = "4.0"
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
