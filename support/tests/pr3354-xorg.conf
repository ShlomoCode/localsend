Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection
Section "Device"
    Identifier "VirtualMonitor"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1280x800" 83.50 1280 1352 1480 1680 800 803 809 831 -HSync +VSync
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "VirtualMonitor"
    Monitor "VirtualMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800"
    EndSubSection
EndSection
